        <div class="result-team-name">${p2Name}</div>
        <label>Goles</label>
        <div class="result-goal-controls">
          <button type="button" class="result-step-btn" data-target="m-s2" data-delta="-1">−</button>
          <input class="result-goal-input" type="number" id="m-s2" min="0" value="${match.score2??0}">
          <button type="button" class="result-step-btn" data-target="m-s2" data-delta="1">+</button>
        </div>
      </div>
    </div>
    <div class="result-live" id="m-live"></div>
    <div>
      <div class="muted" style="margin-bottom:6px;">Marcadores rápidos</div>
      <div class="result-quick" id="m-quick">
        <button type="button" data-s1="0" data-s2="0">0-0</button>
        <button type="button" data-s1="1" data-s2="0">1-0</button>
        <button type="button" data-s1="2" data-s2="1">2-1</button>
        <button type="button" data-s1="0" data-s2="1">0-1</button>
        <button type="button" data-s1="1" data-s2="1">1-1</button>
        <button type="button" data-s1="2" data-s2="2">2-2</button>
        <button type="button" data-s1="3" data-s2="2">3-2</button>
      </div>
    </div>
    ${decisive? `<div class="result-penalties" id="m-pen-wrap">
      <div class="muted" style="margin-bottom:8px;">Si hay empate, registra penaltis para definir ganador.</div>
      <div class="row"><div><label>Penaltis ${p1Name}</label><input type="number" id="m-pn1" min="0"></div><div><label>Penaltis ${p2Name}</label><input type="number" id="m-pn2" min="0"></div></div>
    </div>`:''}
    <div id="m-err" class="muted" style="color:#ffb3ad;"></div>
    <button id="m-submit" class="gold">Guardar resultado</button>
  </div>`);
  const s1El = box.querySelector('#m-s1');
  const s2El = box.querySelector('#m-s2');
  const liveEl = box.querySelector('#m-live');
  const quickBtns = [...box.querySelectorAll('#m-quick button')];
  const stepBtns = [...box.querySelectorAll('.result-step-btn')];
  const penWrap = decisive ? box.querySelector('#m-pen-wrap') : null;
  const pn1El = decisive ? box.querySelector('#m-pn1') : null;
  const pn2El = decisive ? box.querySelector('#m-pn2') : null;

  function updateLiveLine(){
    const g1 = parseInt(s1El.value);
    const g2 = parseInt(s2El.value);
    if(Number.isNaN(g1) || Number.isNaN(g2)){
      liveEl.innerHTML = `${p1Name} <span class="sep">vs</span> ${p2Name}`;
      return;
    }
    liveEl.innerHTML = `${p1Name} <span class="sep">${g1} - ${g2}</span> ${p2Name}`;
  }

  function refreshQuickState(){
    quickBtns.forEach(btn=>{
      const q1 = parseInt(btn.dataset.s1);
      const q2 = parseInt(btn.dataset.s2);
      const active = parseInt(s1El.value)===q1 && parseInt(s2El.value)===q2;
      btn.classList.toggle('active', active);
    });
  }

  function refreshPenaltiesState(){
    if(!decisive || !penWrap) return;
    const s1 = parseInt(s1El.value);
    const s2 = parseInt(s2El.value);
    const isTie = !Number.isNaN(s1) && !Number.isNaN(s2) && s1===s2;
    penWrap.style.display = isTie ? '' : 'none';
    if(!isTie && pn1El && pn2El){
      pn1El.value = '';
      pn2El.value = '';
    }
  }

  quickBtns.forEach(btn=>{
    btn.onclick = ()=>{
      s1El.value = btn.dataset.s1;
      s2El.value = btn.dataset.s2;
      refreshQuickState();
      refreshPenaltiesState();
      updateLiveLine();
    };
  });
  stepBtns.forEach(btn=>{
    btn.onclick = ()=>{
      const targetId = btn.dataset.target;
      const delta = parseInt(btn.dataset.delta || '0');
      const target = targetId==='m-s1' ? s1El : s2El;
      const current = parseInt(target.value);
      const next = Math.max(0, (Number.isNaN(current)?0:current) + delta);
      target.value = String(next);
      refreshQuickState();
      refreshPenaltiesState();
      updateLiveLine();
    };
  });
  s1El.oninput = ()=>{ refreshQuickState(); refreshPenaltiesState(); updateLiveLine(); };
  s2El.oninput = ()=>{ refreshQuickState(); refreshPenaltiesState(); updateLiveLine(); };
  refreshQuickState();
  refreshPenaltiesState();
  updateLiveLine();

  box.querySelector('#m-submit').onclick=()=>{
    const byId = box.querySelector('#m-who').value;
    const s1 = parseInt(s1El.value);
    const s2 = parseInt(s2El.value);
    const pn1 = decisive? (pn1El.value===''? null: parseInt(pn1El.value)) : null;
    const pn2 = decisive? (pn2El.value===''? null: parseInt(pn2El.value)) : null;
    if(isNaN(s1)||isNaN(s2)){ box.querySelector('#m-err').textContent='Indica un marcador.'; return; }
    const err = reportResult(match, byId, s1, s2, pn1, pn2, decisive);
    if(err){ box.querySelector('#m-err').textContent=err; }
    else { pendingModal=null; render(); }
  };
  return box;
}

    const remaining = state.knockoutDraw.startedAt && state.knockoutDraw.nextRevealAt

      : null;

      if(i<state.knockoutDraw.revealed){
        const pair = state.knockoutDraw.pairings[i];
        list.appendChild(el(`<div class="demo-draw-item revealed"><span>Bombo ${i+1}</span><span>${playerName(pair[0])} vs ${playerName(pair[1])}</span></div>`));
      } else {
        list.appendChild(el(`<div class="demo-draw-item pending"><span>Bombo ${i+1}</span><span>Esperando extracción...</span></div>`));
      }
    }
    if(!state.knockoutDraw.startedAt){
      const btn = el(`<button class="gold">Iniciar sorteo animado</button>`);
      btn.onclick=()=>{
        state.knockoutDraw.startedAt = Date.now();
        state.knockoutDraw.nextRevealAt = Date.now();
        processKnockoutDrawClock();
        saveAndRender();
      };
      d.appendChild(btn);
    } else {
      d.appendChild(el(`<div class="muted" style="margin-top:8px;">El siguiente cruce aparecerá automáticamente.</div>`));
    }
    wrap.appendChild(d);
  }

  if(state.champion){
    wrap.appendChild(el(`<div class="champion-box"><div class="trophy">🏆</div><h2>${playerName(state.champion)}</h2><div class="muted">Campeón de ${state.season}</div></div>`));
    const btn = el(`<button class="gold" style="margin-top:16px;">Empezar nueva temporada</button>`);
    btn.onclick=newSeason;
    wrap.appendChild(btn);
  }
  const roundNames = roundLabels(state.bracket.rounds.length);
  state.bracket.rounds.forEach((round,ri)=>{
    const rd = el(`<div class="bracket-round"><h4>${roundNames[ri]}</h4><div class="matchlist"></div></div>`);
    const list = rd.querySelector('.matchlist');
    round.forEach(m=>{
      if(!m.p1 && !m.p2){ list.appendChild(el(`<div class="match"><div class="vs muted">Por determinar</div></div>`)); return; }
      if(!m.p1 || !m.p2){ list.appendChild(el(`<div class="match"><div class="vs">${m.p1?playerName(m.p1):'?'} vs ${m.p2?playerName(m.p2):'?'} <span class="muted">(esperando rival)</span></div></div>`)); return; }
      list.appendChild(renderKnockoutTieRow(m));
    });
    wrap.appendChild(rd);
  });
  return wrap;
}
function roundLabels(total){
  const names=[];
  let size = state.bracket.size;
  for(let i=0;i<total;i++){
    if(size===2) names.push('Final');
    else if(size===4) names.push('Semifinales');
    else if(size===8) names.push('Cuartos de final');
    else if(size===16) names.push('Octavos de final');
    else names.push('Ronda de '+size);
    size = size/2;
  }
  return names;
}

function getGoalStatsByPlayerId(){
  const stats = {};
  state.players.forEach(p=> stats[p.id]={gf:0,gc:0,dg:0});

  state.leagueMatches.forEach(m=>{
    if(m.status!=='confirmed' || m.score1===null || m.score2===null) return;
    stats[m.p1] = stats[m.p1]||{gf:0,gc:0,dg:0};
    stats[m.p2] = stats[m.p2]||{gf:0,gc:0,dg:0};
    stats[m.p1].gf += m.score1; stats[m.p1].gc += m.score2;
    stats[m.p2].gf += m.score2; stats[m.p2].gc += m.score1;
  });

  state.playoffMatches.forEach(m=>{
    if(m.status!=='confirmed' || m.score1===null || m.score2===null) return;
    stats[m.p1] = stats[m.p1]||{gf:0,gc:0,dg:0};
    stats[m.p2] = stats[m.p2]||{gf:0,gc:0,dg:0};
    stats[m.p1].gf += m.score1; stats[m.p1].gc += m.score2;
    stats[m.p2].gf += m.score2; stats[m.p2].gc += m.score1;
  });

  if(state.bracket?.rounds){
    state.bracket.rounds.forEach(round=>{
      round.forEach(tie=>{
        if(tie.legs===2){
          const l1 = tie.leg1;
          const l2 = tie.leg2;
          if(l1 && l1.status==='confirmed' && l1.score1!==null && l1.score2!==null){
            stats[l1.p1] = stats[l1.p1]||{gf:0,gc:0,dg:0};
            stats[l1.p2] = stats[l1.p2]||{gf:0,gc:0,dg:0};
            stats[l1.p1].gf += l1.score1; stats[l1.p1].gc += l1.score2;
            stats[l1.p2].gf += l1.score2; stats[l1.p2].gc += l1.score1;
          }
          if(l2 && l2.status==='confirmed' && l2.score1!==null && l2.score2!==null){
            stats[l2.p1] = stats[l2.p1]||{gf:0,gc:0,dg:0};
            stats[l2.p2] = stats[l2.p2]||{gf:0,gc:0,dg:0};
            stats[l2.p1].gf += l2.score1; stats[l2.p1].gc += l2.score2;
            stats[l2.p2].gf += l2.score2; stats[l2.p2].gc += l2.score1;
          }
        } else if(tie.status==='confirmed' && tie.score1!==null && tie.score2!==null){
          stats[tie.p1] = stats[tie.p1]||{gf:0,gc:0,dg:0};
          stats[tie.p2] = stats[tie.p2]||{gf:0,gc:0,dg:0};
          stats[tie.p1].gf += tie.score1; stats[tie.p1].gc += tie.score2;
          stats[tie.p2].gf += tie.score2; stats[tie.p2].gc += tie.score1;
        }
      });
    });
  }

  Object.keys(stats).forEach(id=>{ stats[id].dg = stats[id].gf - stats[id].gc; });
  return stats;
}

function getMuseumRows(){
  const rowsByName = {};
  const goalStatsById = getGoalStatsByPlayerId();
  state.players.forEach(p=>{
    const totalMoney = state.finance?.lifetimeByPlayer?.[p.id] ?? p.money ?? 0;
    rowsByName[p.name] = {name:p.name, titles:0, seasons:[], money: totalMoney, goalDiff: goalStatsById[p.id]?.dg||0};
  });

  state.pastChampions.forEach(pc=>{
    if(!rowsByName[pc.champion]) rowsByName[pc.champion] = {name:pc.champion, titles:0, seasons:[], money:0, goalDiff:0};
    rowsByName[pc.champion].titles++;
    rowsByName[pc.champion].seasons.push(pc.season+' · '+seasonDateText(pc.kickoff));
  });

  if(state.phase==='finished' && state.champion){
    const currentChampion = playerName(state.champion);
    if(!rowsByName[currentChampion]) rowsByName[currentChampion] = {name:currentChampion, titles:0, seasons:[], money:0, goalDiff:0};
    const alreadyCounted = rowsByName[currentChampion].seasons.includes(state.season);
    if(!alreadyCounted){
      rowsByName[currentChampion].titles++;
      rowsByName[currentChampion].seasons.push(state.season+' (actual) · '+seasonDateText(state.seasonKickoff));
    }
  }

  return Object.values(rowsByName).sort((a,b)=>{
    if(b.titles!==a.titles) return b.titles-a.titles;
    if(b.money!==a.money) return b.money-a.money;
    if(b.goalDiff!==a.goalDiff) return b.goalDiff-a.goalDiff;
    return a.name.localeCompare(b.name,'es');
  });
}

/* ---- MUSEUM TAB ---- */
function renderMuseumTab(){
  const wrap = document.createElement('div');
  const rows = getMuseumRows();
  const totalTitles = rows.reduce((sum,r)=> sum+r.titles, 0);

  wrap.appendChild(el(`<div class="card"><h3>Museo de Jugadores</h3><div class="muted">Cada copa representa una temporada ganada. El museo se acumula con el paso de los años, como una vitrina histórica.</div></div>`));

  if(!rows.length){
    wrap.appendChild(el(`<div class="banner info">Aún no hay jugadores para mostrar en el museo.</div>`));
    return wrap;
  }

  wrap.appendChild(el(`<div class="banner gold">Copas totales registradas: <b>${totalTitles}</b></div>`));

  const grid = el(`<div class="museum-grid"></div>`);
  rows.forEach((r,idx)=>{
    const card = el(`<div class="museum-card">
      <div class="museum-head">
        <div class="museum-name">#${idx+1} · ${r.name}</div>
        <span class="museum-count">${r.titles} copa${r.titles===1?'':'s'}</span>
      </div>
      <div class="muted" style="margin-bottom:8px;">Dinero histórico total: <b>${fmtMoney(r.money||0)}</b></div>
      <div class="muted" style="margin-bottom:8px;">Diferencia de goles (GF-GC): <b>${(r.goalDiff||0)>0?'+':''}${r.goalDiff||0}</b></div>
      <div class="cup-shelf"></div>
      <div class="museum-seasons"></div>
    </div>`);
    const shelf = card.querySelector('.cup-shelf');
    const seasons = card.querySelector('.museum-seasons');

    if(r.titles===0){
      shelf.appendChild(el(`<span class="muted">Sin títulos todavía.</span>`));
      seasons.textContent = 'Temporadas ganadas: —';
    } else {
      for(let i=0;i<r.titles;i++) shelf.appendChild(el(museumCupSvg()));
      seasons.textContent = 'Temporadas ganadas: '+r.seasons.join(', ');
    }

    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  return wrap;
}

/* ---- HISTORY TAB ---- */
function renderHistoryTab(){
  const wrap = document.createElement('div');
  const seasonCard = el(`<div class="card"><h3>Temporada</h3><div class="muted" style="margin-bottom:10px;">Empieza una nueva temporada cuando ya haya campeón.</div></div>`);
  const canStartNewSeason = state.phase==='finished' && !!state.champion;
  const seasonBtn = el(`<button class="gold" ${canStartNewSeason?'':'disabled'}>Iniciar nueva temporada</button>`);
  seasonBtn.onclick=()=> newSeason();
  seasonCard.appendChild(seasonBtn);
  if(!canStartNewSeason){
    seasonCard.appendChild(el(`<div class="muted" style="margin-top:8px;">Este botón se habilita al finalizar la temporada actual.</div>`));
  }
  wrap.appendChild(seasonCard);

  const restartSeasonBtn = el(`<button class="secondary" style="margin-top:10px;">Volver a empezar esta temporada</button>`);
  restartSeasonBtn.onclick=()=>{
    pendingModal = ()=>{
      const bg = el(`<div class="modal-bg"><div class="modal">
        <span class="close">✕</span>
        <h3>Reiniciar temporada actual</h3>
        <div class="muted" style="margin-bottom:10px;">Se borrará todo de la temporada actual, incluyendo jugadores, partidos, cuadro, campeón y dinero.</div>
        <div class="muted" style="margin-bottom:10px;">Introduce la contraseña para reiniciar esta temporada.</div>
        <label>Contraseña</label>
        <input type="password" id="rs-p1" autocomplete="off">
        <div id="rs-err" class="muted" style="color:#ffb3ad;"></div>
        <button id="rs-go" class="danger">Reiniciar temporada actual</button>
      </div></div>`);
      bg.querySelector('.close').onclick=()=>{pendingModal=null; render();};
      bg.querySelector('#rs-go').onclick=()=>{
        const a = bg.querySelector('#rs-p1').value;
        if(!a){ bg.querySelector('#rs-err').textContent='Debes escribir la contraseña.'; return; }
        if(a!==RESTART_SEASON_PASSWORD){
          bg.querySelector('#rs-err').textContent='Contraseña incorrecta.';
          return;
        }
        pendingModal = null;
        restartCurrentSeason();
      };
      return bg;
    };
    render();
  };
  seasonCard.appendChild(restartSeasonBtn);

  const resetCard = el(`<div class="card"><h3>Reseteo maestro</h3><div class="banner warn">Pone todos los contadores a 0 (dinero, temporadas, cuadro, campeón actual) y borra el historial. Conserva solo la lista de jugadores.</div></div>`);
  const resetBtn = el(`<button class="danger">Reset maestro total</button>`);
  resetBtn.onclick=()=>{
    pendingModal = ()=>{
      const hasResetPassword = !!getMasterResetPassword();
      const bg = el(`<div class="modal-bg"><div class="modal">
        <span class="close">✕</span>
        <h3>Confirmar reseteo maestro</h3>
        <div class="muted" style="margin-bottom:10px;">${hasResetPassword ? 'Introduce la contraseña maestra dos veces para confirmar.' : 'No hay contraseña maestra configurada en este dispositivo. Define una ahora y se usará para este y próximos reseteos.'}</div>
        <label>Contraseña (1ª vez)</label>
        <input type="password" id="rm-p1" autocomplete="off">
        <label>Contraseña (2ª vez)</label>
        <input type="password" id="rm-p2" autocomplete="off">
        <div id="rm-err" class="muted" style="color:#ffb3ad;"></div>
        <button id="rm-go" class="danger">Ejecutar reset total</button>
      </div></div>`);
      bg.querySelector('.close').onclick=()=>{pendingModal=null; render();};
      bg.querySelector('#rm-go').onclick=()=>{
        const a = bg.querySelector('#rm-p1').value;
        const b = bg.querySelector('#rm-p2').value;
        if(!a || !b){ bg.querySelector('#rm-err').textContent='Debes escribir la contraseña en ambos campos.'; return; }
        if(a!==b){ bg.querySelector('#rm-err').textContent='Las dos contraseñas no coinciden.'; return; }
        if(!hasResetPassword){
          if(a.length < 8){ bg.querySelector('#rm-err').textContent='La contraseña debe tener al menos 8 caracteres.'; return; }
          setMasterResetPassword(a);
        } else if(a!==getMasterResetPassword()){
          bg.querySelector('#rm-err').textContent='Contraseña maestra incorrecta.';
          return;
        }
        pendingModal = null;
        masterResetAll();
      };
      return bg;
    };
    render();
  };
  resetCard.appendChild(resetBtn);
  wrap.appendChild(resetCard);

  if(state.pastChampions.length){
    const c = el(`<div class="card"><h3>Campeones anteriores</h3></div>`);
    state.pastChampions.forEach(pc=> c.appendChild(el(`<div class="audit"><b>${pc.champion}</b> — ${pc.season} <span style="opacity:.8">· ${seasonDateText(pc.kickoff)}</span> <span style="opacity:.55">(cerrada: ${pc.date})</span></div>`)));
    wrap.appendChild(c);
  }
  const card = el(`<div class="card"><h3>Registro de actividad</h3></div>`);
  if(!state.history.length) card.appendChild(el(`<div class="muted">Sin actividad todavía.</div>`));
  state.history.slice(0,200).forEach(h=> card.appendChild(el(`<div class="audit"><span style="opacity:.6">${h.ts}</span> · <b>${h.actor}</b> ${h.action}</div>`)));
  wrap.appendChild(card);
  return wrap;
}

/* ---------------- BOOT ---------------- */
document.addEventListener('keydown', (ev)=>{
  if(ev.key!=='Escape' || !pendingModal) return;
  if(isMobileSwipeCloseEnabled()) return;
  closePendingModal();
});

loadState();
</script>
