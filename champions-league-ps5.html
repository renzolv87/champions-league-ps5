      <button id="bm-go" class="gold" type="button">Registrar apuesta</button>
    </div></div>`);

    const close = ()=>{ pendingModal=null; render(); };
    bg.querySelector('.close').onclick = close;

    const bettorEl = bg.querySelector('#bm-bettor');
    const pickEl = bg.querySelector('#bm-pick');
    const stakeEl = bg.querySelector('#bm-stake');
    const maxEl = bg.querySelector('#bm-max');
    const presetsEl = bg.querySelector('#bm-presets');
    const errEl = bg.querySelector('#bm-err');

    bettorEl.value = `${bettors[0].name} (${fmtMoney(bettors[0].money||0)})`;
    bettorEl.dataset.playerId = bettors[0].id;
    fillPickOptions(pickEl, match);

    function selectedBettorId(){
      return bettorEl.dataset.playerId;
    }
    function refreshStakeOptions(){
      const pid = selectedBettorId();
      const maxStake = pid ? getMaxStakeForPlayer(pid) : 0;
      maxEl.textContent = `Máximo que puedes apostar: ${fmtMoney(maxStake)}`;
      presetsEl.innerHTML = '';
      let selected = null;
      getStakePresets(maxStake).forEach((amount, idx)=>{
        const b = el(`<button type="button" class="small ${idx===2?'active':''}">${fmtMoney(amount)}</button>`);
        if(idx===2) selected = amount;
        b.onclick = ()=>{
          selected = amount;
          stakeEl.value = String(amount);
          presetsEl.querySelectorAll('button').forEach(x=> x.classList.remove('active'));
          b.classList.add('active');
        };

      });
      stakeEl.value = selected!==null ? String(selected) : '';
    }

    refreshStakeOptions();

    bg.querySelector('#bm-go').onclick = ()=>{
      const playerId = selectedBettorId();
      const pick = pickEl.value;

    };

    return bg;
  };
  render();
}
function placeBet(playerId, matchId, pick, stake){
  const bettor = findPlayer(playerId);
  if(!bettor) return t('errBettorNotFound');
  if(!isLocallyControlledPlayer(playerId)) return t('errBetOnlyLocal');
  const isLeagueMode = state.phase==='league';
  const isKnockoutMode = state.phase==='knockout' || state.phase==='playoff';
  if(!isLeagueMode && !isKnockoutMode) return t('errBetOnlyLeagueOrKo');
  if(isKnockoutMode && getQualifiedIds().includes(playerId)) return t('errBetOnlyNonQualifiedKo');
  const match = isLeagueMode
    ? state.leagueMatches.find(m=> m.id===matchId)
    : getBettableMatches().find(m=> m.id===matchId);
  if(!match) return t('errBetMatchUnavailable');
  if(isLeagueMode && (match.p1===playerId || match.p2===playerId)){
    return t('errBetLeagueNonParticipantOnly');
  }
  if(match.status==='confirmed') return t('errBetMatchClosed');
  if(!['home','draw','away'].includes(pick)) return t('errInvalidBetPick');
  if(Number.isNaN(stake) || stake<=0) return t('errInvalidBetAmount');
  if(getOpenBetTicket(playerId, matchId)) return t('errBetAlreadyOpen');
  const maxStake = getMaxStakeForPlayer(playerId);
  if(stake>maxStake) return tf('errBetMaxStake', { amount: fmtMoney(maxStake) });
  if(stake>(bettor.money||0)) return t('errBetInsufficientBalance');

  bettor.money -= stake;
  state.bets.tickets.push({
    id: uid(),
    season: state.season,
    playerId,
    matchId,
    homeName: playerName(match.p1),
    awayName: playerName(match.p2),
    pick,
    stake,
    status:'open',
    settledAt:null,
    payout:0,
    won:false
  });
  log(playerName(playerId), `apostó ${fmtMoney(stake)} en ${playerName(match.p1)} vs ${playerName(match.p2)} (${getPickLabelForMatch(match, pick)}).`);
  saveAndRender();
  return null;
}
function settleBetsForMatch(match){
  const option = getBetOptionFromMatch(match);
  if(!option) return;
  const open = state.bets.tickets.filter(t=> t.matchId===match.id && t.status==='open');
  if(!open.length) return;

  open.forEach(t=>{
    const bettor = findPlayer(t.playerId);
    if(!bettor){ t.status='void'; t.settledAt=nowStr(); return; }
    t.status='settled';
    t.settledAt = nowStr();
    if(t.pick===option){
      // Cuota fija simple 2.0: recupera stake y gana stake.
      const grossPayout = t.stake * 2;
      const ceiling = getBetMoneyCeiling();
      const maxAdd = Math.max(0, Math.floor(ceiling - (bettor.money||0)));
      const applied = Math.max(0, Math.min(grossPayout, maxAdd));
      if(applied>0){
        bettor.money += applied;
        state.finance.lifetimeByPlayer[t.playerId] = (state.finance.lifetimeByPlayer[t.playerId]||0) + applied;
      }
      t.payout = applied;
      t.won = applied>0;
      log('Sistema', `${playerName(t.playerId)} ${applied>0?'ganó':'acertó pero alcanzó el tope de apuestas,'} ${applied>0?fmtMoney(applied):'sin cobro adicional'} en apuesta del partido ${playerName(match.p1)} vs ${playerName(match.p2)}.`);
    } else {
      t.payout = 0;
      t.won = false;
      log('Sistema', `${playerName(t.playerId)} perdió ${fmtMoney(t.stake)} en apuesta del partido ${playerName(match.p1)} vs ${playerName(match.p2)}.`);
    }
  });
}

function registerLeagueMoney(match){
  const kBase = `league:${match.id}`;
  if(match.score1>match.score2){
    addMoney(match.p1, state.finance.prizes.leagueWin, `${kBase}:w:${match.p1}`, 'victoria en liguilla');
  } else if(match.score2>match.score1){
    addMoney(match.p2, state.finance.prizes.leagueWin, `${kBase}:w:${match.p2}`, 'victoria en liguilla');
  } else {
    addMoney(match.p1, state.finance.prizes.leagueDraw, `${kBase}:d:${match.p1}`, 'empate en liguilla');
    addMoney(match.p2, state.finance.prizes.leagueDraw, `${kBase}:d:${match.p2}`, 'empate en liguilla');
  }
}

function reportResult(match, byId, score1, score2, peno1, peno2, decisive){
  const player = findPlayer(byId);
  if(!player) return t('errPlayerNotFound');
  if(!isLocallyControlledPlayer(byId)) return t('errReportOnlyLocal');
  if(match.p1!==byId && match.p2!==byId) return t('errNotParticipant');
  if(match.status==='pending') return t('errMatchPendingDecision');
  if(match.mustReReportBy && byId!==match.mustReReportBy) return t('errMustRereportByReporter');

  if(decisive && score1===score2){
    if(peno1===null||peno2===null||peno1===peno2) return t('errDecisiveNeedsPenalties');
  }

  const proposed = { byId, score1, score2, peno1: decisive&&score1===score2?peno1:null, peno2: decisive&&score1===score2?peno2:null };

  match.score1 = score1;
  match.score2 = score2;
  match.peno1 = proposed.peno1;
  match.peno2 = proposed.peno2;
  match.status = 'pending';
  match.reportedBy = byId;
  match.confirmedBy = null;
  match.dispute = null;
  match.mustReReportBy = null;
  match.winner = null;

  log(player.name, 'propuso el resultado '+score1+'-'+score2+(match.peno1!==null?` (pen. ${match.peno1}-${match.peno2})`:''));
  saveAndRender();
  return null;
}

function acceptReportedResult(match, byId, decisive){
  const player = findPlayer(byId);
  if(!player) return t('errPlayerNotFound');
  if(!isLocallyControlledPlayer(byId)) return t('errAcceptOnlyLocal');
  if(match.status!=='pending') return t('errMatchNotPending');
  if(byId!==match.p1 && byId!==match.p2) return t('errNotParticipant');
  if(byId===match.reportedBy) return t('errReporterCannotSelfConfirm');

  match.status='confirmed';
  match.confirmedBy = byId;
  match.mustReReportBy = null;
  if(decisive){
    if(match.score1>match.score2) match.winner=match.p1;
    else if(match.score2>match.score1) match.winner=match.p2;
    else match.winner = match.peno1>match.peno2? match.p1: match.p2;
  }
  if(state.phase==='league') registerLeagueMoney(match);
  if(state.phase==='league') settleBetsForMatch(match);
  if(state.phase==='knockout' || state.phase==='playoff') settleBetsForMatch(match);
  refreshLeagueAfterConfirmedResult();
  if(state.phase==='league') currentTab = 'league';
  log(player.name, 'aceptó el resultado '+match.score1+'-'+match.score2+(match.peno1!==null?` (pen. ${match.peno1}-${match.peno2})`:''));
  saveAndRender();
  return null;
}

function rejectReportedResult(match, byId){
  const player = findPlayer(byId);
  if(!player) return t('errPlayerNotFound');
  if(!isLocallyControlledPlayer(byId)) return t('errRejectOnlyLocal');
  if(match.status!=='pending') return t('errMatchNotPending');
  if(byId!==match.p1 && byId!==match.p2) return t('errNotParticipant');
  if(byId===match.reportedBy) return t('errReporterCannotSelfReject');

  const reporterId = match.reportedBy;
  const reporterName = playerName(reporterId);
  match.score1 = null;
  match.score2 = null;
  match.peno1 = null;
  match.peno2 = null;
  match.status = 'empty';
  match.confirmedBy = null;
  match.dispute = null;
  match.winner = null;
  match.mustReReportBy = reporterId;

  log(player.name, 'rechazó el resultado reportado por '+reporterName+'. '+reporterName+' debe cargarlo de nuevo.');
  saveAndRender();
  return null;
}

function refreshLeagueAfterConfirmedResult(){
  if(state.phase!=='league') return;
  // Mantiene la clasificación de liguilla sincronizada al confirmar/aceptar resultados.
  state.config.numQualifiers = effectiveNumQualifiers();
}

function adminOverride(match, score1, score2, peno1, peno2, decisive){
  match.score1=score1;
  match.score2=score2;
  match.peno1 = decisive&&score1===score2? peno1: null;
  match.peno2 = decisive&&score1===score2? peno2: null;
  match.status='confirmed';
  match.confirmedBy='admin';
  match.mustReReportBy = null;
  if(decisive){
    if(score1>score2) match.winner=match.p1;
    else if(score2>score1) match.winner=match.p2;
    else match.winner = match.peno1>match.peno2? match.p1: match.p2;
  }
  if(state.phase==='league') registerLeagueMoney(match);
  if(state.phase==='league') settleBetsForMatch(match);
  if(state.phase==='knockout' || state.phase==='playoff') settleBetsForMatch(match);
  refreshLeagueAfterConfirmedResult();
  if(state.phase==='league') currentTab = 'league';
  log('Organizador','resolvió/corrigió el resultado a '+score1+'-'+score2+(match.peno1!==null?` (pen. ${match.peno1}-${match.peno2})`:''));
  saveAndRender();
  return null;
}

function saveAndRender(){
  if(state.phase==='knockout') propagateBracket();

function startLeague(){
  const ids = state.players.map(p=>p.id);
  if(ids.length<4){
    state.setupNeedsAssociates = true;
    render();
    return tf('associateModeEnabled', { count: MIN_TEAMS_FOR_KNOCKOUT - ids.length });
  }
  state.setupNeedsAssociates = false;
  if(!state.seasonKickoff) state.seasonKickoff = dayStr();
  state.players.forEach(p=> addMoney(p.id, state.finance.prizes.participation, `season:${state.season}:participation:${p.id}`, 'participación en Champions'));
  const groups = buildLeagueGroups(ids);
  let matches = [];
  if(groups.length){
    matches = generateLeagueMatchesFromGroups(groups);
    if(!matches.length) return t('errCouldNotGenerateLeague');
    state.leagueGroups = groups;
  } else {
    const targetRounds = autoMatchesPerPlayer(ids.length);
    let rounds = generateRoundRobinRounds(ids, targetRounds);
    rounds = rounds.map(round=> round.filter(([a,b])=> !cannotFaceEachOther(a,b))).filter(pairs=> pairs.length>0);
    if(!rounds.length) return t('errCouldNotGenerateLeague');
    rounds.forEach((pairs, rIdx)=>{
      pairs.forEach(([a,b])=> matches.push({id:uid(), round:rIdx+1, p1:a, p2:b, score1:null,score2:null,
        status:'empty', reportedBy:null, confirmedBy:null, dispute:null, mustReReportBy:null}));
    });
    state.leagueGroups = [];
  }
  state.leagueMatches = matches;
  state.phase='league';
  if(state.leagueGroups.length){
    log('Organizador', 'inició fase de grupos: '+state.leagueGroups.map(g=> `${g.name} (${g.players.length})`).join(', ')+'.');
  } else {
    const roundsCount = Math.max(0, ...matches.map(m=> Number(m.round)||0));
    log('Organizador','inició la fase de liguilla ('+roundsCount+' jornadas).');
  }
  saveAndRender();
}

function closeLeague(){
  const qualification = leagueQualificationSnapshot();
  state.config.numQualifiers = qualification.totalQ;
  const tied = unresolvedQualificationTieIds(qualification);
  if(tied.length){
    return t('errUnresolvedCutoffTie');
  }
  const seeded = [];
  qualification.groups.forEach(group=>{
    group.standings.slice(0, group.slots).forEach((row, idx)=>{
      seeded.push({
        id: row.id,
        name: row.name,
        pts: row.pts,
        dg: row.dg,
        gf: row.gf,
        groupRank: idx+1
      });
    });
  });
  seeded.sort((a,b)=>{
    if(a.groupRank!==b.groupRank) return a.groupRank-b.groupRank;
    if(b.pts!==a.pts) return b.pts-a.pts;
    if(b.dg!==a.dg) return b.dg-a.dg;
    if(b.gf!==a.gf) return b.gf-a.gf;
    return a.name.localeCompare(b.name, 'es-ES');
  });
  const qualifiers = seeded.map(s=> s.id);
  state.qualifiers = qualifiers;
  const Qn = qualifiers.length;
  const P = nearestPow2LE(Qn);
  const directCount = 2*P - Qn;
  const direct = qualifiers.slice(0, directCount);
  const playoffPool = qualifiers.slice(directCount);

  if(playoffPool.length===0){
    const drawErr = startKnockoutDraw(qualifiers, P);
    if(drawErr) return drawErr;
    const entry = firstKnockoutBonusBySize(P);
    if(entry){
      qualifiers.forEach(pid=> addMoney(pid, entry.amount, `ko:${state.season}:entry:${entry.key}:${pid}`, entry.label));
    }
    state.phase='knockout';
    log('Organizador','cerró la liguilla y generó el cuadro de eliminatorias directamente.');
  } else {
    const playoffPairs = buildAllowedPairings(playoffPool);
    if(!playoffPairs) return t('errCouldNotGeneratePlayoff');
    const pairs=[];
    for(let i=0;i<playoffPairs.length;i++){
      pairs.push({id:uid(), seedSlot: directCount+i+1, p1: playoffPairs[i][0], p2: playoffPairs[i][1],
        score1:null,score2:null,peno1:null,peno2:null,status:'empty',reportedBy:null,confirmedBy:null,dispute:null,mustReReportBy:null});
    }
    state.playoffMatches = pairs;
    state._directQualifiers = direct;
    state._bracketSize = P;
    state.phase='playoff';
    log('Organizador','cerró la liguilla. '+direct.length+' jugadores pasan directos y '+pairs.length+' partidos de play-off decidirán el resto del cuadro.');
  }
  saveAndRender();
  return null;
}

function resolveTieByPenalties(ids, penaltiesById){
  const values = ids.map(id=> penaltiesById[id]);
  if(values.some(v=> Number.isNaN(v) || v<0)) return t('errTiePenaltiesRequiredAll');
  if(new Set(values).size!==values.length) return t('errTiePenaltiesMustBeUnique');

  const order = [...ids].sort((a,b)=> penaltiesById[b]-penaltiesById[a]);
  order.forEach((id,i)=> state.tieResolution[id]=i);
  const resume = order.map(id=> `${playerName(id)} ${penaltiesById[id]}`).join(' · ');
  log('Organizador','desempate por tanda de penaltis en liguilla: '+resume);
  saveAndRender();
  return null;
}

function closePlayoff(){
  const allDecided = state.playoffMatches.every(m=> m.status==='confirmed' && m.winner);
  if(!allDecided) return t('errPlayoffNotAllDecided');
  const seedMap={};
  state._directQualifiers.forEach((id,i)=> seedMap[i+1]=id);
  state.playoffMatches.forEach(m=> seedMap[m.seedSlot]=m.winner);
  const entrants = Object.values(seedMap);
  const drawErr = startKnockoutDraw(entrants, state._bracketSize);
  if(drawErr) return drawErr;
  const entry = firstKnockoutBonusBySize(state._bracketSize);
  if(entry){
    entrants.forEach(pid=> addMoney(pid, entry.amount, `ko:${state.season}:entry:${entry.key}:${pid}`, entry.label));
  }
  state.phase='knockout';
  log('Organizador','cerró el play-off y generó el cuadro final de eliminatorias.');
  saveAndRender();
  return null;
}

function el(html){ const d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; }

function isMobileSwipeCloseEnabled(){
  try{
    if(window.matchMedia && window.matchMedia('(pointer: coarse)').matches) return true;
    if(typeof navigator!=='undefined' && navigator.maxTouchPoints>0) return true;
  }catch(_err){}
  return false;
}

function closePendingModal(){
  if(!pendingModal) return;
  if(demoDrawState) resetDemoDrawState();
  pendingModal = null;
  render();
}

function getScrollableParentWithinModal(start, modalEl){
  let cur = start instanceof Element ? start : null;
  while(cur && cur!==modalEl){
    const style = window.getComputedStyle(cur);
    const canScrollY = /(auto|scroll)/.test(style.overflowY || '') && cur.scrollHeight>cur.clientHeight+2;
    if(canScrollY) return cur;
    cur = cur.parentElement;
  }
  const modalStyle = window.getComputedStyle(modalEl);
  const modalScroll = /(auto|scroll)/.test(modalStyle.overflowY || '') && modalEl.scrollHeight>modalEl.clientHeight+2;
  return modalScroll ? modalEl : null;
}

function attachMobileSwipeToClose(modalRoot){
  if(!modalRoot || !isMobileSwipeCloseEnabled()) return;
  const modalEl = modalRoot.querySelector('.modal');
  if(!modalEl) return;

  let startX = 0;
  let startY = 0;
  let active = false;
  let startsNearTop = false;
  let startsAtTopScroll = false;

  modalEl.addEventListener('touchstart', (ev)=>{
    if(!ev.touches || ev.touches.length!==1) return;
    const t = ev.touches[0];
    startX = t.clientX;
    startY = t.clientY;
    active = true;
    const rect = modalEl.getBoundingClientRect();
    startsNearTop = (startY - rect.top) <= 130;
    const scrollable = getScrollableParentWithinModal(ev.target, modalEl);
    startsAtTopScroll = !scrollable || scrollable.scrollTop<=1;
  }, {passive:true});

  modalEl.addEventListener('touchend', (ev)=>{
    if(!active || !ev.changedTouches || !ev.changedTouches.length) return;
    active = false;
    const t = ev.changedTouches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    if(startsNearTop && startsAtTopScroll && dy>85 && Math.abs(dx)<80){
      closePendingModal();
    }
  }, {passive:true});
}

/* ---- LEAGUE TAB ---- */
function renderLeagueTab(){
  const wrap = document.createElement('div');
  if(state.phase==='setup'){
    wrap.appendChild(el(`<div class="banner info">${t('leagueNotStarted')}</div>`));
    return wrap;
  }

  // standings
  const qualification = leagueQualificationSnapshot();
  const Q = qualification.totalQ;
  const pendingWithScore = state.leagueMatches.filter(m=> m.status==='pending' && m.score1!==null && m.score2!==null).length;
  state.config.numQualifiers = Q;
  const card = el(`<div class="card"><h3>${t('standingsTitle')}</h3></div>`);
  const tiedIds = state.phase==='league' ? unresolvedQualificationTieIds(qualification) : [];

  function appendCell(row, value, cls){
    const td = document.createElement('td');
    if(cls) td.className = cls;
    td.textContent = String(value);
    row.appendChild(td);
    return td;
  }

  qualification.groups.forEach((group, groupIdx)=>{
    if(qualification.groupMode){
      const slotsLabel = ` · ${group.slots} clasifica${group.slots===1?'':'n'}`;
      card.appendChild(el(`<div class="muted" style="margin:${groupIdx?12:2}px 0 6px;font-weight:800;">${group.name}${slotsLabel}</div>`));
    }
    const tableWrap = el(`<table>
      <thead><tr><th>#</th><th class="name">Jugador</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>DG</th><th>Pts</th></tr></thead>
      <tbody></tbody>
    </table>`);
    const tableBody = tableWrap.querySelector('tbody');
    group.standings.forEach((s,i)=>{
      const name = (s?.name || '').trim() || 'Jugador';
      const displayName = s?.id ? playerDisplayName(s.id) : name;
      const pj = Number.isFinite(Number(s?.pj)) ? Number(s.pj) : 0;
      const g = Number.isFinite(Number(s?.g)) ? Number(s.g) : 0;
      const e = Number.isFinite(Number(s?.e)) ? Number(s.e) : 0;
      const p = Number.isFinite(Number(s?.p)) ? Number(s.p) : 0;
      const dg = Number.isFinite(Number(s?.dg)) ? Number(s.dg) : 0;
      const pts = Number.isFinite(Number(s?.pts)) ? Number(s.pts) : 0;
      const tr = document.createElement('tr');
      if(i<group.slots) tr.classList.add('qual');
      if(tiedIds.includes(s.id)) tr.classList.add('tied');
      appendCell(tr, i+1);
      appendCell(tr, displayName, 'name');
      appendCell(tr, pj);
      appendCell(tr, g);
      appendCell(tr, e);
      appendCell(tr, p);
      appendCell(tr, `${dg>0?'+':''}${dg}`);
      const ptsCell = appendCell(tr, pts);
      ptsCell.style.fontWeight = '700';
      tableBody.appendChild(tr);
    });
    if(!group.standings.length){
      const tr = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = 8;
      td.className = 'muted';
      td.textContent = t('standingsNoData');
      tr.appendChild(td);
      tableBody.appendChild(tr);
    }
    card.appendChild(tableWrap);
  });

  const split = qualification.groupMode
    ? ` · ${qualification.groups.map(g=> `${g.name}: ${g.slots}`).join(' · ')}`
    : '';
  card.appendChild(el(`<div class="muted" style="margin-top:8px;">${tf('standingsQualifiedTop',{count:Q})}${split}</div>`));
  if(pendingWithScore>0){
    card.appendChild(el(`<div class="muted" style="margin-top:6px;">${tf('standingsProvisional',{count:pendingWithScore})}</div>`));
  }
  wrap.appendChild(card);

  if(tiedIds.length){
    const tieCard = el(`<div class="card"><div class="banner warn">${tf('tieCutoffLong',{names:tiedIds.map(id=> playerDisplayName(id)).join(', ')})}</div></div>`);

    if(isThreePlayersThreeDrawsInvalid(tiedIds)){
      tieCard.appendChild(el(`<div class="banner warn">${t('invalidSeasonLong')}</div>`));
      const rb = el(`<button class="danger">${t('restartInvalidSeasonBtn')}</button>`);
      rb.onclick=()=> restartInvalidLeagueSeason();
      tieCard.appendChild(rb);
      wrap.appendChild(tieCard);
    } else {
      const activeTb = state.leagueTieBreaker && sameIdSet(state.leagueTieBreaker.ids, tiedIds) ? state.leagueTieBreaker : null;
      if(!activeTb){
        tieCard.appendChild(el(`<div class="muted" style="margin-bottom:8px;">El sistema generará cruces aleatorios entre los empatados y avanzará por rondas de tandas de penaltis hasta dejar un único ganador.</div>`));
        const btn = el(`<button class="danger">Generar cruces aleatorios de penaltis</button>`);
        btn.onclick=()=>{
          const err = startLeagueTieBreaker(tiedIds);
          if(err) alert(err);
        };
        tieCard.appendChild(btn);
      } else {
        tieCard.appendChild(el(`<div class="muted" style="margin-bottom:8px;">Desempate en curso · Ronda ${activeTb.round}${activeTb.bye?` · Descansa: ${playerDisplayName(activeTb.bye)}`:''}</div>`));
        const list = el(`<div class="matchlist"></div>`);
        activeTb.pairings.forEach(pair=>{
          const scoreTxt = pair.pen1!==null ? `${pair.pen1}-${pair.pen2}` : t('tiePending');

          }
          list.appendChild(row);
        });
        tieCard.appendChild(list);
      }
      wrap.appendChild(tieCard);
    }
  }

  if(state.phase==='league'){
    if(state.players.length===3){
      const bettingCard = el(`<div class="card"><h3>${t('restPlayerBetTitle')}</h3><div class="muted" style="margin-bottom:8px;">${t('restPlayerBetHint')}</div></div>`);
      wrap.appendChild(bettingCard);
    }
    wrap.appendChild(renderBetActivityBoard('Panel de apuestas de la liguilla'));

    const closeCard = el(`<div class="card"><h3>${t('leagueCalendarTitle')}</h3></div>`);
    closeCard.appendChild(el(`<div class="muted" style="margin-bottom:8px;">${t('antiCheatBanner')}</div>`));
    const ml = el(`<div class="matchlist"></div>`);
    if(qualification.groupMode){
      qualification.groups.forEach(group=>{
        const groupMatches = state.leagueMatches.filter(m=> m.group===group.id);
        if(!groupMatches.length) return;
        ml.appendChild(el(`<div class="muted" style="margin:10px 0 4px;font-weight:800;">${group.name}</div>`));
        const byRound = {};
        groupMatches.forEach(m=> (byRound[m.round]=byRound[m.round]||[]).push(m));
        Object.keys(byRound).sort((a,b)=>a-b).forEach(r=>{
          ml.appendChild(el(`<div class="muted" style="margin:8px 0 4px;font-weight:700;">Jornada ${r}</div>`));
          byRound[r].forEach(m=> ml.appendChild(renderMatchRow(m, false)));
        });
      });
    } else {
      const byRound = {};
      state.leagueMatches.forEach(m=> (byRound[m.round]=byRound[m.round]||[]).push(m));
      Object.keys(byRound).sort((a,b)=>a-b).forEach(r=>{
        ml.appendChild(el(`<div class="muted" style="margin:10px 0 4px;font-weight:700;">Jornada ${r}</div>`));
        byRound[r].forEach(m=> ml.appendChild(renderMatchRow(m, false)));
      });
    }
    closeCard.appendChild(ml);
    wrap.appendChild(closeCard);

    const allConfirmed = state.leagueMatches.every(m=>m.status==='confirmed');
    const closeBtn = el(`<button class="gold" ${(!allConfirmed||tiedIds.length)?'disabled':''}>${t('closeLeagueBtn')}</button>`);
    closeBtn.onclick=()=>{
      const err = closeLeague();
      if(err) alert(err);
    };
    wrap.appendChild(closeBtn);
    if(!allConfirmed) wrap.appendChild(el(`<div class="muted" style="margin-top:8px;">${t('pendingMatchesConfirm')}</div>`));
  } else {
    const ml = el(`<div class="card"><h3>${t('leagueResultsTitle')}</h3><div class="matchlist"></div></div>`);
    const list = ml.querySelector('.matchlist');
    if(qualification.groupMode){
      qualification.groups.forEach(group=>{
        const groupMatches = state.leagueMatches.filter(m=> m.group===group.id);
        if(!groupMatches.length) return;
        list.appendChild(el(`<div class="muted" style="margin:8px 0 4px;font-weight:800;">${group.name}</div>`));
        groupMatches.forEach(m=> list.appendChild(renderMatchRow(m,false)));
      });
    } else {
      state.leagueMatches.forEach(m=> list.appendChild(renderMatchRow(m,false)));
    }
    wrap.appendChild(ml);
  }

  if(state.phase==='playoff'){
    const poCard = el(`<div class="card"><h3>${t('playoffClassTitle')}</h3><div class="muted" style="margin-bottom:8px;">${t('playoffClassHint')}</div><div class="matchlist"></div></div>`);
    const list = poCard.querySelector('.matchlist');
    state.playoffMatches.forEach(m=> list.appendChild(renderMatchRow(m,true)));
    wrap.appendChild(poCard);
    const allDone = state.playoffMatches.every(m=>m.status==='confirmed'&&m.winner);
    const btn = el(`<button class="gold" ${allDone?'':'disabled'}>${t('closePlayoffBtn')}</button>`);
    btn.onclick=()=>{ const err = closePlayoff(); if(err) alert(err); };
    wrap.appendChild(btn);
  }
  return wrap;
}

/* ---- generic match row with report/confirm UI ---- */
function renderMatchRow(m, decisive){
  const p1 = playerDisplayName(m.p1), p2 = playerDisplayName(m.p2);
  const scoreTxt = m.score1!==null ? `${m.score1} - ${m.score2}` + (m.peno1!==null? ` (pen. ${m.peno1}-${m.peno2})`: '') : '— vs —';
  const row = el(`<div class="match">
    <div class="vs"><span>${p1}</span><span>${scoreTxt}</span><span>${p2}</span></div>
    <span class="tag ${m.status}">${({empty:t('matchStatusEmpty'),pending:t('matchStatusPending'),confirmed:t('matchStatusConfirmed'),dispute:t('matchStatusDispute')})[m.status]}</span>
  </div>`);
  const canAct = canActOnMatch(m);

  if(canAct){
    const btnLabel = m.status==='confirmed' ? t('matchBtnFix') : (m.status==='pending' ? t('matchBtnConfirm') : t('matchBtnResult'));
    const btn = el(`<button class="small secondary">${btnLabel}</button>`);
    btn.onclick=()=> openMatchModal(m, decisive, m.status==='confirmed');
    row.appendChild(btn);
  }
  if(canOpenBetForMatch(m)){
    const betBtn = el(`<button class="small gold" type="button">${t('betBtn')}</button>`);
    betBtn.onclick=()=> openBetForMatchModal(m.id);
    row.appendChild(betBtn);
  }
  return row;
}

function canActOnMatch(match){
  const localIds = getLocalPlayerIds();
  if(!localIds.length || !match) return false;
  if(match.status==='pending'){
    const expectedDecider = match.reportedBy===match.p1 ? match.p2 : (match.reportedBy===match.p2 ? match.p1 : null);
    return localIds.includes(expectedDecider);
  }
  return localIds.includes(match.p1) || localIds.includes(match.p2);
}

function ensureTieLeg(tie, idx){
  const key = idx===1 ? 'leg1' : 'leg2';
  if(!tie[key]){
    tie[key] = {
      id: uid(),
      p1: tie.p1,
      p2: tie.p2,
      score1: null,
      score2: null,
      peno1: null,
      peno2: null,
      status: 'empty',
      reportedBy: null,
      confirmedBy: null,
      dispute: null,
      mustReReportBy: null
    };
  }
  tie[key].p1 = tie.p1;
  tie[key].p2 = tie.p2;
  return tie[key];
}

function updateTieWinner(tie){
  if(tie.legs===1){
    if(tie.status!=='confirmed') return;
    if(tie.score1>tie.score2) tie.winner=tie.p1;
    else if(tie.score2>tie.score1) tie.winner=tie.p2;
    else if(tie.peno1!==null && tie.peno2!==null && tie.peno1!==tie.peno2) tie.winner = tie.peno1>tie.peno2 ? tie.p1 : tie.p2;
    return;
  }

  const l1 = tie.leg1, l2 = tie.leg2;
  tie.winner = null;
  tie.status = 'empty';
  if(!l1 || !l2) return;
  if(l1.status!=='confirmed' || l2.status!=='confirmed') return;

  const agg1 = l1.score1 + l2.score1;
  const agg2 = l1.score2 + l2.score2;
  tie.agg1 = agg1;
  tie.agg2 = agg2;
  tie.winner = null;
  if(agg1>agg2){ tie.winner=tie.p1; tie.status='confirmed'; }
  else if(agg2>agg1){ tie.winner=tie.p2; tie.status='confirmed'; }
  else if(tie.aggPeno1!==null && tie.aggPeno2!==null && tie.aggPeno1!==tie.aggPeno2){
    tie.winner = tie.aggPeno1>tie.aggPeno2 ? tie.p1 : tie.p2;
    tie.status = 'confirmed';
    tie.dispute = null;
  }
  else { tie.status='dispute'; tie.dispute = {aggregate:true}; }
}

function setAggregatePenaltyWinner(tie, p1, p2){
  if(tie.legs!==2) return t('errSeriesNotTwoLeg');
  if(isNaN(p1)||isNaN(p2)) return t('errBothPenaltiesRequired');
  if(p1===p2) return t('errPenaltiesNoDraw');
  tie.aggPeno1 = p1;
  tie.aggPeno2 = p2;
  updateTieWinner(tie);
  if(!tie.winner) return t('errCannotDefineWinner');
  log('Organizador', 'registró penaltis de desempate global: '+playerName(tie.p1)+' '+p1+'-'+p2+' '+playerName(tie.p2)+'.');
  saveAndRender();
  return null;
}

function openAggregatePenaltyModal(tie){
  pendingModal = ()=>{
    const bg = el(`<div class="modal-bg"><div class="modal">
      <span class="close">✕</span>
      <h3>Penaltis de desempate global</h3>
      <div class="muted" style="margin-bottom:8px;">${playerName(tie.p1)} vs ${playerName(tie.p2)} · Global ${tie.agg1}-${tie.agg2}</div>
      <div class="row">
        <div><label>Penaltis ${playerName(tie.p1)}</label><input type="number" id="agg-p1" min="0" value="${tie.aggPeno1??''}"></div>
        <div><label>Penaltis ${playerName(tie.p2)}</label><input type="number" id="agg-p2" min="0" value="${tie.aggPeno2??''}"></div>
      </div>
      <div id="agg-err" class="muted" style="color:#ffb3ad;"></div>
      <button id="agg-save" class="gold">Guardar penaltis</button>
    </div></div>`);
    bg.querySelector('.close').onclick=()=>{pendingModal=null; render();};
    bg.querySelector('#agg-save').onclick=()=>{
      const p1 = parseInt(bg.querySelector('#agg-p1').value);
      const p2 = parseInt(bg.querySelector('#agg-p2').value);
      const err = setAggregatePenaltyWinner(tie, p1, p2);
      if(err){ bg.querySelector('#agg-err').textContent = err; return; }
      pendingModal=null;
      render();
    };
    return bg;
  };
  render();
}

function openLeagueTiePairPenaltyModal(pairingId){
  const tb = state.leagueTieBreaker;
  if(!tb) return;
  const pair = tb.pairings.find(p=> p.id===pairingId);
  if(!pair) return;

  pendingModal = ()=>{
    const bg = el(`<div class="modal-bg"><div class="modal">
      <span class="close">✕</span>
      <h3>Tanda de penaltis de desempate</h3>
      <div class="muted" style="margin-bottom:8px;">Ronda ${tb.round}: ${playerName(pair.p1)} vs ${playerName(pair.p2)}</div>
      <div class="row">
        <div><label>Penaltis ${playerName(pair.p1)}</label><input type="number" id="lt-p1" min="0" value="${pair.pen1??''}"></div>
        <div><label>Penaltis ${playerName(pair.p2)}</label><input type="number" id="lt-p2" min="0" value="${pair.pen2??''}"></div>
      </div>
      <div id="lt-err" class="muted" style="color:#ffb3ad;"></div>
      <button id="lt-save" class="danger">Guardar tanda</button>
    </div></div>`);
    bg.querySelector('.close').onclick=()=>{pendingModal=null; render();};
    bg.querySelector('#lt-save').onclick=()=>{
      const p1 = parseInt(bg.querySelector('#lt-p1').value);
      const p2 = parseInt(bg.querySelector('#lt-p2').value);
      const err = submitLeagueTiePenalty(pairingId, p1, p2);
      if(err){ bg.querySelector('#lt-err').textContent = err; return; }
      pendingModal=null;
      render();
    };
    return bg;
  };
  render();
}

function renderKnockoutTieRow(tie){
  const box = el(`<div class="card bracket-tie-card" style="padding:12px;"></div>`);
  const title = tie.legs===1
    ? `${playerDisplayName(tie.p1)} vs ${playerDisplayName(tie.p2)} · Final`
    : `${playerDisplayName(tie.p1)} vs ${playerDisplayName(tie.p2)} · Ida y vuelta`;
  box.appendChild(el(`<div style="font-weight:700;margin-bottom:8px;">${title}</div>`));

  if(tie.legs===2){
    const leg1 = ensureTieLeg(tie, 1);
    const leg2 = ensureTieLeg(tie, 2);
    box.appendChild(el(`<div class="muted" style="margin-bottom:6px;">${t('firstLeg')}</div>`));
    box.appendChild(renderMatchRow(leg1, false));
    box.appendChild(el(`<div class="muted" style="margin-top:8px;margin-bottom:6px;">${t('secondLeg')}</div>`));
    box.appendChild(renderMatchRow(leg2, false));
    updateTieWinner(tie);
    const aggTxt = (tie.agg1!==null&&tie.agg2!==null) ? tf('aggregateScore',{a:tie.agg1,b:tie.agg2}) : t('aggregatePending');
    const penTxt = tie.aggPeno1!==null && tie.aggPeno2!==null ? ` · ${t('penaltiesShort')}: ${tie.aggPeno1}-${tie.aggPeno2}` : '';
    box.appendChild(el(`<div class="muted" style="margin-top:8px;">${aggTxt}${penTxt}${tie.winner?` · ${t('qualifiedLabel')}: <b>${playerDisplayName(tie.winner)}</b>`:''}</div>`));
    if(tie.dispute?.aggregate){
      const rb = el(`<button class="small gold" style="margin-top:8px;">Registrar penaltis de desempate</button>`);
      rb.onclick=()=> openAggregatePenaltyModal(tie);
      box.appendChild(rb);
    }
  } else {
    box.appendChild(renderMatchRow(tie, true));
    if(tie.winner){
      box.appendChild(el(`<div class="muted" style="margin-top:8px;">${t('qualifiedLabel')}: <b>${playerDisplayName(tie.winner)}</b></div>`));
    }
  }
  return box;
}

function openMatchModal(match, decisive, isAdminEdit){
  if(!isAdminEdit && match?.status!=='dispute' && !canActOnMatch(match)){
    return;
  }
  const disputeText = match.status==='dispute' && match.dispute
    ? (match.dispute.aggregate
      ? 'Empate global tras ida y vuelta. Solo el organizador puede resolverlo.'
      : `${playerName(match.p1)} reportó ${match.dispute.first.score1}-${match.dispute.first.score2}${match.dispute.first.peno1!==null?` (pen ${match.dispute.first.peno1}-${match.dispute.first.peno2})`:''}, y la otra parte indicó ${match.dispute.second.score1}-${match.dispute.second.score2}${match.dispute.second.peno1!==null?` (pen ${match.dispute.second.peno1}-${match.dispute.second.peno2})`:''}. Solo el organizador puede resolverlo abajo.`)
    : '';
  pendingModal = ()=>{
    const bg = el(`<div class="modal-bg"><div class="modal">
      <span class="close">✕</span>
      <h3>${playerDisplayName(match.p1)} vs ${playerDisplayName(match.p2)}</h3>
      ${match.status==='dispute'? `<div class="banner warn">En disputa: ${disputeText}</div>`:''}
    </div></div>`);
    const modal = bg.querySelector('.modal');
    const form = (isAdminEdit || match.status==='dispute')
      ? renderAdminForm(match, decisive)
      : (match.status==='pending' ? renderPendingDecisionForm(match, decisive) : renderPlayerForm(match, decisive));
    if(!(isAdminEdit || match.status==='dispute' || match.status==='pending')){
      modal.classList.add('result-modal');
    }
    modal.appendChild(form);
    bg.querySelector('.close').onclick=()=>{pendingModal=null; render();};
    return bg;
  };
  render();
}

function renderPlayerForm(match, decisive){

  const box = el(`<div class="result-entry">

          <input class="result-goal-input" type="number" id="m-s2" min="0" value="${match.score2??0}">
          <button type="button" class="result-step-btn" data-target="m-s2" data-delta="1">+</button>
        </div>
      </div>
    </div>
    <div class="result-live" id="m-live"></div>
    <div>
      <div class="muted" style="margin-bottom:6px;">Marcadores rápidos</div>
      <div class="result-quick" id="m-quick">
        <button type="button" data-s1="0" data-s2="0">0-0</button>
        <button type="button" data-s1="1" data-s2="0">1-0</button>
        <button type="button" data-s1="2" data-s2="1">2-1</button>
        <button type="button" data-s1="0" data-s2="1">0-1</button>
        <button type="button" data-s1="1" data-s2="1">1-1</button>
        <button type="button" data-s1="2" data-s2="2">2-2</button>
        <button type="button" data-s1="3" data-s2="2">3-2</button>
      </div>
    </div>
    ${decisive? `<div class="result-penalties" id="m-pen-wrap">
      <div class="muted" style="margin-bottom:8px;">Si hay empate, registra penaltis para definir ganador.</div>
      <div class="row"><div><label>Penaltis ${p1Name}</label><input type="number" id="m-pn1" min="0"></div><div><label>Penaltis ${p2Name}</label><input type="number" id="m-pn2" min="0"></div></div>
    </div>`:''}
    <div id="m-err" class="muted" style="color:#ffb3ad;"></div>
    <button id="m-submit" class="gold">Guardar resultado</button>
  </div>`);
  const s1El = box.querySelector('#m-s1');
  const s2El = box.querySelector('#m-s2');
  const liveEl = box.querySelector('#m-live');
  const quickBtns = [...box.querySelectorAll('#m-quick button')];
  const stepBtns = [...box.querySelectorAll('.result-step-btn')];
  const penWrap = decisive ? box.querySelector('#m-pen-wrap') : null;
  const pn1El = decisive ? box.querySelector('#m-pn1') : null;
  const pn2El = decisive ? box.querySelector('#m-pn2') : null;

  function updateLiveLine(){
    const g1 = parseInt(s1El.value);
    const g2 = parseInt(s2El.value);
    if(Number.isNaN(g1) || Number.isNaN(g2)){
      liveEl.innerHTML = `${p1Name} <span class="sep">vs</span> ${p2Name}`;
      return;
    }
    liveEl.innerHTML = `${p1Name} <span class="sep">${g1} - ${g2}</span> ${p2Name}`;
  }

  function refreshQuickState(){
    quickBtns.forEach(btn=>{
      const q1 = parseInt(btn.dataset.s1);
      const q2 = parseInt(btn.dataset.s2);
      const active = parseInt(s1El.value)===q1 && parseInt(s2El.value)===q2;
      btn.classList.toggle('active', active);
    });
  }

  function refreshPenaltiesState(){
    if(!decisive || !penWrap) return;
    const s1 = parseInt(s1El.value);
    const s2 = parseInt(s2El.value);
    const isTie = !Number.isNaN(s1) && !Number.isNaN(s2) && s1===s2;
    penWrap.style.display = isTie ? '' : 'none';
    if(!isTie && pn1El && pn2El){
      pn1El.value = '';
      pn2El.value = '';
    }
  }

  quickBtns.forEach(btn=>{
    btn.onclick = ()=>{
      s1El.value = btn.dataset.s1;
      s2El.value = btn.dataset.s2;
      refreshQuickState();
      refreshPenaltiesState();
      updateLiveLine();
    };
  });
  stepBtns.forEach(btn=>{
    btn.onclick = ()=>{
      const targetId = btn.dataset.target;
      const delta = parseInt(btn.dataset.delta || '0');
      const target = targetId==='m-s1' ? s1El : s2El;
      const current = parseInt(target.value);
      const next = Math.max(0, (Number.isNaN(current)?0:current) + delta);
      target.value = String(next);
      refreshQuickState();
      refreshPenaltiesState();
      updateLiveLine();
    };
  });
  s1El.oninput = ()=>{ refreshQuickState(); refreshPenaltiesState(); updateLiveLine(); };
  s2El.oninput = ()=>{ refreshQuickState(); refreshPenaltiesState(); updateLiveLine(); };
  refreshQuickState();
  refreshPenaltiesState();
  updateLiveLine();

  box.querySelector('#m-submit').onclick=()=>{
    const byId = box.querySelector('#m-who').value;
    const s1 = parseInt(s1El.value);
    const s2 = parseInt(s2El.value);
    const pn1 = decisive? (pn1El.value===''? null: parseInt(pn1El.value)) : null;
    const pn2 = decisive? (pn2El.value===''? null: parseInt(pn2El.value)) : null;
    if(isNaN(s1)||isNaN(s2)){ box.querySelector('#m-err').textContent='Indica un marcador.'; return; }
    const err = reportResult(match, byId, s1, s2, pn1, pn2, decisive);
    if(err){ box.querySelector('#m-err').textContent=err; }
    else { pendingModal=null; render(); }
  };
  return box;
}

function renderKnockoutTab(){
  const wrap = document.createElement('div');
  if(!state.bracket){
    wrap.appendChild(el(`<div class="banner info">${t('knockoutNoBracket')}</div>`));
    return wrap;
  }

  const nonQualified = getNonQualifiedIds();
  if(state.phase==='knockout' && nonQualified.length){
    const ceiling = getBetMoneyCeiling();
    const card = el(`<div class="card"><h3>${t('knockoutBetsTitle')}</h3><div class="muted" style="margin-bottom:8px;">${t('knockoutBetsHint')}</div></div>`);
    card.appendChild(el(`<div class="muted" style="margin-bottom:8px;">${tf('knockoutBetsCap',{ceiling:`<b>${fmtMoney(ceiling)}</b>`, pct:`<b>${Math.round(state.bets.maxStakePct*100)}</b>`})}</div>`));

    wrap.appendChild(card);
  }
  if(state.phase==='knockout'){
    wrap.appendChild(renderBetActivityBoard(t('knockoutBetBoardTitle')));
  }

  if(state.knockoutDraw && !state.knockoutDraw.complete){
    const remaining = state.knockoutDraw.startedAt && state.knockoutDraw.nextRevealAt
      ? Math.max(0, Math.ceil((state.knockoutDraw.nextRevealAt - Date.now())/1000))
      : null;
    const d = el(`<div class="card demo-draw-card"><div class="demo-draw-head"><h3 style="margin:0;">${t('knockoutDrawTitle')}</h3><div class="demo-draw-status">${state.knockoutDraw.startedAt ? tf('drawStatusNextIn',{seconds: remaining ?? 10}) : t('drawStatusReady')}</div></div><div class="muted" style="margin-bottom:8px;">${t('drawRevealEvery10s')}</div><div id="draw-list" class="demo-draw-list"></div></div>`);
    const list = d.querySelector('#draw-list');
    const total = state.knockoutDraw.pairings.length;
    for(let i=0;i<total;i++){
      if(i<state.knockoutDraw.revealed){
        const pair = state.knockoutDraw.pairings[i];
        list.appendChild(el(`<div class="demo-draw-item revealed"><span>${tf('drawPotLabel',{n:i+1})}</span><span>${playerName(pair[0])} vs ${playerName(pair[1])}</span></div>`));
      } else {
        list.appendChild(el(`<div class="demo-draw-item pending"><span>${tf('drawPotLabel',{n:i+1})}</span><span>${t('drawWaitingExtraction')}</span></div>`));
      }
    }
    if(!state.knockoutDraw.startedAt){
      const btn = el(`<button class="gold">${t('startAnimatedDraw')}</button>`);
      btn.onclick=()=>{
        state.knockoutDraw.startedAt = Date.now();
        state.knockoutDraw.nextRevealAt = Date.now();
        processKnockoutDrawClock();
        saveAndRender();
      };
      d.appendChild(btn);
    } else {
      d.appendChild(el(`<div class="muted" style="margin-top:8px;">${t('nextPairAuto')}</div>`));
    }
    wrap.appendChild(d);
  }

  if(state.champion){
    wrap.appendChild(el(`<div class="champion-box"><div class="trophy">🏆</div><h2>${playerName(state.champion)}</h2><div class="muted">${tf('championOfSeason',{season:state.season})}</div></div>`));
    const btn = el(`<button class="gold" style="margin-top:16px;">${t('startNewSeasonBtn')}</button>`);
    btn.onclick=newSeason;
    wrap.appendChild(btn);
  }
  const roundNames = roundLabels(state.bracket.rounds.length);
  const board = el(`<div class="bracket-board"></div>`);
  const championPathKeys = new Set();
  if(state.champion){
    const tracedPlayers = new Set([state.champion]);
    for(let ri=state.bracket.rounds.length-1; ri>=0; ri--){
      const round = state.bracket.rounds[ri];
      round.forEach((tie,mi)=>{
        if(!tie?.winner || !tracedPlayers.has(tie.winner)) return;
        championPathKeys.add(`${ri}-${mi}`);
        if(tie.p1) tracedPlayers.add(tie.p1);
        if(tie.p2) tracedPlayers.add(tie.p2);
      });
    }
  }
  state.bracket.rounds.forEach((round,ri)=>{
    const depthClass = `round-depth-${Math.min(ri+1,6)}`;
    const rd = el(`<div class="bracket-col"><div class="bracket-col-head">${roundNames[ri]}</div><div class="bracket-col-body ${depthClass}"></div></div>`);
    const list = rd.querySelector('.bracket-col-body');
    const isLastCol = ri===state.bracket.rounds.length-1;
    round.forEach((m,mi)=>{
      const tieKey = `${ri}-${mi}`;
      const isChampionPath = championPathKeys.has(tieKey);
      const decisionKey = m?.winner ? `${state.season}|${ri}|${mi}|${m.winner}` : null;
      const isNewlyDecided = !!decisionKey && !bracketRevealSeen.has(decisionKey);
      if(isNewlyDecided) bracketRevealSeen.add(decisionKey);
      if(!m.p1 && !m.p2){
        list.appendChild(el(`<div class="bracket-node ${isLastCol?'last-col':''}"><div class="bracket-placeholder">Por determinar</div></div>`));
        return;
      }
      if(!m.p1 || !m.p2){
        list.appendChild(el(`<div class="bracket-node ${isLastCol?'last-col':''}"><div class="bracket-placeholder pending">${m.p1?playerDisplayName(m.p1):'?'} vs ${m.p2?playerDisplayName(m.p2):'?'} <span class="muted">(esperando rival)</span></div></div>`));
        return;
      }
      const tieCard = renderKnockoutTieRow(m);
      tieCard.classList.add('bracket-tie-card');
      if(m.winner) tieCard.classList.add('winner-locked');
      if(isChampionPath) tieCard.classList.add('champion-path');
      if(isNewlyDecided) tieCard.classList.add('newly-decided');
      const node = el(`<div class="bracket-node ${isLastCol?'last-col':''} ${m.winner?'resolved':''} ${isChampionPath?'champion-path':''} ${isNewlyDecided?'newly-decided':''}"></div>`);
      node.appendChild(tieCard);
      list.appendChild(node);
    });
    board.appendChild(rd);
  });
  wrap.appendChild(board);
  return wrap;
}
function roundLabels(total){
  const names=[];
  let size = state.bracket.size;
  for(let i=0;i<total;i++){
    if(size===2) names.push(t('roundFinal'));
    else if(size===4) names.push(t('roundSemifinals'));
    else if(size===8) names.push(t('roundQuarterfinals'));
    else if(size===16) names.push(t('roundRoundOf16'));
    else names.push(tf('roundOfN',{size}));
    size = size/2;
  }
  return names;
}

function getGoalStatsByPlayerId(){
  const stats = {};
  state.players.forEach(p=> stats[p.id]={gf:0,gc:0,dg:0});

  state.leagueMatches.forEach(m=>{
    if(m.status!=='confirmed' || m.score1===null || m.score2===null) return;
    stats[m.p1] = stats[m.p1]||{gf:0,gc:0,dg:0};
    stats[m.p2] = stats[m.p2]||{gf:0,gc:0,dg:0};
    stats[m.p1].gf += m.score1; stats[m.p1].gc += m.score2;
    stats[m.p2].gf += m.score2; stats[m.p2].gc += m.score1;
  });

  state.playoffMatches.forEach(m=>{
    if(m.status!=='confirmed' || m.score1===null || m.score2===null) return;
    stats[m.p1] = stats[m.p1]||{gf:0,gc:0,dg:0};
    stats[m.p2] = stats[m.p2]||{gf:0,gc:0,dg:0};
    stats[m.p1].gf += m.score1; stats[m.p1].gc += m.score2;
    stats[m.p2].gf += m.score2; stats[m.p2].gc += m.score1;
  });

  if(state.bracket?.rounds){
    state.bracket.rounds.forEach(round=>{
      round.forEach(tie=>{
        if(tie.legs===2){
          const l1 = tie.leg1;
          const l2 = tie.leg2;
          if(l1 && l1.status==='confirmed' && l1.score1!==null && l1.score2!==null){
            stats[l1.p1] = stats[l1.p1]||{gf:0,gc:0,dg:0};
            stats[l1.p2] = stats[l1.p2]||{gf:0,gc:0,dg:0};
            stats[l1.p1].gf += l1.score1; stats[l1.p1].gc += l1.score2;
            stats[l1.p2].gf += l1.score2; stats[l1.p2].gc += l1.score1;
          }
          if(l2 && l2.status==='confirmed' && l2.score1!==null && l2.score2!==null){
            stats[l2.p1] = stats[l2.p1]||{gf:0,gc:0,dg:0};
            stats[l2.p2] = stats[l2.p2]||{gf:0,gc:0,dg:0};
            stats[l2.p1].gf += l2.score1; stats[l2.p1].gc += l2.score2;
            stats[l2.p2].gf += l2.score2; stats[l2.p2].gc += l2.score1;
          }
        } else if(tie.status==='confirmed' && tie.score1!==null && tie.score2!==null){
          stats[tie.p1] = stats[tie.p1]||{gf:0,gc:0,dg:0};
          stats[tie.p2] = stats[tie.p2]||{gf:0,gc:0,dg:0};
          stats[tie.p1].gf += tie.score1; stats[tie.p1].gc += tie.score2;
          stats[tie.p2].gf += tie.score2; stats[tie.p2].gc += tie.score1;
        }
      });
    });
  }

  Object.keys(stats).forEach(id=>{ stats[id].dg = stats[id].gf - stats[id].gc; });
  return stats;
}

function getMuseumRows(){
  const rowsByName = {};
  const goalStatsById = getGoalStatsByPlayerId();
  state.players.forEach(p=>{
    const totalMoney = state.finance?.lifetimeByPlayer?.[p.id] ?? p.money ?? 0;
    rowsByName[p.name] = {name:p.name, titles:0, seasons:[], money: totalMoney, goalDiff: goalStatsById[p.id]?.dg||0};
  });

  state.pastChampions.forEach(pc=>{
    if(!rowsByName[pc.champion]) rowsByName[pc.champion] = {name:pc.champion, titles:0, seasons:[], money:0, goalDiff:0};
    rowsByName[pc.champion].titles++;
    rowsByName[pc.champion].seasons.push(pc.season+' · '+seasonDateText(pc.kickoff));
  });

  if(state.phase==='finished' && state.champion){
    const currentChampion = playerName(state.champion);
    if(!rowsByName[currentChampion]) rowsByName[currentChampion] = {name:currentChampion, titles:0, seasons:[], money:0, goalDiff:0};
    const alreadyCounted = rowsByName[currentChampion].seasons.includes(state.season);
    if(!alreadyCounted){
      rowsByName[currentChampion].titles++;
      rowsByName[currentChampion].seasons.push(state.season+' (actual) · '+seasonDateText(state.seasonKickoff));
    }
  }

  return Object.values(rowsByName).sort((a,b)=>{
    if(b.titles!==a.titles) return b.titles-a.titles;
    if(b.money!==a.money) return b.money-a.money;
    if(b.goalDiff!==a.goalDiff) return b.goalDiff-a.goalDiff;
    return a.name.localeCompare(b.name,'es');
  });
}

/* ---- MUSEUM TAB ---- */
function renderMuseumTab(){
  const wrap = document.createElement('div');
  const rows = getMuseumRows();
  const totalTitles = rows.reduce((sum,r)=> sum+r.titles, 0);

  wrap.appendChild(el(`<div class="card"><h3>${t('museumTitle')}</h3><div class="muted">${t('museumIntro')}</div></div>`));

  if(!rows.length){
    wrap.appendChild(el(`<div class="banner info">${t('museumNoPlayers')}</div>`));
    return wrap;
  }

  wrap.appendChild(el(`<div class="banner gold">${tf('totalCups',{count:`<b>${totalTitles}</b>`})}</div>`));

  const grid = el(`<div class="museum-grid"></div>`);
  rows.forEach((r,idx)=>{
    const card = el(`<div class="museum-card">
      <div class="museum-head">
        <div class="museum-name">#${idx+1} · ${r.name}</div>
        <span class="museum-count">${r.titles} copa${r.titles===1?'':'s'}</span>
      </div>
      <div class="muted" style="margin-bottom:8px;">Dinero histórico total: <b>${fmtMoney(r.money||0)}</b></div>
      <div class="muted" style="margin-bottom:8px;">Diferencia de goles (GF-GC): <b>${(r.goalDiff||0)>0?'+':''}${r.goalDiff||0}</b></div>
      <div class="cup-shelf"></div>
      <div class="museum-seasons"></div>
    </div>`);
    const shelf = card.querySelector('.cup-shelf');
    const seasons = card.querySelector('.museum-seasons');

    if(r.titles===0){
      shelf.appendChild(el(`<span class="muted">${t('noTitlesYet')}</span>`));
      seasons.textContent = `${t('wonSeasons')}: —`;
    } else {
      for(let i=0;i<r.titles;i++) shelf.appendChild(el(museumCupSvg()));
      seasons.textContent = `${t('wonSeasons')}: `+r.seasons.join(', ');
    }

    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  return wrap;
}

/* ---- HISTORY TAB ---- */
function renderHistoryTab(){
  const wrap = document.createElement('div');
  const seasonCard = el(`<div class="card"><h3>${t('seasonWord')} ${seasonTagLabel()}</h3><div class="muted" style="margin-bottom:10px;">${t('historySeasonIntro')}</div></div>`);
  const canStartNewSeason = state.phase==='finished' && !!state.champion;
  const seasonBtn = el(`<button class="gold" ${canStartNewSeason?'':'disabled'}>${t('startNewSeasonBtn')}</button>`);
  seasonBtn.onclick=()=> newSeason();
  seasonCard.appendChild(seasonBtn);
  if(!canStartNewSeason){
    seasonCard.appendChild(el(`<div class="muted" style="margin-top:8px;">${t('historyEnableAfterSeason')}</div>`));
  }
  wrap.appendChild(seasonCard);

  const restartSeasonBtn = el(`<button class="secondary" style="margin-top:10px;">${t('historyRestartSeasonBtn')}</button>`);
  restartSeasonBtn.onclick=()=>{
    pendingModal = ()=>{
      const bg = el(`<div class="modal-bg"><div class="modal">
        <span class="close">✕</span>
        <h3>Reiniciar temporada actual</h3>
        <div class="muted" style="margin-bottom:10px;">Se borrará todo de la temporada actual, incluyendo jugadores, partidos, cuadro, campeón y dinero.</div>
        <div class="muted" style="margin-bottom:10px;">Introduce la contraseña para reiniciar esta temporada.</div>
        <label>Contraseña</label>
        <input type="password" id="rs-p1" autocomplete="off">
        <div id="rs-err" class="muted" style="color:#ffb3ad;"></div>
        <button id="rs-go" class="danger">Reiniciar temporada actual</button>
      </div></div>`);
      bg.querySelector('.close').onclick=()=>{pendingModal=null; render();};
      bg.querySelector('#rs-go').onclick=()=>{
        const a = bg.querySelector('#rs-p1').value;
        if(!a){ bg.querySelector('#rs-err').textContent='Debes escribir la contraseña.'; return; }
        if(a!==RESTART_SEASON_PASSWORD){
          bg.querySelector('#rs-err').textContent='Contraseña incorrecta.';
          return;
        }
        pendingModal = null;
        restartCurrentSeason();
      };
      return bg;
    };
    render();
  };
  seasonCard.appendChild(restartSeasonBtn);

  const resetCard = el(`<div class="card"><h3>${t('masterResetTitle')}</h3><div class="banner warn">${t('masterResetWarn')}</div></div>`);
  const resetBtn = el(`<button class="danger">Reset maestro total</button>`);
  resetBtn.onclick=()=>{
    pendingModal = ()=>{
      const hasResetPassword = !!getMasterResetPassword();
      const bg = el(`<div class="modal-bg"><div class="modal">
        <span class="close">✕</span>
        <h3>Confirmar reseteo maestro</h3>
        <div class="muted" style="margin-bottom:10px;">${hasResetPassword ? 'Introduce la contraseña maestra dos veces para confirmar.' : 'No hay contraseña maestra configurada en este dispositivo. Define una ahora y se usará para este y próximos reseteos.'}</div>
        <label>Contraseña (1ª vez)</label>
        <input type="password" id="rm-p1" autocomplete="off">
        <label>Contraseña (2ª vez)</label>
        <input type="password" id="rm-p2" autocomplete="off">
        <div id="rm-err" class="muted" style="color:#ffb3ad;"></div>
        <button id="rm-go" class="danger">Ejecutar reset total</button>
      </div></div>`);
      bg.querySelector('.close').onclick=()=>{pendingModal=null; render();};
      bg.querySelector('#rm-go').onclick=()=>{
        const a = bg.querySelector('#rm-p1').value;
        const b = bg.querySelector('#rm-p2').value;
        if(!a || !b){ bg.querySelector('#rm-err').textContent='Debes escribir la contraseña en ambos campos.'; return; }
        if(a!==b){ bg.querySelector('#rm-err').textContent='Las dos contraseñas no coinciden.'; return; }
        if(!hasResetPassword){
          if(a.length < 8){ bg.querySelector('#rm-err').textContent='La contraseña debe tener al menos 8 caracteres.'; return; }
          setMasterResetPassword(a);
        } else if(a!==getMasterResetPassword()){
          bg.querySelector('#rm-err').textContent='Contraseña maestra incorrecta.';
          return;
        }
        pendingModal = null;
        masterResetAll();
      };
      return bg;
    };
    render();
  };
  resetCard.appendChild(resetBtn);
  wrap.appendChild(resetCard);

  if(state.pastChampions.length){
    const c = el(`<div class="card"><h3>${t('pastChampionsTitle')}</h3></div>`);
    state.pastChampions.forEach(pc=> c.appendChild(el(`<div class="audit"><b>${pc.champion}</b> — ${pc.season} <span style="opacity:.8">· ${seasonDateText(pc.kickoff)}</span> <span style="opacity:.55">(cerrada: ${pc.date})</span></div>`)));
    wrap.appendChild(c);
  }
  const card = el(`<div class="card"><h3>${t('activityLogTitle')}</h3></div>`);
  if(!state.history.length) card.appendChild(el(`<div class="muted">${t('noActivityYet')}</div>`));
  state.history.slice(0,200).forEach(h=> card.appendChild(el(`<div class="audit"><span style="opacity:.6">${h.ts}</span> · <b>${h.actor}</b> ${h.action}</div>`)));
  wrap.appendChild(card);
  return wrap;
}

function detectDeviceProfile(){
  const ua = (navigator.userAgent || '').toLowerCase();
  const touchPoints = Number(navigator.maxTouchPoints || 0);
  const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  const isIPhone = /iphone/.test(ua);
  const isIPad = /ipad/.test(ua) || (navigator.platform==='MacIntel' && touchPoints>1);
  if(isIPhone) return 'iphone';
  if(isIPad) return 'ipad';
  if(coarse && window.innerWidth<=760) return 'iphone';
  if(coarse && window.innerWidth>760) return 'ipad';
  return 'macos';
}

function applyDeviceProfile(){
  const profile = detectDeviceProfile();
  const orientation = (window.matchMedia && window.matchMedia('(orientation: landscape)').matches) ? 'landscape' : 'portrait';
  document.body.classList.remove('platform-macos','platform-iphone','platform-ipad','orientation-portrait','orientation-landscape');
  document.body.classList.add(`platform-${profile}`);
  document.body.classList.add(`orientation-${orientation}`);
}

/* ---------------- BOOT ---------------- */
document.addEventListener('keydown', (ev)=>{
  if(ev.key!=='Escape' || !pendingModal) return;
  if(isMobileSwipeCloseEnabled()) return;
  closePendingModal();
});

loadState();
window.addEventListener('resize', ()=>{ applyDeviceProfile(); });
window.addEventListener('orientationchange', ()=>{ applyDeviceProfile(); });
</script>
