<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Champions PS5</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap');

:root{
  --bg:#eef2fb;
  --surface:#ffffff;
  --surface-2:#edf3ff;
  --line:#c6d5f2;
  --accent:#003da5;
  --accent-2:#00a3e0;
  --gold:#dbe7ff;
  --good:#00a3e0;
  --bad:#cf2f3f;
  --text:#091d4a;
  --text-dim:#395487;
  --shadow-soft:0 14px 36px rgba(0,24,94,.12);
  --shadow-pop:0 8px 24px rgba(0,61,165,.28);
  --ucl-glow:0 0 0 1px rgba(0,163,224,.22) inset, 0 10px 24px rgba(0,61,165,.14);
  --ucl-panel-grad:linear-gradient(180deg,rgba(255,255,255,.97),rgba(241,247,255,.93));
}
*{box-sizing:border-box;}
html,body{min-height:100%;}
body{
  margin:0;
  color:var(--text);
  font-family:'Manrope',system-ui,sans-serif;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(900px 300px at -10% -5%, rgba(0,61,165,.22), transparent 65%),
    radial-gradient(800px 320px at 105% 0%, rgba(0,163,224,.2), transparent 60%),
    radial-gradient(circle at 22% 20%, rgba(255,255,255,.26) 0 2px, transparent 3px),
    radial-gradient(circle at 74% 28%, rgba(255,255,255,.2) 0 2px, transparent 3px),
    radial-gradient(circle at 52% 62%, rgba(255,255,255,.16) 0 1.5px, transparent 3px),
    repeating-linear-gradient(120deg, rgba(0,61,165,.03) 0 16px, rgba(0,163,224,.02) 16px 32px),
    var(--bg);
}
h1,h2,h3,.disp{
  font-family:'Montserrat',sans-serif;
  letter-spacing:.2px;
}
.app{
  max-width:min(1180px,96vw);
  margin:0 auto;
  padding:clamp(14px,2vw,26px) clamp(12px,2vw,24px) 90px;
  animation: appEnter .5s ease;
}
@keyframes appEnter{
  from{opacity:.2;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}

.hero{
  position:relative;
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:18px;
  flex-wrap:wrap;
  background:
    radial-gradient(220px 120px at 12% 10%, rgba(64,156,255,.25), transparent 70%),
    radial-gradient(240px 130px at 88% 10%, rgba(0,163,224,.22), transparent 70%),
    linear-gradient(135deg, #061a56, #002d87 55%, #0046b8);
  border:1px solid rgba(170,206,255,.32);
  border-radius:20px;
  padding:16px 16px 14px;
  box-shadow:0 20px 42px rgba(0,20,78,.42);
  overflow:hidden;
}
.hero::before{
  content:'';
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 15% 74%, rgba(255,255,255,.17) 0 1.5px, transparent 3px),
    radial-gradient(circle at 42% 68%, rgba(255,255,255,.14) 0 1.5px, transparent 3px),
    radial-gradient(circle at 71% 80%, rgba(255,255,255,.12) 0 1.5px, transparent 3px);
  pointer-events:none;
}
.hero::after{
  content:'';
  position:absolute;
  inset:auto -60px -75px auto;
  width:200px;
  height:200px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.2) 0%, rgba(255,255,255,0) 70%);
  pointer-events:none;
}
.hero .crest{width:48px;height:48px;flex:0 0 auto;filter:drop-shadow(0 3px 4px rgba(0,0,0,.12));}
.hero h1{font-size:clamp(1.4rem,2.3vw,2.1rem);margin:0;line-height:1;color:#f4f8ff;font-weight:900;}
.hero .sub{color:#c9dcff;font-size:clamp(.8rem,1.2vw,.95rem);margin-top:4px;font-weight:700;}
.brand-strip{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.brand-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(196,221,255,.35);
  border-radius:999px;
  padding:5px 11px;
  font-size:.72rem;
  font-weight:800;
  letter-spacing:.3px;
  color:#f1f7ff;
  box-shadow:0 2px 0 rgba(0,0,0,.14);
  backdrop-filter:blur(2px);
}
.brand-badge .icon{font-size:.9rem;}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.hero-guide-btn{
  background:linear-gradient(160deg, rgba(255,255,255,.18), rgba(255,255,255,.08));
  color:#f4f8ff;
  border:1px solid rgba(197,222,255,.45);
  border-radius:999px;
  padding:7px 14px;
  font-size:.76rem;
  font-weight:900;
  letter-spacing:.25px;
  box-shadow:0 6px 16px rgba(0,12,52,.28);
  transition:transform .18s ease, box-shadow .18s ease;
}
.hero-guide-btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,18,82,.34);}
.hero-theme-btn{
  background:linear-gradient(160deg, rgba(0,163,224,.28), rgba(64,156,255,.2));
  color:#f0f7ff;
  border-color:rgba(141,201,255,.6);
  box-shadow:0 6px 16px rgba(0,34,112,.28);
}

body.theme-night{
  --bg:#050d22;
  --surface:#0f1d44;
  --surface-2:#162b5d;
  --line:#2c4687;
  --accent:#003da5;
  --accent-2:#00a3e0;
  --gold:#dbe7ff;
  --good:#00a3e0;
  --bad:#fb7185;
  --text:#e8f0ff;
  --text-dim:#c2d4ff;
  background:
    radial-gradient(900px 320px at -10% -5%, rgba(78,161,255,.2), transparent 65%),
    radial-gradient(850px 340px at 110% 0%, rgba(0,163,224,.16), transparent 65%),
    repeating-linear-gradient(120deg, rgba(78,161,255,.04) 0 16px, rgba(0,163,224,.02) 16px 32px),
    #050d22;
}
body.theme-night .hero,
body.theme-night .card,
body.theme-night .modal,
body.theme-night .match,
body.theme-night .player-tile,
body.theme-night .bet-ticket,
body.theme-night .demo-box,
body.theme-night .demo-draw-card,
body.theme-night .museum-card,

body.theme-night .step,
body.theme-night table,
body.theme-night input,
body.theme-night select,
body.theme-night .brand-badge,
body.theme-night .player-chip,
body.theme-night .result-team-box,
body.theme-night .result-live,
body.theme-night .demo-line{

}
body.theme-night .card,
body.theme-night .match,
body.theme-night .player-tile,
body.theme-night .museum-card,
body.theme-night .bet-ticket{
  box-shadow:0 6px 22px rgba(0,0,0,.28);
}
body.theme-night .card::before{opacity:.78;}
body.theme-night .brand-badge{box-shadow:0 3px 10px rgba(0,0,0,.2);}
body.theme-night tbody tr:hover td{background:rgba(0,163,224,.08);}
body.theme-night .hero{
  background:linear-gradient(120deg, rgba(12,23,56,.95), rgba(12,23,56,.82));
  box-shadow:0 16px 34px rgba(0,0,0,.36);
}
body.theme-night .hero .sub,
body.theme-night .muted,
body.theme-night .foot-note,
body.theme-night .demo-draw-status,
body.theme-night .bet-ticket .meta,
body.theme-night .museum-seasons,
body.theme-night th,
body.theme-night .audit,
body.theme-night .player-tile-meta,
body.theme-night .player-chip .pin,
body.theme-night .player-timezones{color:#c2d4ff;}
body.theme-night .tab:not(.active),
body.theme-night .step:not(.active){color:#dbe9ff;}
body.theme-night .player-chip{color:#ecf4ff;}
body.theme-night .player-timezones{border-top-color:#35579d;}
body.theme-night .player-association-summary{border-color:#35579d;background:linear-gradient(180deg,#13295d,#11234f);color:#d7e6ff;}
body.theme-night .tab.active,
body.theme-night .step.active,
body.theme-night button,
body.theme-night .catalog-chip.active{
  background:linear-gradient(145deg,#003b9c,#0078c2);
  border-color:#003da5;
  color:#eff7ff;
}
body.theme-night button{color:#eff5ff;}
body.theme-night button.secondary,
body.theme-night .result-quick button,
body.theme-night .bet-presets button,
body.theme-night .result-step-btn,
body.theme-night .catalog-chip,
body.theme-night .hero-theme-btn{
  background:#1b3d7f;
  color:#f2f7ff;
  border-color:#4a73bc;
}
body.theme-night button.gold,
body.theme-night .result-quick button.active,
body.theme-night .bet-presets button.active,
body.theme-night .player-tile-badge,
body.theme-night .museum-count{
  background:linear-gradient(145deg,#003b9c,#0078c2);
  border-color:#003da5;
  color:#eff7ff;
}
body.theme-night .tag.pending{background:rgba(78,161,255,.2);color:#afd4ff;}
body.theme-night .tag.confirmed{background:rgba(0,163,224,.22);color:#a7e4ff;}
body.theme-night .tag.dispute{background:rgba(251,113,133,.2);color:#fda4af;}
body.theme-night .tag.empty{background:rgba(158,195,203,.16);color:#b7d3da;}
body.theme-night .banner.info{background:rgba(78,161,255,.14);border-color:#4ea1ff;color:#d6e9ff;}
body.theme-night .banner.warn{background:rgba(251,113,133,.14);border-color:#fb7185;color:#ffd3da;}
body.theme-night .banner.gold{background:rgba(78,161,255,.15);border-color:#4ea1ff;color:#d7ebff;}
body.theme-night .champion-box{background:linear-gradient(180deg,rgba(78,161,255,.12),rgba(12,23,56,.8));border-color:#4ea1ff;}
body.theme-night .champion-box h2{color:#b8d7ff;}
body.theme-night .player-grid::-webkit-scrollbar-track{background:#0f1f28;}
body.theme-night .player-grid::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#2f4d90,#3f73ca);border-color:#0f1f28;}
body.theme-night .modal-bg{background:linear-gradient(0deg,rgba(1,8,28,.84),rgba(1,8,28,.74));}
body.theme-night input,
body.theme-night select{
  color:#eef4ff;
}
body.theme-night input::placeholder,
body.theme-night select::placeholder{
  color:#c1d0f2;
}

.name-chip-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.name-chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:1px solid #d8e3e1;
  background:#fff;
  border-radius:999px;
  padding:5px 10px;
  font-size:.78rem;
  color:#12325f;
  font-weight:800;
}
.name-chip button{
  padding:2px 6px;
  font-size:.72rem;
  border-radius:999px;
  background:#ffe3e6;
  color:#8f2232;
  border:1px solid #f5b7bf;
}

.stepper{display:flex;gap:8px;margin:14px 0 22px;flex-wrap:wrap;}
.step{
  position:relative;
  flex:1;
  min-width:74px;
  text-align:center;
  padding:8px 6px;
  border-radius:10px;
  font-size:.72rem;
  font-weight:800;
  color:#173e7f;
  background:#ffffff;
  border:1px solid #d6e2df;
  box-shadow:0 2px 0 rgba(0,61,165,.06);
  text-transform:uppercase;
  letter-spacing:.45px;
}
.step.active{
  background:linear-gradient(135deg,#003b9c,#0078c2);
  color:#fff;
  border-color:#003da5;
  box-shadow:var(--shadow-pop);
}
.step.done{background:#e7efff;color:#0f3d9e;border-color:#b9cef8;}

.tabs{
  display:flex;
  gap:6px;
  margin-bottom:18px;
  overflow-x:auto;
  padding-bottom:4px;
}
.tabs::-webkit-scrollbar{height:8px;}
.tabs::-webkit-scrollbar-thumb{background:#b9c9eb;border-radius:999px;}
.tab{
  padding:10px 14px;
  font-size:clamp(.8rem,1.2vw,.94rem);
  font-weight:800;
  color:#0f3265;
  cursor:pointer;
  white-space:nowrap;
  border:1px solid #d2dfdc;
  border-radius:999px;
  background:#ffffff;
  transition:all .2s ease;
  box-shadow:0 2px 0 rgba(0,61,165,.05);
}
.tab.active{
  color:#fff;
  border-color:#003da5;
  background:linear-gradient(135deg,#003b9c,#0078c2);
  box-shadow:0 6px 18px rgba(0,61,165,.3);
}

.card{
  position:relative;
  background:var(--ucl-panel-grad);
  border:1px solid #d5e1de;
  border-radius:16px;
  padding:clamp(12px,1.6vw,18px);
  margin-bottom:16px;
  box-shadow:var(--shadow-soft);
  overflow:hidden;
}
.card::before{
  content:'';
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:3px;
  background:linear-gradient(90deg,#003da5,#00a3e0 62%,#89c5ff);
  opacity:.9;
}
.card h3{
  margin:0 0 12px;
  font-size:1.15rem;
  color:#0a2f7a;
  letter-spacing:.5px;
  text-transform:uppercase;
}
.muted{color:var(--text-dim);font-size:.84rem;font-weight:600;line-height:1.55;}

label{display:block;font-size:.74rem;color:#3a5893;margin-bottom:5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;}
input,select{
  width:100%;
  background:#fff;
  border:1px solid #cedddb;
  color:var(--text);
  padding:10px 11px;
  border-radius:10px;
  font-size:.94rem;
  margin-bottom:12px;
  font-family:inherit;
  min-height:42px;
  transition:border-color .2s ease, box-shadow .2s ease;
}
input:focus,select:focus{
  outline:none;
  border-color:#003da5;
  box-shadow:0 0 0 3px rgba(0,61,165,.15);
}
input[type=number]{width:90px;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
.row > div{flex:1;min-width:120px;}

button{
  background:linear-gradient(145deg,#003da5,#005fcc);
  color:#fff;
  border:1px solid #003da5;
  padding:9px 16px;
  border-radius:11px;
  font-weight:800;
  font-size:.85rem;
  cursor:pointer;
  font-family:inherit;
  min-height:40px;
  transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
}
button:hover{transform:translateY(-1px);box-shadow:0 8px 16px rgba(0,61,165,.24);}
button.secondary{background:#fff;color:#003da5;border:1px solid #a8c2f2;}
button.gold{background:linear-gradient(145deg,#007fcf,#0064b6);border-color:#0059a8;color:#eff7ff;}
button.danger{background:linear-gradient(145deg,#d9424f,#cf2f3f);border-color:#cf2f3f;}
button:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none;}
button.small{padding:5px 10px;font-size:.75rem;border-radius:9px;}

body.platform-macos button{
  border-radius:12px;
  background:linear-gradient(180deg,#0d6dde,#0757bf);
  border-color:#0357d6;
  box-shadow:0 1px 0 rgba(255,255,255,.55) inset, 0 10px 18px rgba(3,87,214,.2);

}

body.platform-macos input,
body.platform-macos select{

body.platform-iphone button,
body.platform-ipad button{font-weight:700;letter-spacing:.1px;border-width:1px;}

body.platform-iphone .card{

body.platform-iphone input,

.bracket-board{
  display:grid;
  grid-auto-flow:column;
  grid-auto-columns:minmax(260px,1fr);
  gap:16px;
  overflow-x:auto;
  padding:8px 4px 12px;
  margin-top:10px;
}
.bracket-board::-webkit-scrollbar{height:10px;}
.bracket-board::-webkit-scrollbar-thumb{background:#93b1e8;border-radius:999px;}
.bracket-col{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.bracket-col-head{
  position:sticky;
  top:0;
  z-index:2;
  font-size:.74rem;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.55px;
  color:#eaf2ff;
  background:linear-gradient(135deg,#003da5,#00a3e0);
  border:1px solid #003da5;
  border-radius:999px;
  padding:7px 10px;
  text-align:center;
}
.bracket-col-body{
  display:flex;
  flex-direction:column;
  gap:12px;
  min-height:100%;
  --bracket-branch:12px;
  --bracket-line:#7aa3ea;
}
.bracket-col-body.round-depth-1{gap:12px;padding-top:0;padding-bottom:0;--bracket-branch:12px;}
.bracket-col-body.round-depth-2{gap:34px;padding-top:17px;padding-bottom:17px;--bracket-branch:22px;}
.bracket-col-body.round-depth-3{gap:72px;padding-top:36px;padding-bottom:36px;--bracket-branch:36px;}
.bracket-col-body.round-depth-4{gap:128px;padding-top:64px;padding-bottom:64px;--bracket-branch:54px;}
.bracket-col-body.round-depth-5{gap:176px;padding-top:88px;padding-bottom:88px;--bracket-branch:70px;}
.bracket-col-body.round-depth-6{gap:220px;padding-top:110px;padding-bottom:110px;--bracket-branch:86px;}
.bracket-node{
  position:relative;
}
.bracket-node:not(.last-col)::after{
  content:'';
  position:absolute;
  right:-14px;
  top:50%;
  width:14px;
  height:2px;
  background:linear-gradient(90deg,var(--bracket-line),#00a3e0);
  opacity:.8;
}
.bracket-node:not(.last-col)::before{
  content:'';
  position:absolute;
  right:-14px;
  width:14px;
  border-right:2px solid var(--bracket-line);
  opacity:.72;
}
.bracket-col-body .bracket-node:nth-child(odd):not(.last-col)::before{
  top:50%;
  height:var(--bracket-branch);
  border-bottom:2px solid var(--bracket-line);
  border-radius:0 0 9px 0;
}
.bracket-col-body .bracket-node:nth-child(even):not(.last-col)::before{
  top:calc(50% - var(--bracket-branch));
  height:var(--bracket-branch);
  border-top:2px solid var(--bracket-line);
  border-radius:0 9px 0 0;
}
.bracket-node.resolved{--bracket-line:#2a8cc7;}
.bracket-node.champion-path{--bracket-line:#d7aa2f;}
.bracket-node.resolved:not(.last-col)::after,
.bracket-node.resolved:not(.last-col)::before{
  opacity:.95;
}
.bracket-node.champion-path:not(.last-col)::after,
.bracket-node.champion-path:not(.last-col)::before{
  opacity:1;
  filter:drop-shadow(0 0 4px rgba(215,170,47,.4));
  animation:bracketLinePulse 1.9s ease-in-out infinite;
}
.bracket-node.newly-decided:not(.last-col)::after{
  transform-origin:left center;
  animation:bracketLinkReveal .55s ease-out;
}
.bracket-node.newly-decided:not(.last-col)::before{
  transform-origin:right top;
  animation:bracketBranchReveal .55s ease-out;
}
.bracket-col-body .bracket-node:nth-child(even).newly-decided:not(.last-col)::before{
  transform-origin:right bottom;
}
.bracket-placeholder{
  border:1px dashed #9bb6e8;
  border-radius:12px;
  background:linear-gradient(180deg,#f6f9ff,#edf3ff);
  padding:12px;
  color:#3a5f9d;
  font-size:.83rem;
  font-weight:700;
}
.bracket-placeholder.pending{opacity:.86;}
.bracket-tie-card{
  margin:0;
  border-color:#b9cef5;
  box-shadow:0 6px 18px rgba(0,42,128,.1);
}
.bracket-tie-card > div:first-child{
  font-size:.82rem;
  color:#0b337c;
  text-transform:uppercase;
  letter-spacing:.4px;
}
.bracket-tie-card.winner-locked{
  border-color:#61a8de;
  box-shadow:0 8px 24px rgba(0,84,153,.2);
}
.bracket-tie-card.champion-path{
  border-color:#d7aa2f;
  box-shadow:0 10px 26px rgba(187,135,0,.25);
  animation:championCardPulse 2.2s ease-in-out infinite;
}
.bracket-tie-card.newly-decided{
  animation:tieReveal .62s cubic-bezier(.2,.7,.2,1);
}

@keyframes bracketLinePulse{
  0%,100%{opacity:.78;}
  50%{opacity:1;}
}

@keyframes bracketLinkReveal{
  from{opacity:0;transform:scaleX(.08);}
  to{opacity:1;transform:scaleX(1);}
}

@keyframes bracketBranchReveal{
  from{opacity:0;transform:scaleY(.08);}
  to{opacity:.95;transform:scaleY(1);}
}

@keyframes championCardPulse{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-1px);}
}

@keyframes tieReveal{
  0%{opacity:.36;transform:translateY(6px) scale(.985);}
  100%{opacity:1;transform:translateY(0) scale(1);}
}

@media (prefers-reduced-motion:reduce){
  .bracket-node.champion-path:not(.last-col)::after,
  .bracket-node.champion-path:not(.last-col)::before,
  .bracket-node.newly-decided:not(.last-col)::after,
  .bracket-node.newly-decided:not(.last-col)::before,
  .bracket-tie-card.champion-path,
  .bracket-tie-card.newly-decided{
    animation:none !important;
  }
}

  border:1px solid #d5e4e1;

  position:absolute;
  width:8px;
  height:8px;
  border-radius:50%;
  box-shadow:0 0 0 0 rgba(0,61,165,.9),0 0 0 0 rgba(0,163,224,.85),0 0 0 0 rgba(105,180,255,.85);

  0%{transform:scale(.2);opacity:1;}

function uid(){ return Math.random().toString(36).slice(2,10); }
function normalizeUiLang(lang){
  const v = String(lang || '').trim().toLowerCase();
  return SUPPORTED_UI_LANGS.includes(v) ? v : 'es';
}
function devicePreferredUiLang(){
  try{
    const raw = (navigator.language || navigator.userLanguage || 'es').toLowerCase();
    const base = raw.split('-')[0];
    return normalizeUiLang(base);
  }catch(_err){
    return 'es';
  }
}
function persistedUiLang(){
  try{
    const stored = localStorage.getItem(UI_LANG_KEY);
    if(stored) return normalizeUiLang(stored);
  }catch(_err){}
  return devicePreferredUiLang();
}
function normalizeTheme(theme){
  const v = String(theme || '').trim().toLowerCase();
  return (v==='night' || v==='day') ? v : 'day';
}
function autoThemeByLocalTime(){
  const hour = new Date().getHours();
  return (hour>=7 && hour<19) ? 'day' : 'night';
}
function applyTheme(theme){
  currentTheme = normalizeTheme(theme);
  document.body.classList.toggle('theme-night', currentTheme==='night');
  document.body.classList.toggle('theme-day', currentTheme==='day');
}
function syncAutoTheme(){
  const next = autoThemeByLocalTime();
  if(next!==currentTheme){
    applyTheme(next);
    render();
  }
}
function uiLang(){ return normalizeUiLang(state?.uiLang || persistedUiLang()); }
function uiLocale(){ return ({es:'es-ES', en:'en-GB', lt:'lt-LT', ca:'ca-ES'})[uiLang()] || 'es-ES'; }
function localeForLang(lang){ return ({es:'es-ES', en:'en-GB', lt:'lt-LT', ca:'ca-ES'})[normalizeUiLang(lang)] || 'es-ES'; }
function t(key){
  const lang = uiLang();
  return I18N[lang]?.[key] || I18N.es[key] || key;
}
function tf(key, vars = {}){
  let txt = t(key);
  Object.keys(vars).forEach(k=>{
    txt = txt.replaceAll(`{${k}}`, String(vars[k]));
  });
  return txt;
}
function tForLang(lang, key){
  const safeLang = normalizeUiLang(lang);
  return I18N[safeLang]?.[key] || I18N.es[key] || key;
}
function tfForLang(lang, key, vars = {}){
  let txt = tForLang(lang, key);
  Object.keys(vars).forEach(k=>{
    txt = txt.replaceAll(`{${k}}`, String(vars[k]));
  });
  return txt;
}
function setUiLang(lang){
  const next = normalizeUiLang(lang);
  if(state) state.uiLang = next;
  try{ localStorage.setItem(UI_LANG_KEY, next); }
  catch(_err){}
  document.documentElement.lang = next;
}

      if(!audioBtn) return;
      audioBtn.textContent = isSpeaking ? t('guideAudioStop') : t('guideAudioPlay');

    if(audioBtn){
      if(!canSpeak){
        audioBtn.disabled = true;
        audioBtn.textContent = t('guideAudioNotSupported');
      } else {
        syncAudioButtonLabel();
        audioBtn.onclick = ()=>{
          if(isSpeaking){
            window.speechSynthesis.cancel();
            isSpeaking = false;
            activeUtterance = null;
            syncAudioButtonLabel();
            return;
          }
          const fullText = String(guideContent?.innerText || guideContent?.textContent || '').replace(/\s+/g, ' ').trim();
          if(!fullText) return;
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(fullText);
          utterance.lang = uiLocale();
          utterance.rate = 1;
          utterance.onend = ()=>{
            if(activeUtterance!==utterance) return;
            isSpeaking = false;
            activeUtterance = null;
            syncAudioButtonLabel();
          };
          utterance.onerror = ()=>{
            if(activeUtterance!==utterance) return;
            isSpeaking = false;
            activeUtterance = null;
            syncAudioButtonLabel();
          };
          activeUtterance = utterance;
          isSpeaking = true;
          syncAudioButtonLabel();
          window.speechSynthesis.speak(utterance);
        };
      }
    }

    bg.querySelector('.close').onclick = ()=>{
      if(canSpeak) window.speechSynthesis.cancel();
      pendingModal=null;
      render();
    };
    return bg;
  };
  render();

function ensureDemoDrawState(sessionId, total){
  if(!demoDrawState || demoDrawState.sessionId!==sessionId){
    demoDrawState = {
      sessionId,
      total,
      revealed:0,
      running:false,
      complete:false,
      nextRevealAt:null,
      timerId:null
    };
  }
  return demoDrawState;
}

function tickDemoDraw(sessionId){
  if(!demoDrawState || demoDrawState.sessionId!==sessionId || demoDrawState.complete) return;
  demoDrawState.revealed = Math.min(demoDrawState.total, demoDrawState.revealed + 1);
  demoDrawState.complete = demoDrawState.revealed>=demoDrawState.total;
  demoDrawState.running = !demoDrawState.complete;
  demoDrawState.nextRevealAt = demoDrawState.complete ? null : (Date.now() + 10000);
  render();
  if(!demoDrawState.complete){
    demoDrawState.timerId = setTimeout(()=> tickDemoDraw(sessionId), 10000);
  }
}

function startDemoDraw(sessionId){
  if(!demoDrawState || demoDrawState.sessionId!==sessionId) return;
  if(demoDrawState.running || demoDrawState.complete) return;
  demoDrawState.running = true;
  demoDrawState.nextRevealAt = Date.now() + 10000;
  demoDrawState.timerId = setTimeout(()=> tickDemoDraw(sessionId), 10000);
  render();
}

function proposalSuggestedKickoffTime(){
  const minutes = state.players
    .map(p=> normalizePreferredPlayTime(p?.preferredPlayTime))
    .filter(Boolean)
    .map(hhmm=>{
      const [hh, mm] = hhmm.split(':').map(Number);
      return hh*60 + mm;
    })
    .sort((a,b)=> a-b);
  if(!minutes.length) return '21:00';
  const median = minutes[Math.floor(minutes.length/2)];
  const rounded = Math.round(median/15)*15;
  const safe = ((rounded % (24*60)) + (24*60)) % (24*60);
  const hh = String(Math.floor(safe/60)).padStart(2,'0');
  const mm = String(safe%60).padStart(2,'0');
  return `${hh}:${mm}`;
}
function proposalKickoffOptions(total=3, messageLang=uiLang()){
  const time = proposalSuggestedKickoffTime();
  const [hh, mm] = time.split(':').map(Number);
  const locale = localeForLang(messageLang);
  const zoneCodeByTz = {
    'Europe/Madrid': 'BCN',
    'America/Lima': 'LIM',
    'Europe/Vilnius': 'VNO'
  };
  const dayFmt = new Intl.DateTimeFormat(locale, {
    weekday:'short',
    day:'2-digit',
    month:'2-digit',
    hourCycle:'h23',
    timeZone:'Europe/Madrid'
  });
  const zoneFormatters = SCHEDULE_CITIES.map(city=>({
    code: zoneCodeByTz[city.timeZone] || city.label,
    fmt: new Intl.DateTimeFormat(locale, {
      hour:'2-digit',
      minute:'2-digit',
      hourCycle:'h23',
      timeZone: city.timeZone
    })
  }));
  const rawStartMinutes = (hh * 60) + mm;
  const roundedStartMinutes = Math.round(rawStartMinutes / 30) * 30;
  const latestAllowedStart = (23 * 60) + 30 - ((Math.max(1, total) - 1) * 30);
  const safeStartMinutes = Math.max(0, Math.min(roundedStartMinutes, latestAllowedStart));
  const baseHour = Math.floor(safeStartMinutes / 60);
  const baseMinute = safeStartMinutes % 60;
  const now = new Date();
  const base = new Date(now);
  base.setHours(baseHour, baseMinute, 0, 0);
  const out = [];
  for(let i=0;i<total;i++){
    const d = new Date(base);
    d.setMinutes(d.getMinutes() + (i * 30));
    const byCode = {};
    zoneFormatters.forEach(entry=>{ byCode[entry.code] = entry.fmt.format(d); });
    const bcn = byCode.BCN || '--:--';
    const vno = byCode.VNO || '--:--';
    const lim = byCode.LIM || '--:--';
    const byZone = [`${bcn} (BCN)`, `${vno} (VNO)`, `${lim} (LIM)`];
    const dayText = dayFmt.format(d);
    out.push({
      at: d,
      byZone,
      dayLine: `${dayText}:`,
      timeLine: byZone.join(' - '),
      line: `${dayText}: ${byZone.join(' - ')}`
    });
  }
  return out;
}

function normalizeTimeZone(value){
  const raw = String(value || '').trim();
  if(!raw) return 'UTC';
  const tz = TIME_ZONE_ALIAS_TO_CANONICAL[raw] || raw;
  try{
    new Intl.DateTimeFormat('en-US', {timeZone: tz}).format(new Date());
    return tz;
  }catch(_err){
    return 'UTC';
  }
}
function displayTimeZone(value){
  const canonical = normalizeTimeZone(value || 'UTC');
  return TIME_ZONE_CANONICAL_TO_ALIAS[canonical] || canonical;
}
function detectDeviceTimeZone(){
  try{ return normalizeTimeZone(Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'); }
  catch(_err){ return 'UTC'; }

function normalizePreferredPlayTime(value){
  const raw = String(value || '').trim();
  const m = raw.match(/^(\d{1,2}):(\d{2})$/);
  if(!m) return null;
  const hh = Number(m[1]);
  const mm = Number(m[2]);
  if(!Number.isInteger(hh) || !Number.isInteger(mm) || hh<0 || hh>23 || mm<0 || mm>59) return null;
  return `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
}
function suggestedPlayTime(){
  const d = new Date();
  d.setSeconds(0,0);
  const rounded = Math.round(d.getMinutes()/15)*15;
  if(rounded===60){ d.setHours((d.getHours()+1)%24,0,0,0); }
  else d.setMinutes(rounded,0,0);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function zonedDateParts(date, timeZone){
  const parts = new Intl.DateTimeFormat('en-GB', {
    timeZone,
    year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit',
    hourCycle:'h23'
  }).formatToParts(date);
  const map = {};
  parts.forEach(p=>{ if(p.type!=='literal') map[p.type]=p.value; });
  return {
    year: Number(map.year),
    month: Number(map.month),
    day: Number(map.day),
    hour: Number(map.hour),
    minute: Number(map.minute),
    second: Number(map.second)
  };
}
function timeZoneOffsetMinutes(date, timeZone){
  const p = zonedDateParts(date, timeZone);
  const utcLike = Date.UTC(p.year, p.month-1, p.day, p.hour, p.minute, p.second || 0);
  return (utcLike - date.getTime()) / 60000;
}
function zonedClockToUtcMs(year, month, day, hour, minute, timeZone){
  let ms = Date.UTC(year, month-1, day, hour, minute, 0);
  for(let i=0;i<3;i++){
    const off = timeZoneOffsetMinutes(new Date(ms), timeZone);
    ms = Date.UTC(year, month-1, day, hour, minute, 0) - (off * 60000);
  }
  return ms;
}
function convertClockTimeAcrossZones(localTime, fromTimeZone, toTimeZone){
  const hhmm = normalizePreferredPlayTime(localTime);
  if(!hhmm) return '--:--';
  const srcTz = normalizeTimeZone(fromTimeZone || 'UTC');
  const dstTz = normalizeTimeZone(toTimeZone || 'UTC');
  const [hh, mm] = hhmm.split(':').map(Number);
  const srcToday = zonedDateParts(new Date(), srcTz);
  const utcMs = zonedClockToUtcMs(srcToday.year, srcToday.month, srcToday.day, hh, mm, srcTz);
  return new Intl.DateTimeFormat('es-ES', {timeZone: dstTz, hour:'2-digit', minute:'2-digit', hourCycle:'h23'}).format(new Date(utcMs));
}

}

function addNameToCatalog(name){

  if(!clean) return;
  if(PRESET_PLAYER_NAMES.includes(clean)){
    unhidePresetName(clean);
    return;
  }
  const custom = getStoredCustomPlayerNames();
  if(custom.includes(clean)) return;
  custom.push(clean);
  custom.sort((a,b)=> a.localeCompare(b, 'es-ES'));
  setStoredCustomPlayerNames(custom);

function removeNameFromCatalog(name){
  const clean = normalizePlayerName(name);
  if(!clean) return false;
  if(PRESET_PLAYER_NAMES.includes(clean)){
    const hidden = getHiddenPresetNames();
    if(hidden.includes(clean)) return false;
    hidden.push(clean);
    hidden.sort((a,b)=> a.localeCompare(b, 'es-ES'));
    setHiddenPresetNames(hidden);
    return true;
  }
  const custom = getStoredCustomPlayerNames();
  const next = custom.filter(n=> n!==clean);
  if(next.length===custom.length) return false;
  setStoredCustomPlayerNames(next);
  return true;
}

async function readRemoteSnapshot(){
  const url = supabaseApi(`${SUPABASE_TABLE}?id=eq.${encodeURIComponent(SUPABASE_ROW_ID)}&select=id,state,version,updated_at&limit=1`);
  try{
    const res = await fetch(url, { method:'GET', headers:supabaseHeaders(), cache:'no-store' });
    if(!res.ok){
      const body = await safeJson(res);
      return { ok:false, status:res.status, error: body?.message || body?.error || `Error remoto (${res.status})` };
    }
    const rows = await safeJson(res) || [];
    if(!rows.length) return { ok:true, state:null, etag:null };
    const row = rows[0];
    return { ok:true, state:row.state || null, etag:typeof row.version==='number' ? row.version : null };
  }catch(_err){
    return { ok:false, status:0, error:'Sin conexión a Supabase' };
  }
}

async function writeRemoteSnapshot(nextState, expectedVersion){
  const nowIso = new Date().toISOString();

  if(typeof expectedVersion !== 'number'){
    const insertUrl = supabaseApi(SUPABASE_TABLE);
    try{
      const res = await fetch(insertUrl, {
        method:'POST',
        headers:supabaseHeaders({ Prefer:'return=representation' }),
        body: JSON.stringify({ id:SUPABASE_ROW_ID, state:nextState, version:1, updated_at:nowIso })
      });
      if(res.ok){
        const rows = await safeJson(res) || [];
        return { ok:true, etag: rows[0]?.version ?? 1 };
      }
      if(res.status===409){
        const current = await readRemoteSnapshot();
        return { ok:false, status:409, state:current.state || null, etag:current.etag || null };
      }
      const body = await safeJson(res);
      return { ok:false, status:res.status, error: body?.message || body?.error || `Error remoto (${res.status})` };
    }catch(_err){
      return { ok:false, status:0, error:'Sin conexión a Supabase' };
    }
  }

  const patchUrl = supabaseApi(`${SUPABASE_TABLE}?id=eq.${encodeURIComponent(SUPABASE_ROW_ID)}&version=eq.${expectedVersion}`);
  try{
    const res = await fetch(patchUrl, {
      method:'PATCH',
      headers:supabaseHeaders({ Prefer:'return=representation' }),
      body: JSON.stringify({ state:nextState, version:expectedVersion+1, updated_at:nowIso })
    });
    if(res.ok){
      const rows = await safeJson(res) || [];
      if(rows.length) return { ok:true, etag:rows[0].version };
      const current = await readRemoteSnapshot();
      return { ok:false, status:409, state:current.state || null, etag:current.etag || null };
    }
    const body = await safeJson(res);
    return { ok:false, status:res.status, error: body?.message || body?.error || `Error remoto (${res.status})` };
  }catch(_err){
    return { ok:false, status:0, error:'Sin conexión a Supabase' };
  }
}

  if(!state.config || typeof state.config!=='object') state.config = {...defaultState().config};
  if(!state.bets) state.bets = defaultState().bets;
  if(typeof state.bets.maxStakePct!=='number') state.bets.maxStakePct = 0.3;
  if(typeof state.bets.championMoneyCap!=='number' || state.bets.championMoneyCap<=0) state.bets.championMoneyCap = state.finance.prizes.champion;
  if(!Array.isArray(state.bets.tickets)) state.bets.tickets = [];
  if(!state.finance.lifetimeByPlayer) state.finance.lifetimeByPlayer = {};
  if(!state.sync) state.sync = defaultState().sync;
  if(!state.seasonKickoff) state.seasonKickoff = null;
  state.uiLang = normalizeUiLang(state.uiLang || persistedUiLang());
  state.whatsAppProposalLang = normalizeUiLang(state.whatsAppProposalLang || state.uiLang);
  applyTheme(autoThemeByLocalTime());
  setUiLang(state.uiLang);
  if(!state.season || state.season==='Champions PS5') state.season = GAME_NAME+' - T1';
  state.players.forEach(p=>{
    p.name = normalizePlayerName(p.name);
    if(typeof p.money!=='number') p.money=0;
    p.preferredPlayTime = normalizePreferredPlayTime(p.preferredPlayTime) || '';
    p.preferredPlayTimeZone = p.preferredPlayTime ? normalizeTimeZone(p.preferredPlayTimeZone || 'UTC') : '';
    if(typeof state.finance.lifetimeByPlayer[p.id] !== 'number'){
      // Migracion: si no habia acumulado historico, tomamos el saldo actual.
      state.finance.lifetimeByPlayer[p.id] = p.money;
    }
  });
  if(Array.isArray(state.pastChampions)){
    state.pastChampions = state.pastChampions.map(pc=> ({
      ...pc,
      kickoff: pc.kickoff || null
    }));
  }
  render();
  pullRemoteState();
  if(pullTimer) clearInterval(pullTimer);
  pullTimer = setInterval(()=>{
    if(shouldPauseSync()) return;
    pullRemoteState();
    processKnockoutDrawClock();
  }, 1200);

  if(drawUiTimer) clearInterval(drawUiTimer);
  drawUiTimer = setInterval(()=>{
    const demoRunning = !!(demoDrawState?.running && pendingModal);
    const knockoutRunning = !!(currentTab==='knockout' && state?.knockoutDraw?.startedAt && !state.knockoutDraw.complete);
    if(!demoRunning && !knockoutRunning) return;
    if(knockoutRunning){
      const progressed = processKnockoutDrawClock();
      if(progressed) return;
    }
    render();
  }, 1000);

  if(themeAutoTimer) clearInterval(themeAutoTimer);
  themeAutoTimer = setInterval(()=>{ syncAutoTheme(); }, 60000);
  document.addEventListener('visibilitychange', ()=>{
    if(!document.hidden) syncAutoTheme();
  });
}

async function pullRemoteState(opts = {}){
  const touchOnNoChange = !!opts.touchOnNoChange;
  if(shouldPauseSync()) return;
  const prevLocal = state;
  const remote = await readRemoteSnapshot();
  if(!remote.ok){
    if(state?.sync){
      const prevMode = state.sync.mode;
      const prevError = state.sync.lastError;
      state.sync.mode = 'local';
      state.sync.lastError = remote.error || 'Sin conexión remota';
      if(prevMode!==state.sync.mode || prevError!==state.sync.lastError) render();
    }
    return;
  }
  if(!remote.state){
    if(state?.sync && touchOnNoChange){
      state.sync.mode = 'remoto';
      state.sync.lastRemoteAt = nowStr();
      state.sync.lastError = 'Sin estado remoto todavía.';
      render();
    }
    return;
  }
  if(remoteEtag===null || remoteEtag!==remote.etag){
    state = migrateStateShape(remote.state);
    state = preserveLocalMyPlayer(prevLocal, state);
    remoteEtag = remote.etag;
    if(!state.sync) state.sync = defaultState().sync;
    state.sync.mode = 'remoto';
    state.sync.lastRemoteAt = nowStr();
    state.sync.lastError = null;
    localStorage.setItem(STATE_KEY, JSON.stringify(state));
    render();
  } else if(touchOnNoChange){
    if(!state.sync) state.sync = defaultState().sync;
    state.sync.mode = 'remoto';
    state.sync.lastRemoteAt = nowStr();
    state.sync.lastError = 'Sin cambios (ya estabas al día).';
    localStorage.setItem(STATE_KEY, JSON.stringify(state));
    render();
  }
}

function queueRemotePush(){
  if(pushTimer) clearTimeout(pushTimer);
  pushTimer = setTimeout(()=> pushRemoteState(), 300);
}

async function pushRemoteState(){
  if(pushInFlight){
    pushQueued = true;
    return;
  }
  pushInFlight = true;
  try{
    const remote = await writeRemoteSnapshot(stateForRemote(state), remoteEtag);
    if(remote.status===409){
      if(remote?.state){
        const prevLocal = state;
        state = migrateStateShape(remote.state);
        state = preserveLocalMyPlayer(prevLocal, state);
        remoteEtag = remote.etag ?? null;
        state.sync.mode = 'remoto';
        state.sync.lastRemoteAt = nowStr();
        state.sync.lastError = 'Se detecto cambio remoto. Se refresco el estado.';
        localStorage.setItem(STATE_KEY, JSON.stringify(state));
        render();
      }
      return;
    }
    if(!remote.ok) throw new Error(remote.error || 'No se pudo guardar remoto');
    remoteEtag = typeof remote.etag==='number' ? remote.etag : remoteEtag;
    state.sync.mode = 'remoto';
    state.sync.lastRemoteAt = nowStr();
    state.sync.lastError = null;
    localStorage.setItem(STATE_KEY, JSON.stringify(state));
  }catch(err){
    if(state?.sync){
      state.sync.mode = 'local';
      state.sync.lastError = 'Guardando solo en local';
    }
  }finally{
    pushInFlight = false;
    if(pushQueued){
      pushQueued = false;
      pushRemoteState();
    }
  }
}

function migrateStateShape(s){
  if(!s || typeof s!=='object') s = {};
  const base = defaultState();
  if(!s.season || typeof s.season!=='string') s.season = base.season;
  if(!s.phase || typeof s.phase!=='string') s.phase = base.phase;
  if(!s.config || typeof s.config!=='object') s.config = {...base.config};
  if(typeof s.config.matchesPerPlayer!=='number') s.config.matchesPerPlayer = base.config.matchesPerPlayer;
  if(typeof s.config.numQualifiers!=='number') s.config.numQualifiers = base.config.numQualifiers;
  if(!Array.isArray(s.players)) s.players = [];
  if(!Array.isArray(s.leagueGroups)) s.leagueGroups = [];
  if(!Array.isArray(s.leagueMatches)) s.leagueMatches = [];
  if(!Array.isArray(s.playoffMatches)) s.playoffMatches = [];
  if(!Array.isArray(s.pastChampions)) s.pastChampions = [];
  if(!Array.isArray(s.history)) s.history = [];
  if(!s.tieResolution || typeof s.tieResolution!=='object') s.tieResolution = {};
  if(!s.bets || typeof s.bets!=='object') s.bets = {...base.bets};
  if(!Array.isArray(s.bets.tickets)) s.bets.tickets = [];
  if(typeof s.bets.maxStakePct!=='number') s.bets.maxStakePct = base.bets.maxStakePct;
  if(typeof s.bets.championMoneyCap!=='number' || s.bets.championMoneyCap<=0) s.bets.championMoneyCap = base.bets.championMoneyCap;
  if(!s.finance) s.finance = defaultState().finance;
  if(!s.finance.lifetimeByPlayer) s.finance.lifetimeByPlayer = {};
  if(!s.sync) s.sync = defaultState().sync;
  if(!s.seasonKickoff) s.seasonKickoff = null;
  if(typeof s.myPlayerId==='undefined') s.myPlayerId = null;
  if(!Array.isArray(s.myPlayerIds)) s.myPlayerIds = s.myPlayerId ? [s.myPlayerId] : [];
  s.myPlayerIds = [...new Set(s.myPlayerIds.filter(Boolean))].slice(0, 2);
  if(!s.myPlayerId && s.myPlayerIds.length) s.myPlayerId = s.myPlayerIds[0];
  if(typeof s.uiLang==='undefined') s.uiLang = persistedUiLang();
  s.uiLang = normalizeUiLang(s.uiLang);
  if(typeof s.whatsAppProposalLang==='undefined') s.whatsAppProposalLang = s.uiLang;
  s.whatsAppProposalLang = normalizeUiLang(s.whatsAppProposalLang);
  if(typeof s.setupNeedsAssociates==='undefined') s.setupNeedsAssociates = false;
  s.setupNeedsAssociates = !!s.setupNeedsAssociates;
  if(typeof s.champion==='undefined') s.champion = null;
  if(typeof s.qualifiers==='undefined') s.qualifiers = null;
  if(typeof s.leagueTieBreaker==='undefined') s.leagueTieBreaker = null;
  if(typeof s.knockoutDraw==='undefined') s.knockoutDraw = null;
  if(typeof s.bracket==='undefined') s.bracket = null;
  s.players.forEach(p=>{
    if(!p.id) p.id = uid();
    p.name = normalizePlayerName(p.name);
    if(typeof p.money!=='number') p.money = 0;
    p.preferredPlayTime = normalizePreferredPlayTime(p.preferredPlayTime) || '';
    p.preferredPlayTimeZone = p.preferredPlayTime ? normalizeTimeZone(p.preferredPlayTimeZone || 'UTC') : '';
    if(typeof s.finance.lifetimeByPlayer[p.id] !== 'number') s.finance.lifetimeByPlayer[p.id] = p.money;
  });
  return s;
}

async function addPlayerShared(name, preferredLang, preferredPlayTime, preferredPlayTimeZone){
  const clean = normalizePlayerName(name);
  const chosenLang = normalizeUiLang(preferredLang || state?.uiLang || persistedUiLang());
  const playTime = normalizePreferredPlayTime(preferredPlayTime);
  const playTz = normalizeTimeZone(preferredPlayTimeZone || detectDeviceTimeZone());
  if(!clean) return t('errInvalidName');
  if(!playTime) return t('preferredPlayTimeRequired');
  if(state?.phase==='setup'){
    const upfrontReason = localTeamAddBlockReason(state?.players?.length || 0, getLocalPlayerIds().length);
    if(upfrontReason) return upfrontReason;
  }
  let hadReadIssue = false;

  for(let attempt=0; attempt<10; attempt++){
    let remoteState = null;
    let etag = null;
    const snapshot = await readRemoteSnapshot();
    if(!snapshot.ok){
      hadReadIssue = true;
      state.sync.mode = 'local';
      state.sync.lastError = 'Sin conexión remota. Intentando guardar igualmente...';
      remoteState = JSON.parse(JSON.stringify(state || defaultState()));
      etag = remoteEtag || null;
    } else {
      remoteState = snapshot.state || null;
      etag = snapshot.etag ?? null;
    }

    const nextState = migrateStateShape(remoteState ? JSON.parse(JSON.stringify(remoteState)) : defaultState());
    if(nextState.phase==='setup'){
      const ruleReason = localTeamAddBlockReason(nextState.players.length, getLocalPlayerIds().length);
      if(ruleReason) return ruleReason;
    }
    const exists = nextState.players.some(p=> normalizePlayerName(p.name)===normalizePlayerName(clean));
    if(exists) return t('errDuplicatePlayer');

    const id = uid();
    nextState.players.push({id, name:clean, money:0, preferredPlayTime: playTime, preferredPlayTimeZone: playTz});
    nextState.finance.lifetimeByPlayer[id] = 0;
    nextState.history = nextState.history || [];
    nextState.history.unshift({ts: nowStr(), actor:'Organizador', action:'añadió a '+clean+' al torneo.'});

    const saved = await writeRemoteSnapshot(stateForRemote(nextState), etag);
    if(saved.status===409){
      await wait(80 + Math.floor(Math.random()*120));
      continue;
    }
    if(!saved.ok){
      state = migrateStateShape(nextState);
      const local = getLocalPlayerIds(state);
      if(!local.includes(id) && local.length<2) local.push(id);
      state.myPlayerIds = local;
      state.myPlayerId = local[0] || id;
      setUiLang(chosenLang);
      state.sync.mode = 'local';
      state.sync.lastError = 'Guardado local temporal. Se sincronizará cuando vuelva la conexión remota.';
      localStorage.setItem(STATE_KEY, JSON.stringify(state));
      queueRemotePush();
      render();
      return null;
    }

    state = migrateStateShape(nextState);
  const local = getLocalPlayerIds(state);
  if(!local.includes(id) && local.length<2) local.push(id);
  state.myPlayerIds = local;
  state.myPlayerId = local[0] || id;
    setUiLang(chosenLang);
    remoteEtag = typeof saved.etag==='number' ? saved.etag : etag;
    state.sync.mode = 'remoto';
    state.sync.lastRemoteAt = nowStr();
    state.sync.lastError = null;
    localStorage.setItem(STATE_KEY, JSON.stringify(state));
    render();
    pullRemoteState();
    return null;
  }
  if(hadReadIssue) return t('errRemoteUnstable');
  return t('errConcurrentChanges');
}

async function removePlayerShared(playerId){
  if(!playerId) return t('errInvalidPlayer');
  let hadReadIssue = false;

  for(let attempt=0; attempt<10; attempt++){
    let remoteState = null;
    let etag = null;
    const snapshot = await readRemoteSnapshot();
    if(!snapshot.ok){
      hadReadIssue = true;
      state.sync.mode = 'local';
      state.sync.lastError = 'Sin conexión remota. Intentando guardar igualmente...';
      remoteState = JSON.parse(JSON.stringify(state || defaultState()));
      etag = remoteEtag || null;
    } else {
      remoteState = snapshot.state || null;
      etag = snapshot.etag ?? null;
    }

    const nextState = migrateStateShape(remoteState ? JSON.parse(JSON.stringify(remoteState)) : defaultState());
    if(nextState.phase!=='setup') return t('errDeleteOnlySetup');

    const idx = nextState.players.findIndex(p=> p.id===playerId);
    if(idx<0) return t('errPlayerNoLongerExists');
    const removed = nextState.players[idx];

    nextState.players.splice(idx, 1);
    if(nextState.finance?.lifetimeByPlayer) delete nextState.finance.lifetimeByPlayer[playerId];
    if(nextState.myPlayerId===playerId) nextState.myPlayerId = null;
    if(Array.isArray(nextState.myPlayerIds)){
      nextState.myPlayerIds = nextState.myPlayerIds.filter(id=> id!==playerId);
      if(!nextState.myPlayerId && nextState.myPlayerIds.length) nextState.myPlayerId = nextState.myPlayerIds[0];
    }
    if(nextState.tieResolution && typeof nextState.tieResolution==='object') delete nextState.tieResolution[playerId];
    if(nextState.bets?.tickets) nextState.bets.tickets = nextState.bets.tickets.filter(t=> t.playerId!==playerId);
    nextState.history = nextState.history || [];
    nextState.history.unshift({ts: nowStr(), actor:'Organizador', action:'eliminó a '+(removed?.name || 'jugador')+' de la temporada.'});

    const saved = await writeRemoteSnapshot(stateForRemote(nextState), etag);
    if(saved.status===409){
      await wait(80 + Math.floor(Math.random()*120));
      continue;
    }
    if(!saved.ok){
      state = migrateStateShape(nextState);
      state.sync.mode = 'local';
      state.sync.lastError = 'Guardado local temporal. Se sincronizará cuando vuelva la conexión remota.';
      localStorage.setItem(STATE_KEY, JSON.stringify(state));
      queueRemotePush();
      render();
      return null;
    }

    state = migrateStateShape(nextState);
    remoteEtag = typeof saved.etag==='number' ? saved.etag : etag;
    state.sync.mode = 'remoto';
    state.sync.lastRemoteAt = nowStr();
    state.sync.lastError = null;
    localStorage.setItem(STATE_KEY, JSON.stringify(state));
    render();
    pullRemoteState();
    return null;
  }

  if(hadReadIssue) return t('errRemoteUnstable');
  return t('errConcurrentChanges');
}

/* ---------------- ROUND ROBIN ---------------- */
function generateRoundRobinRounds(ids, numRounds){
  let arr = [...ids];
  if(arr.length % 2 !== 0) arr.push(null);
  const n = arr.length;
  const totalRounds = n-1;
  const half = n/2;
  let rounds = [];
  let cur = [...arr];
  for(let r=0;r<totalRounds;r++){
    let pairs=[];
    for(let i=0;i<half;i++){
      const a=cur[i], b=cur[n-1-i];
      if(a!==null && b!==null) pairs.push([a,b]);
    }
    rounds.push(pairs);
    const fixed=cur[0]; const rest=cur.slice(1);
    rest.unshift(rest.pop());
    cur=[fixed,...rest];
  }
  return rounds.slice(0, Math.min(numRounds, totalRounds));
}

function shouldUseLeagueGroups(totalPlayers){
  return totalPlayers >= GROUP_STAGE_MIN_PLAYERS;
}

function buildLeagueGroups(ids){
  if(!shouldUseLeagueGroups(ids.length)) return [];
  const groupCount = Math.max(2, Math.ceil(ids.length / TARGET_GROUP_SIZE));
  const buckets = Array.from({length:groupCount}, (_v, i)=> ({
    id:`G${i+1}`,
    name:`Grupo ${String.fromCharCode(65+i)}`,
    players:[]
  }));
  shuffle(ids).forEach((pid, idx)=>{
    buckets[idx % groupCount].players.push(pid);
  });
  return buckets.filter(g=> g.players.length>=2);
}

function activeLeagueGroups(){
  if(!Array.isArray(state.leagueGroups) || !state.leagueGroups.length) return [];
  const presentIds = new Set(state.players.map(p=> p.id));
  return state.leagueGroups
    .map((g, idx)=> ({
      id: g?.id || `G${idx+1}`,
      name: g?.name || `Grupo ${String.fromCharCode(65+idx)}`,
      players: Array.isArray(g?.players) ? g.players.filter(id=> presentIds.has(id)) : []
    }))
    .filter(g=> g.players.length>=2);
}

function generateLeagueMatchesFromGroups(groups){
  const matches = [];
  groups.forEach(group=>{
    const targetRounds = autoMatchesPerPlayer(group.players.length);
    let rounds = generateRoundRobinRounds(group.players, targetRounds);
    rounds = rounds
      .map(round=> round.filter(([a,b])=> !cannotFaceEachOther(a,b)))
      .filter(pairs=> pairs.length>0);
    rounds.forEach((pairs, rIdx)=>{
      pairs.forEach(([a,b])=> matches.push({
        id:uid(),
        round:rIdx+1,
        group:group.id,
        p1:a,
        p2:b,
        score1:null,
        score2:null,
        status:'empty',
        reportedBy:null,
        confirmedBy:null,
        dispute:null,
        mustReReportBy:null
      }));
    });
  });
  return matches;
}

function allocateGroupQualifierSlots(groups, totalQ){
  const slots = {};
  groups.forEach(g=>{ slots[g.id] = 0; });
  const totalPlayers = groups.reduce((acc, g)=> acc + g.players.length, 0);
  let remaining = Math.max(0, Math.min(totalQ, totalPlayers));
  if(!groups.length || remaining<=0) return slots;

  if(remaining>=groups.length){
    groups.forEach(g=>{ slots[g.id] = 1; });
    remaining -= groups.length;
  }

  const ideals = {};
  groups.forEach(g=>{ ideals[g.id] = totalQ * (g.players.length / totalPlayers); });
  while(remaining>0){
    const candidates = groups.filter(g=> slots[g.id] < g.players.length);
    if(!candidates.length) break;
    candidates.sort((a,b)=>{
      const deltaA = ideals[a.id] - slots[a.id];
      const deltaB = ideals[b.id] - slots[b.id];
      if(deltaB!==deltaA) return deltaB-deltaA;
      if(b.players.length!==a.players.length) return b.players.length-a.players.length;
      return a.id.localeCompare(b.id, 'es-ES');
    });
    slots[candidates[0].id] += 1;
    remaining -= 1;
  }
  return slots;
}

function leagueQualificationSnapshot(){
  const groups = activeLeagueGroups();
  const totalQ = effectiveNumQualifiers();
  if(!groups.length){
    const standings = computeStandingsForPlayerIds(state.players.map(p=> p.id));
    return {
      groupMode:false,
      totalQ,
      groups:[{id:'ALL', name:t('standingsTitle'), standings, slots:Math.min(totalQ, standings.length)}]
    };
  }
  const slotsByGroup = allocateGroupQualifierSlots(groups, totalQ);
  const outGroups = groups.map(g=> ({
    id:g.id,
    name:g.name,
    standings:computeStandingsForPlayerIds(g.players),
    slots:Math.min(slotsByGroup[g.id] || 0, g.players.length)
  }));
  return { groupMode:true, totalQ, groups:outGroups };
}

function unresolvedQualificationTieIds(snapshot){
  const info = snapshot || leagueQualificationSnapshot();
  for(const group of info.groups){
    const tied = tiedGroupsAtCutoff(group.standings, group.slots);
    if(tied.length) return tied;
  }
  return [];
}

/* ---------------- STANDINGS ---------------- */
function computeStandingsForPlayerIds(playerIds){
  const idSet = new Set(playerIds || []);
  const countsForStandings = (m)=>{
    if(!m || (m.status!=='confirmed' && m.status!=='pending')) return false;
    if(!idSet.has(m.p1) || !idSet.has(m.p2)) return false;
    const s1 = Number(m.score1);
    const s2 = Number(m.score2);
    return Number.isFinite(s1) && Number.isFinite(s2) && s1>=0 && s2>=0;
  };
  const table = {};
  state.players.filter(p=> idSet.has(p.id)).forEach((p, idx)=>{
    const pid = p?.id || `player-${idx}`;
    const pname = (p?.name || '').trim() || `Jugador ${idx+1}`;
    table[pid] = {id:pid, name:pname, pj:0,g:0,e:0,p:0,gf:0,gc:0,dg:0,pts:0};
  });
  state.leagueMatches.forEach(m=>{
    if(!countsForStandings(m)) return;
    const s1 = Number(m.score1);
    const s2 = Number(m.score2);
    const t1=table[m.p1], t2=table[m.p2];
    if(!t1 || !t2) return;
    t1.pj++; t2.pj++;
    t1.gf+=s1; t1.gc+=s2;
    t2.gf+=s2; t2.gc+=s1;
    if(s1>s2){ t1.g++; t1.pts+=3; t2.p++; }
    else if(s2>s1){ t2.g++; t2.pts+=3; t1.p++; }
    else { t1.e++; t2.e++; t1.pts++; t2.pts++; }
  });
  let arr = Object.values(table);
  arr.forEach(t=> t.dg = t.gf - t.gc);

  function headToHead(aId,bId){
    const direct = state.leagueMatches.filter(x=>
      countsForStandings(x) && ((x.p1===aId&&x.p2===bId)||(x.p1===bId&&x.p2===aId))
    );
    if(!direct.length) return 0;
    let diff = 0;
    direct.forEach(m=>{
      const aScore = Number(m.p1===aId ? m.score1 : m.score2);
      const bScore = Number(m.p1===aId ? m.score2 : m.score1);
      diff += (bScore - aScore);
    });
    return diff; // negative => a better
  }
  arr.sort((a,b)=>{
    if(b.pts!==a.pts) return b.pts-a.pts;
    if(b.dg!==a.dg) return b.dg-a.dg;
    if(b.gf!==a.gf) return b.gf-a.gf;
    const h2h = headToHead(a.id,b.id);
    if(h2h!==0) return h2h;
    const sa = state.tieResolution[a.id], sb = state.tieResolution[b.id];
    if(sa!==undefined && sb!==undefined) return sa-sb;
    return a.name.localeCompare(b.name, 'es-ES');
  });
  return arr;
}

function computeStandings(){
  const groups = activeLeagueGroups();
  if(!groups.length) return computeStandingsForPlayerIds(state.players.map(p=> p.id));
  return groups.flatMap(g=> computeStandingsForPlayerIds(g.players).map((row, idx)=> ({
    ...row,
    group:g.id,
    groupName:g.name,
    groupPos:idx+1
  })));
}

function tiedGroupsAtCutoff(standings, cutoff){
  // returns array of player ids involved in an unresolved tie straddling the cutoff line
  if(cutoff<=0 || cutoff>=standings.length) return [];
  const a = standings[cutoff-1], b = standings[cutoff];
  const sameKey = x => x.pts+'|'+x.dg+'|'+x.gf;
  if(sameKey(a)!==sameKey(b)) return [];
  // gather full block sharing that key
  const key = sameKey(a);
  const block = standings.filter(x=> sameKey(x)===key);
  const allResolved = block.every(x=> state.tieResolution[x.id]!==undefined);
  if(allResolved) return [];
  return block.map(x=>x.id);
}

function shuffle(arr){ return [...arr].sort(()=>Math.random()-0.5); }

function escapeHtml(str){
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function demoRandInt(min, max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

function demoRandomGoals(){
  const bag = [0,0,1,1,1,2,2,2,3,3,4,5];
  return bag[demoRandInt(0, bag.length-1)];
}

function demoPlayMatch(p1, p2, allowDraw){
  const score1 = demoRandomGoals();
  const score2 = demoRandomGoals();
  if(allowDraw || score1!==score2){
    const winner = score1===score2 ? null : (score1>score2 ? p1 : p2);
    return {p1, p2, score1, score2, winner, pen1:null, pen2:null};
  }
  let pen1 = demoRandInt(3, 6);
  let pen2 = demoRandInt(3, 6);
  while(pen1===pen2){
    if(Math.random()<0.5) pen1 += 1;
    else pen2 += 1;
  }
  return {p1, p2, score1, score2, winner:pen1>pen2 ? p1 : p2, pen1, pen2};
}

function demoMatchText(m){
  const base = `${m.p1.name} ${m.score1}-${m.score2} ${m.p2.name}`;
  if(Number.isFinite(m.pen1) && Number.isFinite(m.pen2)){
    return `${base} (pen ${m.pen1}-${m.pen2})`;
  }
  return base;
}

function demoRoundName(total, idx){
  const remaining = total - idx;
  if(remaining===1) return t('roundFinal');
  if(remaining===2) return t('roundSemifinals');
  if(remaining===3) return t('roundQuarterfinals');
  if(remaining===4) return t('roundRoundOf16');
  return tf('roundNumber',{n: idx+1});
}

function renderDemoBracketHtml(demo){
  if(!demo?.knockoutRounds?.length) return `<div class="muted">${t('demoNoKnockoutData')}</div>`;
  const championId = demo.champion?.id || null;
  const championPathKeys = new Set();
  if(championId){
    const tracedPlayers = new Set([championId]);
    for(let ri=demo.knockoutRounds.length-1; ri>=0; ri--){
      const round = demo.knockoutRounds[ri];
      round.forEach((m,mi)=>{
        if(!m?.winner?.id || !tracedPlayers.has(m.winner.id)) return;
        championPathKeys.add(`${ri}-${mi}`);
        if(m.p1?.id) tracedPlayers.add(m.p1.id);
        if(m.p2?.id) tracedPlayers.add(m.p2.id);
      });
    }
  }

  const cols = demo.knockoutRounds.map((round, ri)=>{
    const depthClass = `round-depth-${Math.min(ri+1,6)}`;
    const isLastCol = ri===demo.knockoutRounds.length-1;
    const nodes = round.map((m,mi)=>{
      const tieKey = `${ri}-${mi}`;
      const isChampionPath = championPathKeys.has(tieKey);
      const nodeClass = `bracket-node ${isLastCol?'last-col':''} resolved newly-decided ${isChampionPath?'champion-path':''}`.trim();
      const cardClass = `card bracket-tie-card winner-locked newly-decided ${isChampionPath?'champion-path':''}`.trim();
      return `<div class="${nodeClass}">
        <div class="${cardClass}" style="padding:12px;">
          <div style="font-weight:700;margin-bottom:6px;">${escapeHtml(m.p1.name)} vs ${escapeHtml(m.p2.name)}</div>
          <div class="muted">${escapeHtml(demoMatchText(m))}</div>
          <div class="muted" style="margin-top:6px;">Clasificado: <b>${escapeHtml(m.winner?.name || '—')}</b></div>
        </div>
      </div>`;
    }).join('');
    return `<div class="bracket-col"><div class="bracket-col-head">${demoRoundName(demo.knockoutRounds.length, ri)}</div><div class="bracket-col-body ${depthClass}">${nodes}</div></div>`;
  }).join('');

  return `<div class="demo-bracket-wrap"><h4>${t('demoBracketModeTitle')}</h4><div class="bracket-board">${cols}</div></div>`;
}

function clampDemoPlayersCount(value){
  const max = getDemoPlayersDynamicMax();
  const parsed = parseInt(value);
  if(Number.isNaN(parsed)) return 6;
  return Math.max(2, Math.min(max, parsed));
}

function getDemoPlayersDynamicMax(){
  // Formato real de Champions League (fase liga): 36 participantes.
  return 36;
}

function demoUppercaseFirst(name){
  const clean = String(name || '').trim();
  if(!clean) return '';
  return clean.charAt(0).toLocaleUpperCase('es-ES') + clean.slice(1);
}

const DEMO_FALLBACK_NAMES = [
  'alex','bruno','carla','diego','elena','fabio','gabriela','hugo','irene','joel',
  'kiara','leo','marina','nico','olga','paula','quim','raquel','samir','tamara',
  'ulises','valeria','wanda','xavi','yasmin','zoe','adrian','bianca','ciro','diana',

function generateDemoSeason(requestedCount){
  const targetCount = clampDemoPlayersCount(requestedCount);
  const sourceNames = state.players.length>=3
    ? state.players.map(p=> demoUppercaseFirst(p?.name))
    : DEMO_FALLBACK_NAMES;

  const uniqueNames = [];
  const seen = new Set();
  sourceNames.forEach(raw=>{
    const display = demoUppercaseFirst(raw);
    if(!display) return;
    const key = normalizePlayerName(display);
    if(!key || seen.has(key)) return;
    seen.add(key);
    uniqueNames.push(display);
  });

  const pool = shuffle(uniqueNames);
  let fallbackCursor = 0;
  while(pool.length < targetCount){
    const base = DEMO_FALLBACK_NAMES[fallbackCursor++];
    if(!base) break;
    const candidate = demoUppercaseFirst(base);
    const key = normalizePlayerName(candidate);
    if(seen.has(key)) continue;
    seen.add(key);
    pool.push(candidate);
  }
  const picks = pool.slice(0, targetCount);
  const players = picks.map((name, idx)=>({id:`d${idx+1}`, name}));

  const table = {};
  players.forEach(p=>{
    table[p.id] = {id:p.id, name:p.name, pj:0, g:0, e:0, p:0, gf:0, gc:0, dg:0, pts:0};
  });

  const leagueMatches = [];
  const demoIds = players.map(p=> p.id);
  const targetRounds = autoMatchesPerPlayer(players.length);
  const rounds = generateRoundRobinRounds(demoIds, targetRounds);
  const byId = Object.fromEntries(players.map(p=> [p.id, p]));
  rounds.forEach(round=>{
    round.forEach(([a,b])=>{
      const home = byId[a];
      const away = byId[b];
      if(!home || !away) return;
      leagueMatches.push(demoPlayMatch(home, away, true));
    });
  });

  leagueMatches.forEach(m=>{
    const a = table[m.p1.id];
    const b = table[m.p2.id];
    a.pj += 1;
    b.pj += 1;
    a.gf += m.score1;
    a.gc += m.score2;
    b.gf += m.score2;
    b.gc += m.score1;
    if(m.score1>m.score2){
      a.g += 1;
      a.pts += 3;
      b.p += 1;
    }else if(m.score2>m.score1){
      b.g += 1;
      b.pts += 3;
      a.p += 1;
    }else{
      a.e += 1;
      b.e += 1;
      a.pts += 1;
      b.pts += 1;
    }
  });

  const standings = Object.values(table);
  standings.forEach(r=>{ r.dg = r.gf-r.gc; });
  standings.sort((a,b)=>{
    if(b.pts!==a.pts) return b.pts-a.pts;
    if(b.dg!==a.dg) return b.dg-a.dg;
    if(b.gf!==a.gf) return b.gf-a.gf;
    return Math.random()<0.5 ? -1 : 1;
  });

  const n = players.length;
  const q = n<=2 ? n : Math.max(2, Math.min(n-1, autoQualifiers(n)));
  const qualified = standings.slice(0, q).map(r=> players.find(p=> p.id===r.id)).filter(Boolean);

  let bracketSize = 1;
  while(bracketSize*2<=q) bracketSize*=2;

  const playoffMatches = [];
  let entrants = qualified.slice();
  if(q>bracketSize){
    const byeCount = (2*bracketSize)-q;
    const byes = qualified.slice(0, Math.max(0, byeCount));
    const playoffPool = qualified.slice(Math.max(0, byeCount));
    const playoffWinners = [];
    for(let i=0;i<playoffPool.length;i+=2){
      const m = demoPlayMatch(playoffPool[i], playoffPool[i+1], false);
      playoffMatches.push(m);
      playoffWinners.push(m.winner);
    }
    entrants = [...byes, ...playoffWinners];
  }

  const drawOrder = shuffle(entrants);
  const drawPairings = [];
  for(let i=0;i<drawOrder.length;i+=2){
    drawPairings.push([drawOrder[i], drawOrder[i+1]]);
  }

  const knockoutRounds = [];
  let active = drawOrder;
  while(active.length>1){
    const round = [];
    for(let i=0;i<active.length;i+=2){
      const m = demoPlayMatch(active[i], active[i+1], false);
      round.push(m);
    }
    knockoutRounds.push(round);
    active = round.map(m=> m.winner);
  }

  return {
    players,
    leagueMatchesCount: leagueMatches.length,
    standings,
    qualifiersCount: q,
    playoffMatches,
    drawPairings,
    knockoutRounds,
    champion: active[0] || null
  };
}

function buildAllowedPairings(ids){
  if(ids.length%2!==0) return null;
  function backtrack(remaining){
    if(!remaining.length) return [];
    const [first, ...rest] = remaining;
    const candidates = shuffle(rest);
    for(const candidate of candidates){
      if(cannotFaceEachOther(first, candidate)) continue;
      const next = remaining.filter(x=> x!==first && x!==candidate);
      const tail = backtrack(next);
      if(tail) return [[first, candidate], ...tail];
    }
    return null;
  }
  return backtrack(shuffle(ids));
}
function sameIdSet(a,b){
  if(!a || !b || a.length!==b.length) return false;
  const sa = [...a].sort().join('|');
  const sb = [...b].sort().join('|');
  return sa===sb;
}
function isThreePlayersThreeDrawsInvalid(tiedIds){
  if(state.players.length!==3 || tiedIds.length!==3) return false;
  const confirmed = state.leagueMatches.filter(m=> m.status==='confirmed');
  if(confirmed.length===0) return false;
  const draws = confirmed.filter(m=> m.score1===m.score2).length;
  return draws===confirmed.length;
}
function buildTieBreakRound(activeIds){
  const shuffledIds = shuffle(activeIds);
  const attempts = [];
  if(shuffledIds.length%2===1){
    shuffledIds.forEach(id=> attempts.push(id));
  } else {
    attempts.push(null);
  }

  for(const byeCandidate of attempts){
    const pool = byeCandidate ? shuffledIds.filter(id=> id!==byeCandidate) : [...shuffledIds];
    const pairs = buildAllowedPairings(pool);
    if(!pairs) continue;
    return {
      pairings: pairs.map(([p1,p2])=> ({id:uid(), p1, p2, pen1:null, pen2:null, winner:null, loser:null})),
      bye: byeCandidate,
      error: null
    };
  }
  return {pairings:[], bye:null, error:'No se pudieron generar cruces de desempate sin enfrentar jugadores del mismo nombre base.'};
}
function startLeagueTieBreaker(ids){
  const first = buildTieBreakRound(ids);
  if(first.error) return first.error;
  state.leagueTieBreaker = {
    ids:[...ids],
    round:1,
    pairings:first.pairings,
    bye:first.bye,
    eliminated:[]
  };
  log('Organizador', 'inició desempate por penaltis con cruces aleatorios entre: '+ids.map(playerName).join(', '));
  saveAndRender();
  return null;
}
function finalizeLeagueTieBreaker(winnerId){
  const tb = state.leagueTieBreaker;
  if(!tb) return;
  const ranking = [winnerId, ...tb.eliminated.slice().reverse()];
  tb.ids.forEach(id=>{ if(!ranking.includes(id)) ranking.push(id); });
  ranking.forEach((id,i)=> state.tieResolution[id]=i);
  log('Organizador', 'desempate por penaltis finalizado. Orden: '+ranking.map(playerName).join(' > '));
  state.leagueTieBreaker = null;
  saveAndRender();
}
function submitLeagueTiePenalty(pairingId, pen1, pen2){
  const tb = state.leagueTieBreaker;
  if(!tb) return t('errNoTieBreakerActive');
  const pair = tb.pairings.find(p=> p.id===pairingId);
  if(!pair) return t('errTiePairNotFound');
  if(Number.isNaN(pen1)||Number.isNaN(pen2)||pen1<0||pen2<0) return t('errInvalidPenalties');
  if(pen1===pen2) return t('errShootoutNoDraw');

  pair.pen1 = pen1;
  pair.pen2 = pen2;
  pair.winner = pen1>pen2 ? pair.p1 : pair.p2;
  pair.loser = pair.winner===pair.p1 ? pair.p2 : pair.p1;

  const pending = tb.pairings.some(p=> !p.winner);
  if(pending){
    saveAndRender();
    return null;
  }

  tb.eliminated.push(...tb.pairings.map(p=> p.loser));
  const survivors = tb.pairings.map(p=> p.winner);
  if(tb.bye) survivors.push(tb.bye);

  if(survivors.length===1){
    finalizeLeagueTieBreaker(survivors[0]);
    return null;
  }

  const next = buildTieBreakRound(survivors);
  if(next.error) return next.error;
  tb.round += 1;
  tb.pairings = next.pairings;
  tb.bye = next.bye;
  saveAndRender();
  return null;
}
function restartInvalidLeagueSeason(){
  state.phase='setup';
  state.leagueGroups=[];
  state.leagueMatches=[];
  state.playoffMatches=[];
  state.bracket=null;
  state.knockoutDraw=null;
  state.champion=null;

  state.seasonKickoff=null;
  log('Sistema','temporada inválida: 3 jugadores con todos los partidos empatados. Se reinicia la temporada.');
  saveAndRender();
}

/* ---------------- BRACKET HELPERS ---------------- */
function autoMatchesPerPlayer(n){
  // Formato Champions League (fase liga): tope de 8 partidos por equipo.
  // Si hay pocos jugadores, cada equipo juega como maximo contra todos una vez.
  return Math.max(1, Math.min(8, n-1));
}
function autoQualifiers(n){
  // Formato forzado para experiencia uniforme:
  // - Con plantillas pequenas (<=6) evitamos clasificados potencia de 2 para forzar play-off.
  if(n<=2) return Math.min(n,2);
  if(n<=6){
    let q = n-1;
    if((q & (q-1))===0) q = Math.max(2, q-1);
    return Math.min(n-1, q);
  }
  let q = Math.floor(n*24/36);
  q = Math.max(2, q);
  q = Math.min(n-1, q);
  return q;
}
function effectiveNumQualifiers(){
  const n = state.players.length;
  if(n<=0) return 0;
  if(n===1) return 1;
  if(n===2) return 2; // Con 2 jugadores tambien hay liguilla y ambos pasan a eliminatoria.

  const auto = autoQualifiers(n);
  let q = auto;
  q = Math.max(2, q);
  q = Math.min(n-1, q);
  return q;
}
function nearestPow2LE(x){ let p=1; while(p*2<=x) p*=2; return p; }
function firstKnockoutBonusBySize(size){
  if(size>=16) return {amount: state.finance.prizes.round16, key:'round16', label:'clasificarse a octavos'};
  if(size===8) return {amount: state.finance.prizes.quarter, key:'quarter', label:'clasificarse a cuartos'};
  if(size===4) return {amount: state.finance.prizes.semi, key:'semi', label:'clasificarse a semifinales'};
  return null;
}
function nextRoundBonusBySize(size){
  if(size===16) return {amount: state.finance.prizes.quarter, key:'quarter', label:'clasificarse a cuartos'};
  if(size===8) return {amount: state.finance.prizes.semi, key:'semi', label:'clasificarse a semifinales'};
  if(size===4) return {amount: state.finance.prizes.runnerUp, key:'runnerup', label:'clasificarse a la final'};
  return null;
}
function buildKnockoutSkeleton(P){
  const round0 = [];
  for(let i=0;i<P/2;i++){
    round0.push({id:uid(), round:0, slot:i,
      p1:null, p2:null,
      score1:null,score2:null,peno1:null,peno2:null,status:'empty',reportedBy:null,confirmedBy:null,dispute:null,mustReReportBy:null,
      legs: P===2 ? 1 : 2,
      leg1:null,
      leg2:null,
      agg1:null,
      agg2:null,
      aggPeno1:null,
      aggPeno2:null
    });
  }
  const rounds=[round0];
  let m = P/2;
  while(m>1){
    m = m/2;
    rounds.push(Array.from({length:m},(_,idx)=>({id:uid(),round:rounds.length,slot:idx,
      p1:null,p2:null,score1:null,score2:null,peno1:null,peno2:null,status:'empty',reportedBy:null,confirmedBy:null,dispute:null,mustReReportBy:null,
      legs: (rounds.length===Math.log2(P)-1) ? 1 : 2,
      leg1:null,
      leg2:null,
      agg1:null,
      agg2:null,
      aggPeno1:null,
      aggPeno2:null
    })));
  }
  return {size:P, rounds};
}

function startKnockoutDraw(entrants, P){
  const pairings = buildAllowedPairings(entrants);
  if(!pairings) return t('drawConflictError');
  state.bracket = buildKnockoutSkeleton(P);
  state.knockoutDraw = {
    pairings,
    revealed: 0,
    startedAt: null,
    nextRevealAt: null,
    complete: false
  };
  return null;
}

function revealNextDrawPair(){
  if(!state.knockoutDraw || state.knockoutDraw.complete) return false;
  const idx = state.knockoutDraw.revealed;
  const pair = state.knockoutDraw.pairings[idx];
  if(!pair) return false;
  const match = state.bracket.rounds[0][idx];
  match.p1 = pair[0];
  match.p2 = pair[1];
  state.knockoutDraw.revealed++;
  log('Sistema', 'Sorteo: '+playerName(pair[0])+' vs '+playerName(pair[1]));
  if(state.knockoutDraw.revealed >= state.knockoutDraw.pairings.length){
    state.knockoutDraw.complete = true;
    state.knockoutDraw.nextRevealAt = null;
    log('Sistema', 'Sorteo finalizado. Empieza la fase eliminatoria.');
  } else {
    state.knockoutDraw.nextRevealAt = Date.now() + 10000;
  }
  return true;
}

function processKnockoutDrawClock(){
  if(!state?.knockoutDraw || !state.knockoutDraw.startedAt || state.knockoutDraw.complete) return false;
  let changed = false;
  while(state.knockoutDraw.nextRevealAt && Date.now()>=state.knockoutDraw.nextRevealAt){
    if(!revealNextDrawPair()) break;
    changed = true;
  }
  if(changed){
    saveAndRender();
    return true;
  }
  return false;
}
function propagateBracket(){
  const br = state.bracket;
  if(!br) return;
  for(let r=0;r<br.rounds.length;r++){
    br.rounds[r].forEach(m=>{
      if(m.legs===2) updateTieWinner(m);
      if(m.status==='confirmed' && m.winner){
        const currentSize = br.size / Math.pow(2,r);
        const nxt = nextRoundBonusBySize(currentSize);
        if(nxt && r+1 < br.rounds.length){
          addMoney(m.winner, nxt.amount, `ko:${state.season}:${m.id}:${nxt.key}:${m.winner}`, nxt.label);
        }
        if(r+1 < br.rounds.length){
          const next = br.rounds[r+1][Math.floor(m.slot/2)];
          if(m.slot%2===0) next.p1 = m.winner; else next.p2 = m.winner;
        } else {
          if(!state.champion){
            state.champion = m.winner;
            state.phase='finished';
            const loser = m.winner===m.p1? m.p2 : m.p1;
            addMoney(loser, state.finance.prizes.runnerUp, `ko:${state.season}:${m.id}:runner:${loser}`, 'subcampeón');
            addMoney(m.winner, state.finance.prizes.champion, `ko:${state.season}:${m.id}:champ:${m.winner}`, 'campeón');
            log('Sistema', 'Campeón decidido: '+playerName(m.winner));
          }
        }
      }
    });
  }
}
function playerName(id){ const p=state.players.find(x=>x.id===id); return p? p.name : '—'; }
function playerDisplayName(id, refState = state){
  const label = localTeamSlotLabel(id, refState);
  return label ? `${playerName(id)} (${label})` : playerName(id);
}

/* ---------------- RESULT REPORTING (generic, anti-cheat) ---------------- */
function findPlayer(id){ return state.players.find(p=>p.id===id); }

function addMoney(playerId, amount, reasonKey, reasonText){
  if(!state.finance.applied) state.finance.applied = {};
  if(!state.finance.lifetimeByPlayer) state.finance.lifetimeByPlayer = {};
  if(state.finance.applied[reasonKey]) return;
  const p = findPlayer(playerId);
  if(!p) return;
  if(typeof p.money!=='number') p.money = 0;
  p.money += amount;
  state.finance.lifetimeByPlayer[playerId] = (state.finance.lifetimeByPlayer[playerId]||0) + amount;
  state.finance.applied[reasonKey] = true;
  log('Sistema', `${p.name} recibe ${fmtMoney(amount)} por ${reasonText}.`);
}

function fmtMoney(n){
  return new Intl.NumberFormat('es-ES', { style:'currency', currency:'EUR', maximumFractionDigits:0 }).format(n);
}

function getQualifiedIds(){ return Array.isArray(state.qualifiers) ? state.qualifiers : []; }
function getNonQualifiedIds(){
  const q = new Set(getQualifiedIds());
  return state.players.map(p=>p.id).filter(id=>!q.has(id));
}
function getBetOptionFromMatch(match){
  if(match.score1===null || match.score2===null) return null;
  if(match.score1>match.score2) return 'home';
  if(match.score2>match.score1) return 'away';
  return 'draw';
}
function getMinimumQualifiedMoney(){
  const q = getQualifiedIds();
  if(!q.length) return Infinity;
  const vals = q.map(id=> findPlayer(id)?.money ?? 0);
  return Math.min(...vals);
}
function getBetMoneyCeiling(){
  const champCap = Math.max(0, state.bets.championMoneyCap || state.finance.prizes.champion);
  const qualCap = getMinimumQualifiedMoney();
  return Math.max(0, Math.min(champCap, qualCap));
}
function getMaxStakeForPlayer(playerId){
  const bettor = findPlayer(playerId);
  if(!bettor) return 0;
  const balance = Math.max(0, Math.floor(bettor.money || 0));
  const byPct = Math.max(0, Math.floor(balance * state.bets.maxStakePct));
  return Math.min(balance, byPct);
}
function getStakePresets(maxStake){
  const safeMax = Math.max(0, Math.floor(maxStake || 0));
  if(safeMax<=0) return [];
  const low = Math.max(1, Math.floor(safeMax * 0.34));
  const mid = Math.max(1, Math.floor(safeMax * 0.67));
  const high = safeMax;
  return [low, mid, high];
}
function getOpenBetTicket(playerId, matchId){
  return state.bets.tickets.find(t=> t.playerId===playerId && t.matchId===matchId && t.status==='open');
}
function findMatchForTicket(matchId){
  let match = (state.leagueMatches || []).find(m=> m.id===matchId);
  if(match) return match;
  match = (state.playoffMatches || []).find(m=> m.id===matchId);
  if(match) return match;
  if(state.bracket?.rounds){
    for(const round of state.bracket.rounds){
      for(const tie of round){
        if(tie.id===matchId) return tie;
        if(tie.leg1?.id===matchId) return tie.leg1;
        if(tie.leg2?.id===matchId) return tie.leg2;
      }
    }
  }
  return null;
}
function renderBetActivityBoard(title){
  const card = el(`<div class="card bet-arcade"><h3>${title}</h3><div class="muted" style="margin-bottom:8px;">${t('betBoardSharedView')}</div><div class="bet-rail"></div></div>`);
  const rail = card.querySelector('.bet-rail');
  const tickets = (state.bets?.tickets || [])
    .filter(t=> t.season===state.season)
    .slice()
    .reverse();
  if(!tickets.length){
    rail.appendChild(el(`<div class="muted">${t('betBoardEmptySeason')}</div>`));
    return card;
  }
  tickets.forEach(t=>{
    const m = findMatchForTicket(t.matchId);
    const fallbackHome = t.homeName || 'Jugador 1';
    const fallbackAway = t.awayName || 'Jugador 2';
    const pickTxt = m
      ? getPickLabelForMatch(m, t.pick)
      : (t.pick==='home' ? fallbackHome : (t.pick==='away' ? fallbackAway : 'Empate'));
    const matchTxt = m ? `${playerName(m.p1)} vs ${playerName(m.p2)}` : `${fallbackHome} vs ${fallbackAway}`;
    const statusTag = t.status==='open'
      ? '<span class="tag pending">abierta</span>'
      : (t.status==='settled'
        ? `<span class="tag ${t.won?'confirmed':'dispute'}">${t.won?'ganada':'perdida'}</span>`
        : '<span class="tag empty">anulada</span>');
    const tone = t.status==='open' ? 'open' : (t.status==='settled' ? (t.won ? 'won' : 'lost') : 'void');
    const payoutTxt = t.status==='open'
      ? 'Pendiente de resolución.'
      : (t.status==='settled'
        ? (t.won ? `Cobro: ${fmtMoney(t.payout||0)}.` : `Pérdida: ${fmtMoney(t.stake||0)}.`)
        : 'Apuesta anulada.');
    rail.appendChild(el(`<div class="bet-ticket ${tone}"><div class="bet-ticket-head"><span class="bet-ticket-player">${playerName(t.playerId)}</span>${statusTag}</div><div class="meta"><b>${fmtMoney(t.stake||0)}</b> · ${pickTxt}</div><div class="meta">${matchTxt}</div><div class="meta" style="margin-top:4px;">${payoutTxt}</div></div>`));
  });
  return card;
}
function getPickLabelForMatch(match, pick){
  if(!match) return pick==='draw' ? 'Empate' : 'Ganador';
  if(pick==='home') return playerName(match.p1);
  if(pick==='away') return playerName(match.p2);
  return 'Empate';
}
function fillPickOptions(selectEl, match){
  if(!selectEl) return;
  selectEl.innerHTML = '';
  selectEl.appendChild(el(`<option value="home">Gana ${playerName(match.p1)}</option>`));
  selectEl.appendChild(el(`<option value="draw">Empate</option>`));
  selectEl.appendChild(el(`<option value="away">Gana ${playerName(match.p2)}</option>`));
}
function getBettableMatches(){
  if(state.phase==='league'){
    return state.leagueMatches.filter(m=> m.p1 && m.p2);
  }
  const matches = [];
  if(!state.bracket?.rounds) return matches;
  state.bracket.rounds.forEach(round=>{
    round.forEach(tie=>{
      if(!tie.p1 || !tie.p2) return;
      if(tie.legs===2){
        matches.push(ensureTieLeg(tie, 1));
        matches.push(ensureTieLeg(tie, 2));
      } else {
        matches.push(tie);
      }
    });
  });
  return matches;
}
function canOpenBetForMatch(match){
  if(!match || !match.p1 || !match.p2) return false;
  if(match.status==='confirmed') return false;
  if(state.phase!=='league' && state.phase!=='knockout' && state.phase!=='playoff') return false;
  const bettors = getEligibleBettorsForMatch(match);
  if(!bettors.length) return false;
  const bettorId = bettors[0].id;
  if(getOpenBetTicket(bettorId, match.id)) return false;
  return true;
}
function getEligibleBettorsForMatch(match){
  const localIds = getLocalPlayerIds();
  if(!localIds.length) return [];
  if(state.phase==='league'){
    return localIds
      .map(findPlayer)
      .filter(Boolean)
      .filter(p=> p.id!==match.p1 && p.id!==match.p2);
  }
  if(state.phase==='knockout' || state.phase==='playoff'){
    return localIds
      .filter(id=> !getQualifiedIds().includes(id))
      .map(findPlayer)
      .filter(Boolean);
  }
  return [];
}
function openBetForMatchModal(matchId){
  const match = getBettableMatches().find(m=> m.id===matchId) || state.leagueMatches.find(m=> m.id===matchId);
  if(!match) return;
  if(!canOpenBetForMatch(match)){
    alert(t('alertMatchNotBettable'));
    return;
  }
  const bettors = getEligibleBettorsForMatch(match);
  if(!bettors.length){

  }

  pendingModal = ()=>{
    const header = `${playerName(match.p1)} vs ${playerName(match.p2)}`;
    const bg = el(`<div class="modal-bg"><div class="modal">
      <span class="close">✕</span>
      <h3>Apostar en ${header}</h3>
      <div class="muted" style="margin-bottom:10px;">Elige pronóstico y monto para este emparejamiento.</div>
      <label>Apostador</label><input id="bm-bettor" type="text" disabled>
      <label>Pronóstico</label>
      <select id="bm-pick"></select>
      <label>Monto</label>
      <input type="number" id="bm-stake" min="1" step="1" readonly>
      <div id="bm-max" class="muted" style="margin-bottom:8px;"></div>
      <div id="bm-presets" class="bet-presets" style="margin-bottom:10px;"></div>
