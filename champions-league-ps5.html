    wrap.appendChild(el(`<div class="muted" style="margin-top:8px;">Añade al menos 2 jugadores para iniciar la liguilla.</div>`));
  }

  return wrap;
}

/* ---- LEAGUE TAB ---- */
function renderLeagueTab(){
  const wrap = document.createElement('div');
  if(state.phase==='setup'){
    wrap.appendChild(el(`<div class="banner info">La liguilla aún no ha empezado. Configúrala en la pestaña Configuración.</div>`));
    return wrap;
  }

  // standings
  const standings = computeStandings();
  const Q = effectiveNumQualifiers();
  const pendingWithScore = state.leagueMatches.filter(m=> m.status==='pending' && m.score1!==null && m.score2!==null).length;
  state.config.numQualifiers = Q;
  const card = el(`<div class="card"><h3>Clasificación</h3><table>
    <thead><tr><th>#</th><th class="name">Jugador</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>DG</th><th>Pts</th></tr></thead>
    <tbody id="league-standings-body"></tbody>
  </table></div>`);
  const tableBody = card.querySelector('#league-standings-body');
  const tiedIds = state.phase==='league'? tiedGroupsAtCutoff(standings,Q) : [];

  function appendCell(row, value, cls){
    const td = document.createElement('td');
    if(cls) td.className = cls;
    td.textContent = String(value);
    row.appendChild(td);
    return td;
  }

  standings.forEach((s,i)=>{
    const name = (s?.name || '').trim() || 'Jugador';
    const pj = Number.isFinite(Number(s?.pj)) ? Number(s.pj) : 0;
    const g = Number.isFinite(Number(s?.g)) ? Number(s.g) : 0;
    const e = Number.isFinite(Number(s?.e)) ? Number(s.e) : 0;
    const p = Number.isFinite(Number(s?.p)) ? Number(s.p) : 0;
    const dg = Number.isFinite(Number(s?.dg)) ? Number(s.dg) : 0;
    const pts = Number.isFinite(Number(s?.pts)) ? Number(s.pts) : 0;
    const tr = document.createElement('tr');
    if(i<Q) tr.classList.add('qual');
    if(tiedIds.includes(s.id)) tr.classList.add('tied');
    appendCell(tr, i+1);
    appendCell(tr, name, 'name');
    appendCell(tr, pj);
    appendCell(tr, g);
    appendCell(tr, e);
    appendCell(tr, p);
    appendCell(tr, `${dg>0?'+':''}${dg}`);
    const ptsCell = appendCell(tr, pts);
    ptsCell.style.fontWeight = '700';
    tableBody.appendChild(tr);
  });
  if(!standings.length){
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 8;
    td.className = 'muted';
    td.textContent = 'Sin datos de clasificación todavía.';
    tr.appendChild(td);
    tableBody.appendChild(tr);
  }
  card.appendChild(el(`<div class="muted" style="margin-top:8px;">Los ${Q} primeros (resaltados) pasan a la fase eliminatoria.</div>`));
  if(pendingWithScore>0){
    card.appendChild(el(`<div class="muted" style="margin-top:6px;">Clasificación provisional: incluye ${pendingWithScore} resultado${pendingWithScore===1?'':'s'} pendiente${pendingWithScore===1?'':'s'} de confirmar.</div>`));
  }
  wrap.appendChild(card);

  if(tiedIds.length){
    const tieCard = el(`<div class="card"><div class="banner warn">Hay un empate entre estos jugadores justo en la línea de clasificación: ${tiedIds.map(playerName).join(', ')}. Ya se comprobaron puntos, diferencia de goles, goles a favor y resultado directo.</div></div>`);

    if(isThreePlayersThreeDrawsInvalid(tiedIds)){
      tieCard.appendChild(el(`<div class="banner warn">Caso especial: 3 jugadores y todos los partidos terminaron en empate. Esta temporada se considera inválida y debe reiniciarse.</div>`));
      const rb = el(`<button class="danger">Reiniciar temporada inválida</button>`);
      rb.onclick=()=> restartInvalidLeagueSeason();
      tieCard.appendChild(rb);
      wrap.appendChild(tieCard);
    } else {
      const activeTb = state.leagueTieBreaker && sameIdSet(state.leagueTieBreaker.ids, tiedIds) ? state.leagueTieBreaker : null;
      if(!activeTb){
        tieCard.appendChild(el(`<div class="muted" style="margin-bottom:8px;">El sistema generará cruces aleatorios entre los empatados y avanzará por rondas de tandas de penaltis hasta dejar un único ganador.</div>`));
        const btn = el(`<button class="danger">Generar cruces aleatorios de penaltis</button>`);
        btn.onclick=()=>{
          const err = startLeagueTieBreaker(tiedIds);
          if(err) alert(err);
        };
        tieCard.appendChild(btn);
      } else {
        tieCard.appendChild(el(`<div class="muted" style="margin-bottom:8px;">Desempate en curso · Ronda ${activeTb.round}${activeTb.bye?` · Descansa: ${playerName(activeTb.bye)}`:''}</div>`));
        const list = el(`<div class="matchlist"></div>`);
        activeTb.pairings.forEach(pair=>{
          const scoreTxt = pair.pen1!==null ? `${pair.pen1}-${pair.pen2}` : 'pendiente';
          const row = el(`<div class="match"><div class="vs"><span>${playerName(pair.p1)}</span><span>${scoreTxt}</span><span>${playerName(pair.p2)}</span></div><span class="tag ${pair.winner?'confirmed':'pending'}">${pair.winner?'resuelto':'pendiente'}</span></div>`);
          if(!pair.winner){
            const b = el(`<button class="small danger">Cargar tanda</button>`);
            b.onclick=()=> openLeagueTiePairPenaltyModal(pair.id);
            row.appendChild(b);
          }
          list.appendChild(row);
        });
        tieCard.appendChild(list);
      }
      wrap.appendChild(tieCard);
    }
  }

  if(state.phase==='league'){
    if(state.players.length===3){
      const bettingCard = el(`<div class="card"><h3>Apuesta del jugador que descansa (solo liguilla de 3)</h3><div class="muted" style="margin-bottom:8px;">Para evitar botones duplicados, las apuestas ahora se hacen desde cada partido con el botón <b>Apostar</b>.</div></div>`);
      wrap.appendChild(bettingCard);
    }
    wrap.appendChild(renderBetActivityBoard('Panel de apuestas de la liguilla'));

    const closeCard = el(`<div class="card"><h3>Calendario de la liguilla</h3></div>`);
    closeCard.appendChild(el(`<div class="muted" style="margin-bottom:8px;">Antitrampas: un resultado queda en <b>pendiente</b> hasta que el rival pulse <b>Aceptar</b> o <b>Rechazar</b>. Si rechaza, debe volver a reportarlo quien lo cargó primero.</div>`));
    const ml = el(`<div class="matchlist"></div>`);
    const byRound = {};
    state.leagueMatches.forEach(m=> (byRound[m.round]=byRound[m.round]||[]).push(m));
    Object.keys(byRound).sort((a,b)=>a-b).forEach(r=>{
      ml.appendChild(el(`<div class="muted" style="margin:10px 0 4px;font-weight:700;">Jornada ${r}</div>`));
      byRound[r].forEach(m=> ml.appendChild(renderMatchRow(m, false)));
    });
    closeCard.appendChild(ml);
    wrap.appendChild(closeCard);

    const allConfirmed = state.leagueMatches.every(m=>m.status==='confirmed');
    const closeBtn = el(`<button class="gold" ${(!allConfirmed||tiedIds.length)?'disabled':''}>Cerrar liguilla y generar fase eliminatoria</button>`);
    closeBtn.onclick=()=>{
      const err = closeLeague();
      if(err) alert(err);
    };
    wrap.appendChild(closeBtn);
    if(!allConfirmed) wrap.appendChild(el(`<div class="muted" style="margin-top:8px;">Faltan partidos por confirmar.</div>`));
  } else {
    const ml = el(`<div class="card"><h3>Resultados de la liguilla</h3><div class="matchlist"></div></div>`);
    const list = ml.querySelector('.matchlist');
    state.leagueMatches.forEach(m=> list.appendChild(renderMatchRow(m,false)));
    wrap.appendChild(ml);
  }

  if(state.phase==='playoff'){
    const poCard = el(`<div class="card"><h3>Play-off de clasificación</h3><div class="muted" style="margin-bottom:8px;">Estos jugadores quedaron entre medias y se cruzan a partido único (mejor vs peor de ese grupo) para completar el cuadro de eliminatorias.</div><div class="matchlist"></div></div>`);
    const list = poCard.querySelector('.matchlist');
    state.playoffMatches.forEach(m=> list.appendChild(renderMatchRow(m,true)));
    wrap.appendChild(poCard);
    const allDone = state.playoffMatches.every(m=>m.status==='confirmed'&&m.winner);
    const btn = el(`<button class="gold" ${allDone?'':'disabled'}>Cerrar play-off y generar cuadro de eliminatorias</button>`);
    btn.onclick=()=>{ const err = closePlayoff(); if(err) alert(err); };
    wrap.appendChild(btn);
  }
  return wrap;
}

/* ---- generic match row with report/confirm UI ---- */
function renderMatchRow(m, decisive){
  const p1 = playerName(m.p1), p2 = playerName(m.p2);
  const scoreTxt = m.score1!==null ? `${m.score1} - ${m.score2}` + (m.peno1!==null? ` (pen. ${m.peno1}-${m.peno2})`: '') : '— vs —';
  const row = el(`<div class="match">
    <div class="vs"><span>${p1}</span><span>${scoreTxt}</span><span>${p2}</span></div>
    <span class="tag ${m.status}">${({empty:'sin jugar',pending:'pendiente',confirmed:'confirmado',dispute:'disputa'})[m.status]}</span>
  </div>`);
  const canAct = canActOnMatch(m);

  if(canAct){
    const btnLabel = m.status==='confirmed' ? 'Corregir' : (m.status==='pending' ? 'Confirmar' : 'Resultado');
    const btn = el(`<button class="small secondary">${btnLabel}</button>`);
    btn.onclick=()=> openMatchModal(m, decisive, m.status==='confirmed');
    row.appendChild(btn);
  }
  if(canOpenBetForMatch(m)){
    const betBtn = el(`<button class="small gold" type="button">Apostar</button>`);
    betBtn.onclick=()=> openBetForMatchModal(m.id);
    row.appendChild(betBtn);
  }
  return row;
}

function canActOnMatch(match){
  const activeId = state.myPlayerId || null;
  if(!activeId || !match) return false;
  if(match.status==='pending'){
    const expectedDecider = match.reportedBy===match.p1 ? match.p2 : (match.reportedBy===match.p2 ? match.p1 : null);
    return activeId===expectedDecider;
  }
  return activeId===match.p1 || activeId===match.p2;
}

function ensureTieLeg(tie, idx){
  const key = idx===1 ? 'leg1' : 'leg2';
  if(!tie[key]){
    tie[key] = {
      id: uid(),
      p1: tie.p1,
      p2: tie.p2,
      score1: null,
      score2: null,
      peno1: null,
      peno2: null,
      status: 'empty',
      reportedBy: null,
      confirmedBy: null,
      dispute: null,
      mustReReportBy: null
    };
  }
  tie[key].p1 = tie.p1;
  tie[key].p2 = tie.p2;
  return tie[key];
}

function updateTieWinner(tie){
  if(tie.legs===1){
    if(tie.status!=='confirmed') return;
    if(tie.score1>tie.score2) tie.winner=tie.p1;
    else if(tie.score2>tie.score1) tie.winner=tie.p2;
    else if(tie.peno1!==null && tie.peno2!==null && tie.peno1!==tie.peno2) tie.winner = tie.peno1>tie.peno2 ? tie.p1 : tie.p2;
    return;
  }

  const l1 = tie.leg1, l2 = tie.leg2;
  tie.winner = null;
  tie.status = 'empty';
  if(!l1 || !l2) return;
  if(l1.status!=='confirmed' || l2.status!=='confirmed') return;

  const agg1 = l1.score1 + l2.score1;
  const agg2 = l1.score2 + l2.score2;
  tie.agg1 = agg1;
  tie.agg2 = agg2;
  tie.winner = null;
  if(agg1>agg2){ tie.winner=tie.p1; tie.status='confirmed'; }
  else if(agg2>agg1){ tie.winner=tie.p2; tie.status='confirmed'; }
  else if(tie.aggPeno1!==null && tie.aggPeno2!==null && tie.aggPeno1!==tie.aggPeno2){
    tie.winner = tie.aggPeno1>tie.aggPeno2 ? tie.p1 : tie.p2;
    tie.status = 'confirmed';
    tie.dispute = null;
  }
  else { tie.status='dispute'; tie.dispute = {aggregate:true}; }
}

function setAggregatePenaltyWinner(tie, p1, p2){
  if(tie.legs!==2) return 'Esta serie no es ida y vuelta.';
  if(isNaN(p1)||isNaN(p2)) return 'Indica ambos marcadores de penaltis.';
  if(p1===p2) return 'En penaltis no puede haber empate.';
  tie.aggPeno1 = p1;
  tie.aggPeno2 = p2;
  updateTieWinner(tie);
  if(!tie.winner) return 'No se pudo definir ganador con esos datos.';
  log('Organizador', 'registró penaltis de desempate global: '+playerName(tie.p1)+' '+p1+'-'+p2+' '+playerName(tie.p2)+'.');
  saveAndRender();
  return null;
}

function openAggregatePenaltyModal(tie){
  pendingModal = ()=>{
    const bg = el(`<div class="modal-bg"><div class="modal">
      <span class="close">✕</span>
      <h3>Penaltis de desempate global</h3>
      <div class="muted" style="margin-bottom:8px;">${playerName(tie.p1)} vs ${playerName(tie.p2)} · Global ${tie.agg1}-${tie.agg2}</div>
      <div class="row">
        <div><label>Penaltis ${playerName(tie.p1)}</label><input type="number" id="agg-p1" min="0" value="${tie.aggPeno1??''}"></div>
        <div><label>Penaltis ${playerName(tie.p2)}</label><input type="number" id="agg-p2" min="0" value="${tie.aggPeno2??''}"></div>
      </div>
      <div id="agg-err" class="muted" style="color:#ffb3ad;"></div>
      <button id="agg-save" class="gold">Guardar penaltis</button>
    </div></div>`);
    bg.querySelector('.close').onclick=()=>{pendingModal=null; render();};
    bg.querySelector('#agg-save').onclick=()=>{
      const p1 = parseInt(bg.querySelector('#agg-p1').value);
      const p2 = parseInt(bg.querySelector('#agg-p2').value);
      const err = setAggregatePenaltyWinner(tie, p1, p2);
      if(err){ bg.querySelector('#agg-err').textContent = err; return; }
      pendingModal=null;
      render();
    };
    return bg;
  };
  render();
}

  pendingModal = ()=>{

      <div id="lt-err" class="muted" style="color:#ffb3ad;"></div>
      <button id="lt-save" class="danger">Guardar tanda</button>

function renderKnockoutTieRow(tie){
  const box = el(`<div class="card" style="padding:12px;"></div>`);
  const title = tie.legs===1
    ? `${playerName(tie.p1)} vs ${playerName(tie.p2)} · Final`
    : `${playerName(tie.p1)} vs ${playerName(tie.p2)} · Ida y vuelta`;
  box.appendChild(el(`<div style="font-weight:700;margin-bottom:8px;">${title}</div>`));

  if(tie.legs===2){
    const leg1 = ensureTieLeg(tie, 1);
    const leg2 = ensureTieLeg(tie, 2);
    box.appendChild(el(`<div class="muted" style="margin-bottom:6px;">Ida</div>`));
    box.appendChild(renderMatchRow(leg1, false));
    box.appendChild(el(`<div class="muted" style="margin-top:8px;margin-bottom:6px;">Vuelta</div>`));
    box.appendChild(renderMatchRow(leg2, false));
    updateTieWinner(tie);
    const aggTxt = (tie.agg1!==null&&tie.agg2!==null) ? `Global: ${tie.agg1}-${tie.agg2}` : 'Global: por definir';
    const penTxt = tie.aggPeno1!==null && tie.aggPeno2!==null ? ` · Penaltis: ${tie.aggPeno1}-${tie.aggPeno2}` : '';
    box.appendChild(el(`<div class="muted" style="margin-top:8px;">${aggTxt}${penTxt}${tie.winner?` · Clasificado: <b>${playerName(tie.winner)}</b>`:''}</div>`));
    if(tie.dispute?.aggregate){
      const rb = el(`<button class="small gold" style="margin-top:8px;">Registrar penaltis de desempate</button>`);
      rb.onclick=()=> openAggregatePenaltyModal(tie);
      box.appendChild(rb);
    }
  } else {
    box.appendChild(renderMatchRow(tie, true));
  }
  return box;
}

function openMatchModal(match, decisive, isAdminEdit){
  if(!isAdminEdit && match?.status!=='dispute' && !canActOnMatch(match)){
    return;
  }
  const disputeText = match.status==='dispute' && match.dispute
    ? (match.dispute.aggregate
      ? 'Empate global tras ida y vuelta. Solo el organizador puede resolverlo.'
      : `${playerName(match.p1)} reportó ${match.dispute.first.score1}-${match.dispute.first.score2}${match.dispute.first.peno1!==null?` (pen ${match.dispute.first.peno1}-${match.dispute.first.peno2})`:''}, y la otra parte indicó ${match.dispute.second.score1}-${match.dispute.second.score2}${match.dispute.second.peno1!==null?` (pen ${match.dispute.second.peno1}-${match.dispute.second.peno2})`:''}. Solo el organizador puede resolverlo abajo.`)
    : '';
  pendingModal = ()=>{
    const bg = el(`<div class="modal-bg"><div class="modal">
      <span class="close">✕</span>
      <h3>${playerName(match.p1)} vs ${playerName(match.p2)}</h3>
      ${match.status==='dispute'? `<div class="banner warn">En disputa: ${disputeText}</div>`:''}
    </div></div>`);
    const modal = bg.querySelector('.modal');
    const form = (isAdminEdit || match.status==='dispute')
      ? renderAdminForm(match, decisive)
      : (match.status==='pending' ? renderPendingDecisionForm(match, decisive) : renderPlayerForm(match, decisive));
    if(!(isAdminEdit || match.status==='dispute' || match.status==='pending')){
      modal.classList.add('result-modal');
    }
    modal.appendChild(form);
    bg.querySelector('.close').onclick=()=>{pendingModal=null; render();};
    return bg;
  };
  render();
}

  function refreshPenaltiesState(){
    if(!decisive || !penWrap) return;
    const s1 = parseInt(s1El.value);
    const s2 = parseInt(s2El.value);
    const isTie = !Number.isNaN(s1) && !Number.isNaN(s2) && s1===s2;
    penWrap.style.display = isTie ? '' : 'none';
    if(!isTie && pn1El && pn2El){
      pn1El.value = '';
      pn2El.value = '';
    }
  }

  quickBtns.forEach(btn=>{
    btn.onclick = ()=>{
      s1El.value = btn.dataset.s1;
      s2El.value = btn.dataset.s2;
      refreshQuickState();
      refreshPenaltiesState();
      updateLiveLine();
    };
  });
  stepBtns.forEach(btn=>{
    btn.onclick = ()=>{
      const targetId = btn.dataset.target;
      const delta = parseInt(btn.dataset.delta || '0');
      const target = targetId==='m-s1' ? s1El : s2El;
      const current = parseInt(target.value);
      const next = Math.max(0, (Number.isNaN(current)?0:current) + delta);
      target.value = String(next);
      refreshQuickState();
      refreshPenaltiesState();
      updateLiveLine();
    };
  });
  s1El.oninput = ()=>{ refreshQuickState(); refreshPenaltiesState(); updateLiveLine(); };
  s2El.oninput = ()=>{ refreshQuickState(); refreshPenaltiesState(); updateLiveLine(); };
  refreshQuickState();
  refreshPenaltiesState();
  updateLiveLine();

  box.querySelector('#m-submit').onclick=()=>{
    const byId = box.querySelector('#m-who').value;
    const s1 = parseInt(s1El.value);
    const s2 = parseInt(s2El.value);
    const pn1 = decisive? (pn1El.value===''? null: parseInt(pn1El.value)) : null;
    const pn2 = decisive? (pn2El.value===''? null: parseInt(pn2El.value)) : null;
    if(isNaN(s1)||isNaN(s2)){ box.querySelector('#m-err').textContent='Indica un marcador.'; return; }
    const err = reportResult(match, byId, s1, s2, pn1, pn2, decisive);
    if(err){ box.querySelector('#m-err').textContent=err; }
    else { pendingModal=null; render(); }
  };
  return box;
}

function renderPendingDecisionForm(match, decisive){
  const reporterId = match.reportedBy;
  const expectedDecider = reporterId===match.p1
    ? match.p2
    : (reporterId===match.p2 ? match.p1 : null);
  const autoDecider = (state.myPlayerId && state.myPlayerId===expectedDecider)
    ? state.myPlayerId
    : null;
  if(!autoDecider){
    return el(`<div class="banner warn">Este resultado lo debe confirmar <b>${playerName(expectedDecider)}</b>. Solo puedes confirmar con tu jugador activo.</div>`);
  }
  const scoreTxt = `${match.score1} - ${match.score2}` + (match.peno1!==null? ` (pen. ${match.peno1}-${match.peno2})` : '');

  const box = el(`<div>
    <div class="banner info">Resultado propuesto por <b>${playerName(reporterId)}</b>: <b>${scoreTxt}</b></div>
    <div class="muted" style="margin-bottom:8px;">Respondiendo como <b>${playerName(autoDecider)}</b>.</div>
    <input type="hidden" id="m-decider" value="${autoDecider}">

    <div class="row">
      <div><button id="m-accept" class="gold" type="button">Aceptar</button></div>
      <div><button id="m-reject" class="danger" type="button">Rechazar</button></div>
    </div>
    <div class="muted" style="margin-top:8px;">Si rechazas, quien reportó inicialmente deberá volver a cargar el resultado.</div>
  </div>`);

  box.querySelector('#m-accept').onclick=()=>{
    const byId = box.querySelector('#m-decider').value;
    const err = acceptReportedResult(match, byId, decisive);
    if(err){ box.querySelector('#m-derr').textContent = err; return; }
    pendingModal=null;

  box.querySelector('#m-reject').onclick=()=>{

    if(err){ box.querySelector('#m-derr').textContent = err; return; }
    pendingModal=null;
    render();
  };
  return box;

function renderKnockoutTab(){

    return wrap;
  }

  const nonQualified = getNonQualifiedIds();
  if(state.phase==='knockout' && nonQualified.length){

    card.appendChild(el(`<div class="muted" style="margin-bottom:8px;">Tope global de dinero por apuestas: <b>${fmtMoney(ceiling)}</b> · Apuesta máxima por ticket: <b>${Math.round(state.bets.maxStakePct*100)}%</b> de tu saldo actual.</div>`));

    wrap.appendChild(card);
  }
  if(state.phase==='knockout'){
    wrap.appendChild(renderBetActivityBoard('Panel de apuestas de eliminatorias'));
  }

  if(state.knockoutDraw && !state.knockoutDraw.complete){
    const d = el(`<div class="card"><h3>Sorteo de eliminatorias</h3><div class="muted" style="margin-bottom:8px;">Se revela un emparejamiento cada 10 segundos.</div><div id="draw-list" class="matchlist"></div></div>`);
    const list = d.querySelector('#draw-list');
    const total = state.knockoutDraw.pairings.length;
    for(let i=0;i<total;i++){
      if(i<state.knockoutDraw.revealed){
        const pair = state.knockoutDraw.pairings[i];
        list.appendChild(el(`<div class="match"><div class="vs"><span>${playerName(pair[0])}</span><span>vs</span><span>${playerName(pair[1])}</span></div><span class="tag confirmed">Revelado</span></div>`));
      } else {
        list.appendChild(el(`<div class="match"><div class="vs muted">Emparejamiento ${i+1}: bolas en el bombo...</div><span class="tag pending">Pendiente</span></div>`));
      }
    }
    if(!state.knockoutDraw.startedAt){
      const btn = el(`<button class="gold">Iniciar sorteo animado</button>`);
      btn.onclick=()=>{
        state.knockoutDraw.startedAt = Date.now();
        state.knockoutDraw.nextRevealAt = Date.now();
        processKnockoutDrawClock();
        saveAndRender();
      };
      d.appendChild(btn);
    } else {
      d.appendChild(el(`<div class="muted" style="margin-top:8px;">El siguiente cruce aparecerá automáticamente.</div>`));
    }
    wrap.appendChild(d);
  }

  if(state.champion){
    wrap.appendChild(el(`<div class="champion-box"><div class="trophy">🏆</div><h2>${playerName(state.champion)}</h2><div class="muted">Campeón de ${state.season}</div></div>`));
    const btn = el(`<button class="gold" style="margin-top:16px;">Empezar nueva temporada</button>`);
    btn.onclick=newSeason;
    wrap.appendChild(btn);
  }
  const roundNames = roundLabels(state.bracket.rounds.length);
  state.bracket.rounds.forEach((round,ri)=>{
    const rd = el(`<div class="bracket-round"><h4>${roundNames[ri]}</h4><div class="matchlist"></div></div>`);
    const list = rd.querySelector('.matchlist');
    round.forEach(m=>{
      if(!m.p1 && !m.p2){ list.appendChild(el(`<div class="match"><div class="vs muted">Por determinar</div></div>`)); return; }
      if(!m.p1 || !m.p2){ list.appendChild(el(`<div class="match"><div class="vs">${m.p1?playerName(m.p1):'?'} vs ${m.p2?playerName(m.p2):'?'} <span class="muted">(esperando rival)</span></div></div>`)); return; }
      list.appendChild(renderKnockoutTieRow(m));
    });
    wrap.appendChild(rd);
  });
  return wrap;
}
function roundLabels(total){
  const names=[];
  let size = state.bracket.size;
  for(let i=0;i<total;i++){
    if(size===2) names.push('Final');
    else if(size===4) names.push('Semifinales');
    else if(size===8) names.push('Cuartos de final');
    else if(size===16) names.push('Octavos de final');
    else names.push('Ronda de '+size);
    size = size/2;
  }
  return names;
}

function getGoalStatsByPlayerId(){
  const stats = {};
  state.players.forEach(p=> stats[p.id]={gf:0,gc:0,dg:0});

  state.leagueMatches.forEach(m=>{
    if(m.status!=='confirmed' || m.score1===null || m.score2===null) return;
    stats[m.p1] = stats[m.p1]||{gf:0,gc:0,dg:0};
    stats[m.p2] = stats[m.p2]||{gf:0,gc:0,dg:0};
    stats[m.p1].gf += m.score1; stats[m.p1].gc += m.score2;
    stats[m.p2].gf += m.score2; stats[m.p2].gc += m.score1;
  });

  state.playoffMatches.forEach(m=>{
    if(m.status!=='confirmed' || m.score1===null || m.score2===null) return;
    stats[m.p1] = stats[m.p1]||{gf:0,gc:0,dg:0};
    stats[m.p2] = stats[m.p2]||{gf:0,gc:0,dg:0};
    stats[m.p1].gf += m.score1; stats[m.p1].gc += m.score2;
    stats[m.p2].gf += m.score2; stats[m.p2].gc += m.score1;
  });

  if(state.bracket?.rounds){
    state.bracket.rounds.forEach(round=>{
      round.forEach(tie=>{
        if(tie.legs===2){
          const l1 = tie.leg1;
          const l2 = tie.leg2;
          if(l1 && l1.status==='confirmed' && l1.score1!==null && l1.score2!==null){
            stats[l1.p1] = stats[l1.p1]||{gf:0,gc:0,dg:0};
            stats[l1.p2] = stats[l1.p2]||{gf:0,gc:0,dg:0};
            stats[l1.p1].gf += l1.score1; stats[l1.p1].gc += l1.score2;
            stats[l1.p2].gf += l1.score2; stats[l1.p2].gc += l1.score1;
          }
          if(l2 && l2.status==='confirmed' && l2.score1!==null && l2.score2!==null){
            stats[l2.p1] = stats[l2.p1]||{gf:0,gc:0,dg:0};
            stats[l2.p2] = stats[l2.p2]||{gf:0,gc:0,dg:0};
            stats[l2.p1].gf += l2.score1; stats[l2.p1].gc += l2.score2;
            stats[l2.p2].gf += l2.score2; stats[l2.p2].gc += l2.score1;
          }
        } else if(tie.status==='confirmed' && tie.score1!==null && tie.score2!==null){
          stats[tie.p1] = stats[tie.p1]||{gf:0,gc:0,dg:0};
          stats[tie.p2] = stats[tie.p2]||{gf:0,gc:0,dg:0};
          stats[tie.p1].gf += tie.score1; stats[tie.p1].gc += tie.score2;
          stats[tie.p2].gf += tie.score2; stats[tie.p2].gc += tie.score1;
        }
      });
    });
  }

  Object.keys(stats).forEach(id=>{ stats[id].dg = stats[id].gf - stats[id].gc; });
  return stats;
}

function getMuseumRows(){
  const rowsByName = {};
  const goalStatsById = getGoalStatsByPlayerId();
  state.players.forEach(p=>{
    const totalMoney = state.finance?.lifetimeByPlayer?.[p.id] ?? p.money ?? 0;
    rowsByName[p.name] = {name:p.name, titles:0, seasons:[], money: totalMoney, goalDiff: goalStatsById[p.id]?.dg||0};
  });

  state.pastChampions.forEach(pc=>{
    if(!rowsByName[pc.champion]) rowsByName[pc.champion] = {name:pc.champion, titles:0, seasons:[], money:0, goalDiff:0};
    rowsByName[pc.champion].titles++;
    rowsByName[pc.champion].seasons.push(pc.season+' · '+seasonDateText(pc.kickoff));
  });

  if(state.phase==='finished' && state.champion){
    const currentChampion = playerName(state.champion);
    if(!rowsByName[currentChampion]) rowsByName[currentChampion] = {name:currentChampion, titles:0, seasons:[], money:0, goalDiff:0};
    const alreadyCounted = rowsByName[currentChampion].seasons.includes(state.season);
    if(!alreadyCounted){
      rowsByName[currentChampion].titles++;
      rowsByName[currentChampion].seasons.push(state.season+' (actual) · '+seasonDateText(state.seasonKickoff));
    }
  }

  return Object.values(rowsByName).sort((a,b)=>{
    if(b.titles!==a.titles) return b.titles-a.titles;
    if(b.money!==a.money) return b.money-a.money;
    if(b.goalDiff!==a.goalDiff) return b.goalDiff-a.goalDiff;
    return a.name.localeCompare(b.name,'es');
  });
}

/* ---- MUSEUM TAB ---- */
function renderMuseumTab(){
  const wrap = document.createElement('div');
  const rows = getMuseumRows();
  const totalTitles = rows.reduce((sum,r)=> sum+r.titles, 0);

  wrap.appendChild(el(`<div class="card"><h3>Museo de Jugadores</h3><div class="muted">Cada copa representa una temporada ganada. El museo se acumula con el paso de los años, como una vitrina histórica.</div></div>`));

  if(!rows.length){
    wrap.appendChild(el(`<div class="banner info">Aún no hay jugadores para mostrar en el museo.</div>`));
    return wrap;
  }

  wrap.appendChild(el(`<div class="banner gold">Copas totales registradas: <b>${totalTitles}</b></div>`));

  const grid = el(`<div class="museum-grid"></div>`);
  rows.forEach((r,idx)=>{
    const card = el(`<div class="museum-card">
      <div class="museum-head">
        <div class="museum-name">#${idx+1} · ${r.name}</div>
        <span class="museum-count">${r.titles} copa${r.titles===1?'':'s'}</span>
      </div>

      <div class="cup-shelf"></div>
      <div class="museum-seasons"></div>
    </div>`);
    const shelf = card.querySelector('.cup-shelf');
    const seasons = card.querySelector('.museum-seasons');

    if(r.titles===0){
      shelf.appendChild(el(`<span class="muted">Sin títulos todavía.</span>`));

      seasons.textContent = 'Temporadas ganadas: '+r.seasons.join(', ');

  wrap.appendChild(grid);

}

/* ---- HISTORY TAB ---- */
function renderHistoryTab(){
  const wrap = document.createElement('div');
  const seasonCard = el(`<div class="card"><h3>Temporada</h3><div class="muted" style="margin-bottom:10px;">Empieza una nueva temporada cuando ya haya campeón.</div></div>`);
  const canStartNewSeason = state.phase==='finished' && !!state.champion;
  const seasonBtn = el(`<button class="gold" ${canStartNewSeason?'':'disabled'}>Iniciar nueva temporada</button>`);
  seasonBtn.onclick=()=> newSeason();
  seasonCard.appendChild(seasonBtn);
  if(!canStartNewSeason){
    seasonCard.appendChild(el(`<div class="muted" style="margin-top:8px;">Este botón se habilita al finalizar la temporada actual.</div>`));
  }
  wrap.appendChild(seasonCard);

  const restartSeasonBtn = el(`<button class="secondary" style="margin-top:10px;">Volver a empezar esta temporada</button>`);
  restartSeasonBtn.onclick=()=>{
    pendingModal = ()=>{
      const bg = el(`<div class="modal-bg"><div class="modal">
        <span class="close">✕</span>
        <h3>Reiniciar temporada actual</h3>
        <div class="muted" style="margin-bottom:10px;">Se borrará todo de la temporada actual, incluyendo jugadores, partidos, cuadro, campeón y dinero.</div>
        <div class="muted" style="margin-bottom:10px;">Introduce la contraseña para reiniciar esta temporada.</div>
        <label>Contraseña</label>
        <input type="password" id="rs-p1" autocomplete="off">
        <div id="rs-err" class="muted" style="color:#ffb3ad;"></div>
        <button id="rs-go" class="danger">Reiniciar temporada actual</button>
      </div></div>`);
      bg.querySelector('.close').onclick=()=>{pendingModal=null; render();};
      bg.querySelector('#rs-go').onclick=()=>{
        const a = bg.querySelector('#rs-p1').value;
        if(!a){ bg.querySelector('#rs-err').textContent='Debes escribir la contraseña.'; return; }
        if(a!==RESTART_SEASON_PASSWORD){
          bg.querySelector('#rs-err').textContent='Contraseña incorrecta.';
          return;
        }
        pendingModal = null;
        restartCurrentSeason();
      };
      return bg;
    };
    render();
  };
  seasonCard.appendChild(restartSeasonBtn);

  const resetCard = el(`<div class="card"><h3>Reseteo maestro</h3><div class="banner warn">Pone todos los contadores a 0 (dinero, temporadas, cuadro, campeón actual) y borra el historial. Conserva solo la lista de jugadores.</div></div>`);
  const resetBtn = el(`<button class="danger">Reset maestro total</button>`);
  resetBtn.onclick=()=>{
    pendingModal = ()=>{
      const hasResetPassword = !!getMasterResetPassword();
      const bg = el(`<div class="modal-bg"><div class="modal">
        <span class="close">✕</span>
        <h3>Confirmar reseteo maestro</h3>
        <div class="muted" style="margin-bottom:10px;">${hasResetPassword ? 'Introduce la contraseña maestra dos veces para confirmar.' : 'No hay contraseña maestra configurada en este dispositivo. Define una ahora y se usará para este y próximos reseteos.'}</div>
        <label>Contraseña (1ª vez)</label>
        <input type="password" id="rm-p1" autocomplete="off">
        <label>Contraseña (2ª vez)</label>
        <input type="password" id="rm-p2" autocomplete="off">
        <div id="rm-err" class="muted" style="color:#ffb3ad;"></div>
        <button id="rm-go" class="danger">Ejecutar reset total</button>
      </div></div>`);
      bg.querySelector('.close').onclick=()=>{pendingModal=null; render();};
      bg.querySelector('#rm-go').onclick=()=>{
        const a = bg.querySelector('#rm-p1').value;
        const b = bg.querySelector('#rm-p2').value;
        if(!a || !b){ bg.querySelector('#rm-err').textContent='Debes escribir la contraseña en ambos campos.'; return; }
        if(a!==b){ bg.querySelector('#rm-err').textContent='Las dos contraseñas no coinciden.'; return; }
        if(!hasResetPassword){
          if(a.length < 8){ bg.querySelector('#rm-err').textContent='La contraseña debe tener al menos 8 caracteres.'; return; }
          setMasterResetPassword(a);
        } else if(a!==getMasterResetPassword()){
          bg.querySelector('#rm-err').textContent='Contraseña maestra incorrecta.';
          return;
        }
        pendingModal = null;
        masterResetAll();
      };
      return bg;
    };
    render();
  };
  resetCard.appendChild(resetBtn);
  wrap.appendChild(resetCard);

  if(state.pastChampions.length){
    const c = el(`<div class="card"><h3>Campeones anteriores</h3></div>`);
    state.pastChampions.forEach(pc=> c.appendChild(el(`<div class="audit"><b>${pc.champion}</b> — ${pc.season} <span style="opacity:.8">· ${seasonDateText(pc.kickoff)}</span> <span style="opacity:.55">(cerrada: ${pc.date})</span></div>`)));
    wrap.appendChild(c);
  }
  const card = el(`<div class="card"><h3>Registro de actividad</h3></div>`);
  if(!state.history.length) card.appendChild(el(`<div class="muted">Sin actividad todavía.</div>`));
  state.history.slice(0,200).forEach(h=> card.appendChild(el(`<div class="audit"><span style="opacity:.6">${h.ts}</span> · <b>${h.actor}</b> ${h.action}</div>`)));
  wrap.appendChild(card);
  return wrap;
}
