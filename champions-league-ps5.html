<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Champions PS5</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#0B1026;
  --surface:#161B3D;
  --surface-2:#1E2550;
  --line:#2B3268;
  --accent:#5B3DF5;
  --accent-2:#8B7BFF;
  --gold:#E8B339;
  --good:#3FA796;
  --bad:#E1574C;
  --text:#F4F2FF;
  --text-dim:#A6AAD6;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.disp{font-family:'Space Grotesk',sans-serif;}
.app{max-width:920px;margin:0 auto;padding:20px 16px 80px;}

.hero{
  display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap;
}
.hero .crest{
  width:46px;height:46px;flex:0 0 auto;
}
.hero h1{font-size:1.5rem;margin:0;letter-spacing:.3px;}
.hero .sub{color:var(--text-dim);font-size:.82rem;margin-top:2px;}
.brand-strip{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.brand-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  border:1px solid var(--line);
  border-radius:999px;
  padding:4px 10px;
  font-size:.72rem;
  font-weight:700;
  letter-spacing:.2px;
}
.brand-badge .icon{font-size:.85rem;}
.name-chip-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.name-chip{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--line);
  background:var(--surface-2);
  border-radius:999px;
  padding:5px 10px;
  font-size:.78rem;
}
.name-chip button{
  padding:2px 6px;
  font-size:.72rem;
  border-radius:999px;
  background:rgba(225,87,76,.2);
  color:#ffd4d0;
  border:1px solid rgba(225,87,76,.45);
}

.stepper{display:flex;gap:6px;margin:14px 0 22px;flex-wrap:wrap;}
.step{
  flex:1; min-width:70px; text-align:center; padding:7px 4px; border-radius:8px;
  font-size:.7rem; font-weight:600; color:var(--text-dim); background:var(--surface);
  border:1px solid var(--line); text-transform:uppercase; letter-spacing:.4px;
}
.step.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.step.done{background:var(--surface-2);color:var(--gold);border-color:var(--gold);}

.tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--line);overflow-x:auto;}
.tab{
  padding:10px 14px;font-size:.85rem;font-weight:600;color:var(--text-dim);
  cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;
}
.tab.active{color:var(--text);border-bottom-color:var(--gold);}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:18px;margin-bottom:16px;
}
.card h3{margin:0 0 12px;font-size:1.02rem;}
.muted{color:var(--text-dim);font-size:.82rem;}

label{display:block;font-size:.78rem;color:var(--text-dim);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;}
input,select{
  width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);
  padding:9px 10px;border-radius:8px;font-size:.92rem;margin-bottom:12px;font-family:inherit;
}
input[type=number]{width:90px;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
.row > div{flex:1;min-width:120px;}

button{
  background:var(--accent);color:#fff;border:none;padding:9px 16px;border-radius:8px;
  font-weight:700;font-size:.85rem;cursor:pointer;font-family:inherit;
}
button.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--line);}
button.gold{background:var(--gold);color:#1a1200;}
button.danger{background:var(--bad);}
button:disabled{opacity:.4;cursor:not-allowed;}
button.small{padding:5px 10px;font-size:.75rem;}
.bet-presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px;}
.bet-presets button{background:var(--surface-2);color:var(--text);border:1px solid var(--line);padding:6px 10px;}
.bet-presets button.active{background:var(--gold);color:#1a1200;border-color:var(--gold);}
.bet-arcade{
  background:
    radial-gradient(900px 180px at 0% 0%, rgba(63,167,150,.12), transparent 55%),
    radial-gradient(700px 160px at 100% 10%, rgba(232,179,57,.12), transparent 50%),
    var(--surface);
  border-color:#3b427d;
}
.bet-rail{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:10px;
}
.bet-ticket{
  background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(0,0,0,.08));
  border:1px solid #3a427f;
  border-radius:12px;
  padding:10px;
}
.bet-ticket-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;}
.bet-ticket-player{font-weight:700;font-size:.85rem;}
.bet-ticket .meta{font-size:.75rem;color:var(--text-dim);line-height:1.45;}
.bet-ticket.open{box-shadow:0 0 0 1px rgba(232,179,57,.2) inset;}
.bet-ticket.won{box-shadow:0 0 0 1px rgba(63,167,150,.26) inset;}
.bet-ticket.lost{box-shadow:0 0 0 1px rgba(225,87,76,.22) inset;}
.bet-ticket.void{opacity:.82;}

table{width:100%;border-collapse:collapse;font-size:.85rem;}
th,td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--line);}
th{color:var(--text-dim);font-size:.7rem;text-transform:uppercase;letter-spacing:.3px;}
td.name{text-align:left;font-weight:600;}
tr.qual td{background:rgba(232,179,57,.07);}
tr.tied td{outline:1px dashed var(--bad);outline-offset:-1px;}

.matchlist{display:flex;flex-direction:column;gap:8px;}
.match{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
}
.match .vs{flex:1;font-size:.9rem;font-weight:600;display:flex;justify-content:space-between;gap:8px;}
.tag{font-size:.65rem;font-weight:700;padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px;}
.tag.pending{background:rgba(232,179,57,.18);color:var(--gold);}
.tag.confirmed{background:rgba(63,167,150,.18);color:var(--good);}
.tag.dispute{background:rgba(225,87,76,.18);color:var(--bad);}
.tag.empty{background:rgba(166,170,214,.15);color:var(--text-dim);}

.bracket-round{margin-bottom:18px;}
.bracket-round h4{font-size:.78rem;color:var(--gold);text-transform:uppercase;letter-spacing:.5px;margin:0 0 8px;}

.player-chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:20px;padding:5px 10px 5px 6px;margin:3px;font-size:.82rem;
}
.player-chip .pin{color:var(--text-dim);font-size:.7rem;}

.players-panel-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.players-panel-head h3{margin:0;}
.player-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;}
.player-tile{
  background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(0,0,0,.08));
  border:1px solid var(--line);
  border-radius:12px;
  padding:11px 12px;
}
.player-tile.is-me{border-color:var(--gold);box-shadow:0 0 0 1px rgba(232,179,57,.25) inset;}
.player-tile-name{font-weight:700;font-size:.9rem;text-transform:capitalize;}
.player-tile-meta{margin-top:4px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.78rem;color:var(--text-dim);}
.player-tile-badge{font-size:.68rem;font-weight:700;color:#1a1200;background:var(--gold);border-radius:999px;padding:2px 7px;}
.player-tile-actions{display:flex;gap:6px;align-items:center;}

.add-player-panel{background:radial-gradient(800px 180px at 0% 0%,rgba(91,61,245,.14),transparent 60%),var(--surface);}
.catalog-wrap{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 6px;}
.catalog-chip{
  border:1px solid var(--line);
  background:var(--surface-2);
  color:var(--text);
  border-radius:999px;
  padding:6px 11px;
  font-size:.8rem;
  font-weight:700;
  text-transform:capitalize;
}
.catalog-chip.active{background:var(--gold);color:#1a1200;border-color:var(--gold);}
.add-player-actions{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;}
.add-player-actions input{margin-bottom:0;min-width:220px;flex:1;}

.banner{padding:12px 14px;border-radius:10px;font-size:.85rem;margin-bottom:14px;}
.banner.warn{background:rgba(225,87,76,.12);border:1px solid var(--bad);color:#ffd4d0;}
.banner.info{background:rgba(91,61,245,.14);border:1px solid var(--accent);color:#d9d4ff;}
.banner.gold{background:rgba(232,179,57,.12);border:1px solid var(--gold);color:#ffe8b0;}

.champion-box{
  text-align:center;padding:30px 14px;background:linear-gradient(180deg,rgba(232,179,57,.14),transparent);
  border:1px solid var(--gold);border-radius:16px;
}
.champion-box .trophy{font-size:2.4rem;}
.champion-box h2{color:var(--gold);font-size:1.6rem;margin:6px 0 2px;}

.audit{font-size:.78rem;color:var(--text-dim);border-bottom:1px solid var(--line);padding:7px 0;}
.audit b{color:var(--text);}

.museum-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
}
.museum-card{
  background:linear-gradient(180deg,rgba(232,179,57,.08),rgba(30,37,80,.65));
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
}
.museum-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:8px;
}
.museum-name{font-weight:700;font-size:.95rem;}
.museum-count{
  font-size:.74rem;
  font-weight:700;
  color:#1a1200;
  background:var(--gold);
  border-radius:999px;
  padding:3px 8px;
}
.cup-shelf{display:flex;flex-wrap:wrap;gap:6px;min-height:34px;align-items:flex-end;}
.ucl-cup{width:28px;height:34px;display:block;}
.museum-seasons{margin-top:8px;font-size:.74rem;color:var(--text-dim);line-height:1.4;}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:380px;width:100%;}
.modal h3{margin-top:0;}
.modal .close{float:right;cursor:pointer;color:var(--text-dim);font-size:1.1rem;}
.modal.result-modal{max-width:560px;}

.result-entry{display:flex;flex-direction:column;gap:12px;}
.result-scoreboard{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  gap:10px;
  align-items:end;
}
.result-team-box{
  background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(0,0,0,.08));
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
  min-width:0;
}
.result-team-name{font-weight:700;font-size:.88rem;text-transform:capitalize;margin-bottom:6px;overflow-wrap:anywhere;}
.result-vs{
  font-size:.72rem;
  font-weight:800;
  color:var(--gold);
  letter-spacing:.5px;
  padding-bottom:12px;
}
.result-goal-input{
  width:72px;
  margin-bottom:0;
  text-align:center;
  font-size:1rem;
  font-weight:800;
  padding:8px 6px;
}
.result-goal-controls{display:flex;justify-content:center;align-items:center;gap:8px;}
.result-step-btn{
  width:30px;
  height:30px;
  border-radius:10px;
  padding:0;
  font-size:.9rem;
  line-height:1;
  background:var(--surface-2);
  border:1px solid var(--line);
}
.result-quick{display:flex;flex-wrap:wrap;gap:7px;}
.result-quick button{background:var(--surface-2);border:1px solid var(--line);padding:6px 10px;font-size:.76rem;}
.result-quick button.active{background:var(--gold);color:#1a1200;border-color:var(--gold);}
.result-live{
  text-align:center;
  font-size:.88rem;
  font-weight:700;
  border:1px solid var(--line);
  border-radius:11px;
  padding:7px 9px;
  background:rgba(30,37,80,.5);
}
.result-live .sep{color:var(--gold);padding:0 6px;}
.result-penalties{
  border:1px dashed #4a5397;
  border-radius:11px;
  padding:10px;
  background:rgba(30,37,80,.4);
}

@media (max-width:640px){
  .result-scoreboard{grid-template-columns:1fr;}
  .result-vs{padding:0;text-align:center;}
}

.foot-note{font-size:.72rem;color:var(--text-dim);text-align:center;margin-top:30px;line-height:1.5;}

@media (max-width:640px){
  .hero{align-items:flex-start;}
  .hero h1{font-size:1.25rem;}
}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ---------------- STORAGE ---------------- */
const STATE_KEY = 'cl-ps5-tournament-state';
const SUPABASE_URL = 'https://ymuljjodvdkdlvbozqoz.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_r3PAKQSOk2h8DmVeGmSOIg_lKLi8v8F';
const SUPABASE_TABLE = 'tournament_state';
const SUPABASE_ROW_ID = 'shared';
const GAME_NAME = 'Champions League PS5';
const FUN_DATE_LABEL = 'Dia del Bombazo';
const PRESET_PLAYER_NAMES = ['renzo','johan','giank','felipe','jordi','ithan','miguel'];
const PLAYER_CATALOG_KEY = 'cl-ps5-player-catalog-custom';
const MASTER_RESET_PASSWORD_KEY = 'cl-ps5-master-reset-password';
const RESTART_SEASON_PASSWORD = '01234';
let state = null;
let currentTab = 'config';
let pendingModal = null;
let remoteEtag = null;
let pullTimer = null;
let pushTimer = null;
let pushInFlight = false;
let pushQueued = false;

function uid(){ return Math.random().toString(36).slice(2,10); }
function nowStr(){ const d=new Date(); return d.toLocaleDateString('es-ES')+' '+d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}); }
function dayStr(){ return new Date().toLocaleDateString('es-ES'); }
function seasonDateText(dateValue){ return dateValue ? `${FUN_DATE_LABEL}: ${dateValue}` : `${FUN_DATE_LABEL}: —`; }
function normalizePlayerName(name){ return (name||'').trim().toLocaleLowerCase('es-ES'); }
function basePlayerName(name){
  const n = normalizePlayerName(name);
  if(!n) return '';
  return n.split(/\s*-\s*/)[0].trim();
}
function cannotFaceEachOther(idA, idB){
  if(!idA || !idB || idA===idB) return false;
  const a = findPlayer(idA);
  const b = findPlayer(idB);
  if(!a || !b) return false;
  const ka = basePlayerName(a.name);
  const kb = basePlayerName(b.name);
  return !!ka && ka===kb;
}
function wait(ms){ return new Promise(resolve=> setTimeout(resolve, ms)); }
function isEditingField(){
  const ae = document.activeElement;
  if(!ae) return false;
  const tag = ae.tagName;
  if(tag==='TEXTAREA' || ae.isContentEditable) return true;
  if(tag==='INPUT'){
    const input = ae;
    if(input.readOnly || input.disabled) return false;
    const type = (input.type || '').toLowerCase();
    return !['button','submit','reset','checkbox','radio','range','color','file'].includes(type);
  }
  // No bloqueamos el pull remoto por tener un select enfocado.
  return false;
}
function shouldPauseSync(){
  // En liguilla priorizamos actualización en vivo de la clasificación.
  if(currentTab==='league') return false;
  return !!pendingModal || isEditingField();
}
function getMasterResetPassword(){
  try{ return localStorage.getItem(MASTER_RESET_PASSWORD_KEY) || ''; }
  catch(_err){ return ''; }
}
function setMasterResetPassword(value){
  try{ localStorage.setItem(MASTER_RESET_PASSWORD_KEY, value); }
  catch(_err){}
}
function getStoredCustomPlayerNames(){
  try{
    const raw = localStorage.getItem(PLAYER_CATALOG_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    if(!Array.isArray(parsed)) return [];
    return parsed
      .map(n=> normalizePlayerName(n))
      .filter(Boolean)
      .filter((n, i, arr)=> arr.indexOf(n)===i)
      .filter(n=> !PRESET_PLAYER_NAMES.includes(n));
  }catch(_err){
    return [];
  }
}
function setStoredCustomPlayerNames(names){
  try{ localStorage.setItem(PLAYER_CATALOG_KEY, JSON.stringify(names)); }
  catch(_err){}
}
function getPlayerNameCatalog(){
  return [...PRESET_PLAYER_NAMES, ...getStoredCustomPlayerNames()];
}
function addNameToCatalog(name){
  const clean = normalizePlayerName(name);
  if(!clean || PRESET_PLAYER_NAMES.includes(clean)) return;
  const custom = getStoredCustomPlayerNames();
  if(custom.includes(clean)) return;
  custom.push(clean);
  custom.sort((a,b)=> a.localeCompare(b, 'es-ES'));
  setStoredCustomPlayerNames(custom);
}
function removeNameFromCatalog(name){
  const clean = normalizePlayerName(name);
  if(!clean || PRESET_PLAYER_NAMES.includes(clean)) return false;
  const custom = getStoredCustomPlayerNames();
  const next = custom.filter(n=> n!==clean);
  if(next.length===custom.length) return false;
  setStoredCustomPlayerNames(next);
  return true;
}

function supabaseHeaders(extra = {}){
  return {
    'content-type':'application/json',
    'apikey': SUPABASE_ANON_KEY,
    'authorization': 'Bearer '+SUPABASE_ANON_KEY,
    ...extra
  };
}

async function safeJson(res){
  try{ return await res.json(); }
  catch(_err){ return null; }
}

function supabaseApi(path){
  return SUPABASE_URL.replace(/\/+$/,'') + '/rest/v1/' + path;
}

function stateForRemote(s){
  const clone = JSON.parse(JSON.stringify(s || {}));
  delete clone.myPlayerId;
  return clone;
}

function preserveLocalMyPlayer(prevState, nextState){
  const localId = prevState?.myPlayerId || null;
  if(!localId) return nextState;
  if(Array.isArray(nextState?.players) && nextState.players.some(p=> p.id===localId)){
    nextState.myPlayerId = localId;
  }
  return nextState;
}

function bindLocalPlayerId(playerId){
  if(!playerId) return;
  if(!state || !Array.isArray(state.players)) return;
  if(!state.players.some(p=> p.id===playerId)) return;
  // Tras iniciar liguilla, nunca se puede reasignar identidad en este dispositivo.
  if(state.phase!=='setup') return;
  state.myPlayerId = playerId;
  try{ localStorage.setItem(STATE_KEY, JSON.stringify(state)); }
  catch(_err){}
}

async function readRemoteSnapshot(){
  const url = supabaseApi(`${SUPABASE_TABLE}?id=eq.${encodeURIComponent(SUPABASE_ROW_ID)}&select=id,state,version,updated_at&limit=1`);
  try{
    const res = await fetch(url, { method:'GET', headers:supabaseHeaders(), cache:'no-store' });
    if(!res.ok){
      const body = await safeJson(res);
      return { ok:false, status:res.status, error: body?.message || body?.error || `Error remoto (${res.status})` };
    }
    const rows = await safeJson(res) || [];
    if(!rows.length) return { ok:true, state:null, etag:null };
    const row = rows[0];
    return { ok:true, state:row.state || null, etag:typeof row.version==='number' ? row.version : null };
  }catch(_err){
    return { ok:false, status:0, error:'Sin conexión a Supabase' };
  }
}

async function writeRemoteSnapshot(nextState, expectedVersion){
  const nowIso = new Date().toISOString();

  if(typeof expectedVersion !== 'number'){
    const insertUrl = supabaseApi(SUPABASE_TABLE);
    try{
      const res = await fetch(insertUrl, {
        method:'POST',
        headers:supabaseHeaders({ Prefer:'return=representation' }),
        body: JSON.stringify({ id:SUPABASE_ROW_ID, state:nextState, version:1, updated_at:nowIso })
      });
      if(res.ok){
        const rows = await safeJson(res) || [];
        return { ok:true, etag: rows[0]?.version ?? 1 };
      }
      if(res.status===409){
        const current = await readRemoteSnapshot();
        return { ok:false, status:409, state:current.state || null, etag:current.etag || null };
      }
      const body = await safeJson(res);
      return { ok:false, status:res.status, error: body?.message || body?.error || `Error remoto (${res.status})` };
    }catch(_err){
      return { ok:false, status:0, error:'Sin conexión a Supabase' };
    }
  }

  const patchUrl = supabaseApi(`${SUPABASE_TABLE}?id=eq.${encodeURIComponent(SUPABASE_ROW_ID)}&version=eq.${expectedVersion}`);
  try{
    const res = await fetch(patchUrl, {
      method:'PATCH',
      headers:supabaseHeaders({ Prefer:'return=representation' }),
      body: JSON.stringify({ state:nextState, version:expectedVersion+1, updated_at:nowIso })
    });
    if(res.ok){
      const rows = await safeJson(res) || [];
      if(rows.length) return { ok:true, etag:rows[0].version };
      const current = await readRemoteSnapshot();
      return { ok:false, status:409, state:current.state || null, etag:current.etag || null };
    }
    const body = await safeJson(res);
    return { ok:false, status:res.status, error: body?.message || body?.error || `Error remoto (${res.status})` };
  }catch(_err){
    return { ok:false, status:0, error:'Sin conexión a Supabase' };
  }
}

function defaultState(){
  return {
    season: GAME_NAME+' - T1',
    seasonKickoff: null,
    phase: 'setup', // setup -> league -> playoff -> knockout -> finished
    config: { matchesPerPlayer: 0, numQualifiers: 0 },
    players: [],
    leagueMatches: [],
    qualifiers: null,
    tieResolution: {}, // playerId -> random tiebreak salt once resolved

function loadState(){
  try{
    const stored = localStorage.getItem(STATE_KEY);
    state = stored ? JSON.parse(stored) : defaultState();
  }catch(e){
    state = defaultState();
  }
  if(!state.finance) state.finance = defaultState().finance;
  if(!state.config || typeof state.config!=='object') state.config = {...defaultState().config};
  if(!state.bets) state.bets = defaultState().bets;
  if(typeof state.bets.maxStakePct!=='number') state.bets.maxStakePct = 0.3;
  if(typeof state.bets.championMoneyCap!=='number' || state.bets.championMoneyCap<=0) state.bets.championMoneyCap = state.finance.prizes.champion;
  if(!Array.isArray(state.bets.tickets)) state.bets.tickets = [];
  if(!state.finance.lifetimeByPlayer) state.finance.lifetimeByPlayer = {};
  if(!state.sync) state.sync = defaultState().sync;
  if(!state.seasonKickoff) state.seasonKickoff = null;
  if(!state.season || state.season==='Champions PS5') state.season = GAME_NAME+' - T1';
  state.players.forEach(p=>{
    p.name = normalizePlayerName(p.name);
    if(typeof p.money!=='number') p.money=0;
    if(typeof state.finance.lifetimeByPlayer[p.id] !== 'number'){
      // Migracion: si no habia acumulado historico, tomamos el saldo actual.
      state.finance.lifetimeByPlayer[p.id] = p.money;
    }
  });
  if(Array.isArray(state.pastChampions)){
    state.pastChampions = state.pastChampions.map(pc=> ({
      ...pc,
      kickoff: pc.kickoff || null
    }));
  }
  render();
  pullRemoteState();
  if(pullTimer) clearInterval(pullTimer);
  pullTimer = setInterval(()=>{
    if(shouldPauseSync()) return;
    pullRemoteState();
    processKnockoutDrawClock();
  }, 1200);
}
function saveState(){
  try{ localStorage.setItem(STATE_KEY, JSON.stringify(state)); }
  catch(e){ console.error('No se pudo guardar', e); }
  queueRemotePush();
}
function log(actor, action){
  state.history.unshift({ts: nowStr(), actor, action});
}

async function pullRemoteState(opts = {}){
  const touchOnNoChange = !!opts.touchOnNoChange;
  if(shouldPauseSync()) return;
  const prevLocal = state;
  const remote = await readRemoteSnapshot();
  if(!remote.ok){
    if(state?.sync){
      const prevMode = state.sync.mode;
      const prevError = state.sync.lastError;
      state.sync.mode = 'local';
      state.sync.lastError = remote.error || 'Sin conexión remota';
      if(prevMode!==state.sync.mode || prevError!==state.sync.lastError) render();
    }
    return;
  }
  if(!remote.state){
    if(state?.sync && touchOnNoChange){
      state.sync.mode = 'remoto';
      state.sync.lastRemoteAt = nowStr();
      state.sync.lastError = 'Sin estado remoto todavía.';
      render();
    }
    return;
  }
  if(remoteEtag===null || remoteEtag!==remote.etag){
    state = migrateStateShape(remote.state);
    state = preserveLocalMyPlayer(prevLocal, state);
    remoteEtag = remote.etag;
    if(!state.sync) state.sync = defaultState().sync;
    state.sync.mode = 'remoto';
    state.sync.lastRemoteAt = nowStr();
    state.sync.lastError = null;
    localStorage.setItem(STATE_KEY, JSON.stringify(state));
    render();
  } else if(touchOnNoChange){
    if(!state.sync) state.sync = defaultState().sync;
    state.sync.mode = 'remoto';
    state.sync.lastRemoteAt = nowStr();
    state.sync.lastError = 'Sin cambios (ya estabas al día).';
    localStorage.setItem(STATE_KEY, JSON.stringify(state));
    render();
  }
}

function queueRemotePush(){
  if(pushTimer) clearTimeout(pushTimer);
  pushTimer = setTimeout(()=> pushRemoteState(), 300);
}

async function pushRemoteState(){
  if(pushInFlight){
    pushQueued = true;
    return;
  }
  pushInFlight = true;
  try{
    const remote = await writeRemoteSnapshot(stateForRemote(state), remoteEtag);
    if(remote.status===409){
      if(remote?.state){
        const prevLocal = state;
        state = migrateStateShape(remote.state);
        state = preserveLocalMyPlayer(prevLocal, state);
        remoteEtag = remote.etag ?? null;
        state.sync.mode = 'remoto';
        state.sync.lastRemoteAt = nowStr();
        state.sync.lastError = 'Se detecto cambio remoto. Se refresco el estado.';
        localStorage.setItem(STATE_KEY, JSON.stringify(state));
        render();
      }
      return;
    }
    if(!remote.ok) throw new Error(remote.error || 'No se pudo guardar remoto');
    remoteEtag = typeof remote.etag==='number' ? remote.etag : remoteEtag;
    state.sync.mode = 'remoto';
    state.sync.lastRemoteAt = nowStr();
    state.sync.lastError = null;
    localStorage.setItem(STATE_KEY, JSON.stringify(state));
  }catch(err){
    if(state?.sync){
      state.sync.mode = 'local';
      state.sync.lastError = 'Guardando solo en local';
    }
  }finally{
    pushInFlight = false;
    if(pushQueued){
      pushQueued = false;
      pushRemoteState();
    }
  }
}

function migrateStateShape(s){
  if(!s || typeof s!=='object') s = {};
  const base = defaultState();
  if(!s.season || typeof s.season!=='string') s.season = base.season;
  if(!s.phase || typeof s.phase!=='string') s.phase = base.phase;
  if(!s.config || typeof s.config!=='object') s.config = {...base.config};
  if(typeof s.config.matchesPerPlayer!=='number') s.config.matchesPerPlayer = base.config.matchesPerPlayer;
  if(typeof s.config.numQualifiers!=='number') s.config.numQualifiers = base.config.numQualifiers;
  if(!Array.isArray(s.players)) s.players = [];
  if(!Array.isArray(s.leagueMatches)) s.leagueMatches = [];
  if(!Array.isArray(s.playoffMatches)) s.playoffMatches = [];
  if(!Array.isArray(s.pastChampions)) s.pastChampions = [];
  if(!Array.isArray(s.history)) s.history = [];
  if(!s.tieResolution || typeof s.tieResolution!=='object') s.tieResolution = {};
  if(!s.bets || typeof s.bets!=='object') s.bets = {...base.bets};
  if(!Array.isArray(s.bets.tickets)) s.bets.tickets = [];
  if(typeof s.bets.maxStakePct!=='number') s.bets.maxStakePct = base.bets.maxStakePct;
  if(typeof s.bets.championMoneyCap!=='number' || s.bets.championMoneyCap<=0) s.bets.championMoneyCap = base.bets.championMoneyCap;
  if(!s.finance) s.finance = defaultState().finance;
  if(!s.finance.lifetimeByPlayer) s.finance.lifetimeByPlayer = {};
  if(!s.sync) s.sync = defaultState().sync;
  if(!s.seasonKickoff) s.seasonKickoff = null;
  if(typeof s.myPlayerId==='undefined') s.myPlayerId = null;
  if(typeof s.champion==='undefined') s.champion = null;
  if(typeof s.qualifiers==='undefined') s.qualifiers = null;
  if(typeof s.leagueTieBreaker==='undefined') s.leagueTieBreaker = null;
  if(typeof s.knockoutDraw==='undefined') s.knockoutDraw = null;
  if(typeof s.bracket==='undefined') s.bracket = null;
  s.players.forEach(p=>{
    if(!p.id) p.id = uid();
    p.name = normalizePlayerName(p.name);
    if(typeof p.money!=='number') p.money = 0;
    if(typeof s.finance.lifetimeByPlayer[p.id] !== 'number') s.finance.lifetimeByPlayer[p.id] = p.money;
  });
  return s;
}

async function addPlayerShared(name){
  const clean = normalizePlayerName(name);
  if(!clean) return 'Nombre inválido.';
  let hadReadIssue = false;

  for(let attempt=0; attempt<10; attempt++){
    let remoteState = null;
    let etag = null;
    const snapshot = await readRemoteSnapshot();
    if(!snapshot.ok){
      hadReadIssue = true;
      state.sync.mode = 'local';
      state.sync.lastError = 'Sin conexión remota. Intentando guardar igualmente...';
      remoteState = JSON.parse(JSON.stringify(state || defaultState()));
      etag = remoteEtag || null;
    } else {
      remoteState = snapshot.state || null;
      etag = snapshot.etag ?? null;
    }

    const nextState = migrateStateShape(remoteState ? JSON.parse(JSON.stringify(remoteState)) : defaultState());
    const exists = nextState.players.some(p=> normalizePlayerName(p.name)===normalizePlayerName(clean));
    if(exists) return 'Ese jugador ya existe. No se permiten nombres duplicados.';

    const id = uid();
    nextState.players.push({id, name:clean, money:0});
    nextState.finance.lifetimeByPlayer[id] = 0;
    nextState.history = nextState.history || [];
    nextState.history.unshift({ts: nowStr(), actor:'Organizador', action:'añadió a '+clean+' al torneo.'});

    const saved = await writeRemoteSnapshot(stateForRemote(nextState), etag);
    if(saved.status===409){
      await wait(80 + Math.floor(Math.random()*120));
      continue;
    }
    if(!saved.ok){
      state = migrateStateShape(nextState);
      state.myPlayerId = id;
      state.sync.mode = 'local';
      state.sync.lastError = 'Guardado local temporal. Se sincronizará cuando vuelva la conexión remota.';
      localStorage.setItem(STATE_KEY, JSON.stringify(state));
      queueRemotePush();
      render();
      return null;
    }

    state = migrateStateShape(nextState);
  state.myPlayerId = id;
    remoteEtag = typeof saved.etag==='number' ? saved.etag : etag;
    state.sync.mode = 'remoto';
    state.sync.lastRemoteAt = nowStr();
    state.sync.lastError = null;
    localStorage.setItem(STATE_KEY, JSON.stringify(state));
    render();
    pullRemoteState();
    return null;
  }
  if(hadReadIssue) return 'Sin conexión estable al servidor compartido. Se guardó local y se intentará sincronizar solo.';
  return 'Hubo muchos cambios simultáneos en otros dispositivos. Vuelve a intentarlo.';
}

async function removePlayerShared(playerId){
  if(!playerId) return 'Jugador inválido.';
  let hadReadIssue = false;

  for(let attempt=0; attempt<10; attempt++){
    let remoteState = null;
    let etag = null;
    const snapshot = await readRemoteSnapshot();
    if(!snapshot.ok){
      hadReadIssue = true;
      state.sync.mode = 'local';
      state.sync.lastError = 'Sin conexión remota. Intentando guardar igualmente...';
      remoteState = JSON.parse(JSON.stringify(state || defaultState()));
      etag = remoteEtag || null;
    } else {
      remoteState = snapshot.state || null;
      etag = snapshot.etag ?? null;
    }

    const nextState = migrateStateShape(remoteState ? JSON.parse(JSON.stringify(remoteState)) : defaultState());
    if(nextState.phase!=='setup') return 'Solo puedes borrar jugadores antes de iniciar la liguilla.';

    const idx = nextState.players.findIndex(p=> p.id===playerId);
    if(idx<0) return 'Ese jugador ya no existe.';
    const removed = nextState.players[idx];

    nextState.players.splice(idx, 1);
    if(nextState.finance?.lifetimeByPlayer) delete nextState.finance.lifetimeByPlayer[playerId];
    if(nextState.myPlayerId===playerId) nextState.myPlayerId = null;
    if(nextState.tieResolution && typeof nextState.tieResolution==='object') delete nextState.tieResolution[playerId];
    if(nextState.bets?.tickets) nextState.bets.tickets = nextState.bets.tickets.filter(t=> t.playerId!==playerId);
    nextState.history = nextState.history || [];
    nextState.history.unshift({ts: nowStr(), actor:'Organizador', action:'eliminó a '+(removed?.name || 'jugador')+' de la plantilla.'});

    const saved = await writeRemoteSnapshot(stateForRemote(nextState), etag);
    if(saved.status===409){
      await wait(80 + Math.floor(Math.random()*120));
      continue;
    }
    if(!saved.ok){
      state = migrateStateShape(nextState);
      state.sync.mode = 'local';
      state.sync.lastError = 'Guardado local temporal. Se sincronizará cuando vuelva la conexión remota.';
      localStorage.setItem(STATE_KEY, JSON.stringify(state));
      queueRemotePush();
      render();
      return null;
    }

    state = migrateStateShape(nextState);
    remoteEtag = typeof saved.etag==='number' ? saved.etag : etag;
    state.sync.mode = 'remoto';
    state.sync.lastRemoteAt = nowStr();
    state.sync.lastError = null;
    localStorage.setItem(STATE_KEY, JSON.stringify(state));
    render();
    pullRemoteState();
    return null;
  }

  if(hadReadIssue) return 'Sin conexión estable al servidor compartido. Se guardó local y se intentará sincronizar solo.';
  return 'Hubo muchos cambios simultáneos en otros dispositivos. Vuelve a intentarlo.';
}

/* ---------------- ROUND ROBIN ---------------- */
function generateRoundRobinRounds(ids, numRounds){
  let arr = [...ids];
  if(arr.length % 2 !== 0) arr.push(null);
  const n = arr.length;
  const totalRounds = n-1;
  const half = n/2;
  let rounds = [];
  let cur = [...arr];
  for(let r=0;r<totalRounds;r++){
    let pairs=[];
    for(let i=0;i<half;i++){
      const a=cur[i], b=cur[n-1-i];
      if(a!==null && b!==null) pairs.push([a,b]);
    }
    rounds.push(pairs);
    const fixed=cur[0]; const rest=cur.slice(1);
    rest.unshift(rest.pop());
    cur=[fixed,...rest];
  }
  return rounds.slice(0, Math.min(numRounds, totalRounds));
}

/* ---------------- STANDINGS ---------------- */
function computeStandings(){
  const countsForStandings = (m)=>{
    if(!m || (m.status!=='confirmed' && m.status!=='pending')) return false;
    const s1 = Number(m.score1);
    const s2 = Number(m.score2);
    return Number.isFinite(s1) && Number.isFinite(s2) && s1>=0 && s2>=0;
  };
  const table = {};
  state.players.forEach((p, idx)=>{
    const pid = p?.id || `player-${idx}`;
    const pname = (p?.name || '').trim() || `Jugador ${idx+1}`;
    table[pid] = {id:pid, name:pname, pj:0,g:0,e:0,p:0,gf:0,gc:0,dg:0,pts:0};
  });
  state.leagueMatches.forEach(m=>{
    if(!countsForStandings(m)) return;
    const s1 = Number(m.score1);
    const s2 = Number(m.score2);
    const t1=table[m.p1], t2=table[m.p2];
    if(!t1 || !t2) return;
    t1.pj++; t2.pj++;
    t1.gf+=s1; t1.gc+=s2;
    t2.gf+=s2; t2.gc+=s1;
    if(s1>s2){ t1.g++; t1.pts+=3; t2.p++; }
    else if(s2>s1){ t2.g++; t2.pts+=3; t1.p++; }
    else { t1.e++; t2.e++; t1.pts++; t2.pts++; }
  });
  let arr = Object.values(table);
  arr.forEach(t=> t.dg = t.gf - t.gc);

  function headToHead(aId,bId){
    const direct = state.leagueMatches.filter(x=>
      countsForStandings(x) && ((x.p1===aId&&x.p2===bId)||(x.p1===bId&&x.p2===aId))
    );
    if(!direct.length) return 0;
    let diff = 0;
    direct.forEach(m=>{
      const aScore = Number(m.p1===aId ? m.score1 : m.score2);
      const bScore = Number(m.p1===aId ? m.score2 : m.score1);
      diff += (bScore - aScore);
    });
    return diff; // negative => a better
  }
  arr.sort((a,b)=>{
    if(b.pts!==a.pts) return b.pts-a.pts;
    if(b.dg!==a.dg) return b.dg-a.dg;
    if(b.gf!==a.gf) return b.gf-a.gf;
    const h2h = headToHead(a.id,b.id);
    if(h2h!==0) return h2h;
    const sa = state.tieResolution[a.id], sb = state.tieResolution[b.id];
    if(sa!==undefined && sb!==undefined) return sa-sb;
    return a.name.localeCompare(b.name, 'es-ES');
  });
  return arr;
}

function tiedGroupsAtCutoff(standings, cutoff){
  // returns array of player ids involved in an unresolved tie straddling the cutoff line
  if(cutoff<=0 || cutoff>=standings.length) return [];
  const a = standings[cutoff-1], b = standings[cutoff];
  const sameKey = x => x.pts+'|'+x.dg+'|'+x.gf;
  if(sameKey(a)!==sameKey(b)) return [];
  // gather full block sharing that key
  const key = sameKey(a);
  const block = standings.filter(x=> sameKey(x)===key);
  const allResolved = block.every(x=> state.tieResolution[x.id]!==undefined);
  if(allResolved) return [];
  return block.map(x=>x.id);
}

function shuffle(arr){ return [...arr].sort(()=>Math.random()-0.5); }
function buildAllowedPairings(ids){
  if(ids.length%2!==0) return null;
  function backtrack(remaining){
    if(!remaining.length) return [];
    const [first, ...rest] = remaining;
    const candidates = shuffle(rest);
    for(const candidate of candidates){
      if(cannotFaceEachOther(first, candidate)) continue;
      const next = remaining.filter(x=> x!==first && x!==candidate);
      const tail = backtrack(next);
      if(tail) return [[first, candidate], ...tail];
    }
    return null;
  }
  return backtrack(shuffle(ids));
}
function sameIdSet(a,b){
  if(!a || !b || a.length!==b.length) return false;
  const sa = [...a].sort().join('|');
  const sb = [...b].sort().join('|');
  return sa===sb;
}
function isThreePlayersThreeDrawsInvalid(tiedIds){
  if(state.players.length!==3 || tiedIds.length!==3) return false;
  const confirmed = state.leagueMatches.filter(m=> m.status==='confirmed');
  if(confirmed.length===0) return false;
  const draws = confirmed.filter(m=> m.score1===m.score2).length;
  return draws===confirmed.length;
}
function buildTieBreakRound(activeIds){
  const shuffledIds = shuffle(activeIds);
  const attempts = [];
  if(shuffledIds.length%2===1){
    shuffledIds.forEach(id=> attempts.push(id));
  } else {
    attempts.push(null);
  }

  for(const byeCandidate of attempts){
    const pool = byeCandidate ? shuffledIds.filter(id=> id!==byeCandidate) : [...shuffledIds];
    const pairs = buildAllowedPairings(pool);
    if(!pairs) continue;
    return {
      pairings: pairs.map(([p1,p2])=> ({id:uid(), p1, p2, pen1:null, pen2:null, winner:null, loser:null})),
      bye: byeCandidate,
      error: null
    };
  }
  return {pairings:[], bye:null, error:'No se pudieron generar cruces de desempate sin enfrentar jugadores del mismo nombre base.'};
}
function startLeagueTieBreaker(ids){
  const first = buildTieBreakRound(ids);
  if(first.error) return first.error;
  state.leagueTieBreaker = {
    ids:[...ids],
    round:1,
    pairings:first.pairings,
    bye:first.bye,
    eliminated:[]
  };
  log('Organizador', 'inició desempate por penaltis con cruces aleatorios entre: '+ids.map(playerName).join(', '));
  saveAndRender();
  return null;
}
function finalizeLeagueTieBreaker(winnerId){
  const tb = state.leagueTieBreaker;
  if(!tb) return;
  const ranking = [winnerId, ...tb.eliminated.slice().reverse()];
  tb.ids.forEach(id=>{ if(!ranking.includes(id)) ranking.push(id); });
  ranking.forEach((id,i)=> state.tieResolution[id]=i);
  log('Organizador', 'desempate por penaltis finalizado. Orden: '+ranking.map(playerName).join(' > '));
  state.leagueTieBreaker = null;
  saveAndRender();
}
function submitLeagueTiePenalty(pairingId, pen1, pen2){
  const tb = state.leagueTieBreaker;
  if(!tb) return 'No hay desempate activo.';
  const pair = tb.pairings.find(p=> p.id===pairingId);
  if(!pair) return 'Cruce no encontrado.';
  if(Number.isNaN(pen1)||Number.isNaN(pen2)||pen1<0||pen2<0) return 'Indica penaltis válidos.';
  if(pen1===pen2) return 'La tanda no puede terminar empatada.';

  pair.pen1 = pen1;
  pair.pen2 = pen2;
  pair.winner = pen1>pen2 ? pair.p1 : pair.p2;
  pair.loser = pair.winner===pair.p1 ? pair.p2 : pair.p1;

  const pending = tb.pairings.some(p=> !p.winner);
  if(pending){
    saveAndRender();
    return null;
  }

  tb.eliminated.push(...tb.pairings.map(p=> p.loser));
  const survivors = tb.pairings.map(p=> p.winner);
  if(tb.bye) survivors.push(tb.bye);

  if(survivors.length===1){
    finalizeLeagueTieBreaker(survivors[0]);
    return null;
  }

  const next = buildTieBreakRound(survivors);
  if(next.error) return next.error;
  tb.round += 1;
  tb.pairings = next.pairings;
  tb.bye = next.bye;
  saveAndRender();
  return null;
}
function restartInvalidLeagueSeason(){
  state.phase='setup';
  state.leagueMatches=[];
  state.playoffMatches=[];
  state.bracket=null;
  state.knockoutDraw=null;
  state.champion=null;
  state.qualifiers=null;
  state.tieResolution={};
  state.leagueTieBreaker=null;
  state.seasonKickoff=null;
  log('Sistema','temporada inválida: 3 jugadores con todos los partidos empatados. Se reinicia la temporada.');
  saveAndRender();
}

/* ---------------- BRACKET HELPERS ---------------- */
function autoMatchesPerPlayer(n){
  // En esta app, la liguilla es todos contra todos a ida y vuelta.
  return Math.max(1, 2*(n-1));
}
function autoQualifiers(n){
  // Proporción tipo Champions: pasan ~2/3, pero con 3+ jugadores nunca pasan todos.
  if(n<=2) return Math.min(n,2);
  let q = Math.floor(n*24/36);
  q = Math.max(2, q);
  q = Math.min(n-1, q);
  return q;
}
function effectiveNumQualifiers(){
  const n = state.players.length;
  if(n<=0) return 0;
  if(n===1) return 1;
  if(n===2) return 2; // Con 2 jugadores tambien hay liguilla y ambos pasan a eliminatoria.

  const auto = autoQualifiers(n);
  const raw = Number.isFinite(state?.config?.numQualifiers) ? Math.floor(state.config.numQualifiers) : auto;
  let q = raw>0 ? raw : auto;
  q = Math.max(2, q);
  q = Math.min(n-1, q);
  return q;
}
function nearestPow2LE(x){ let p=1; while(p*2<=x) p*=2; return p; }
function firstKnockoutBonusBySize(size){
  if(size>=16) return {amount: state.finance.prizes.round16, key:'round16', label:'clasificarse a octavos'};
  if(size===8) return {amount: state.finance.prizes.quarter, key:'quarter', label:'clasificarse a cuartos'};
  if(size===4) return {amount: state.finance.prizes.semi, key:'semi', label:'clasificarse a semifinales'};
  return null;
}
function nextRoundBonusBySize(size){
  if(size===16) return {amount: state.finance.prizes.quarter, key:'quarter', label:'clasificarse a cuartos'};
  if(size===8) return {amount: state.finance.prizes.semi, key:'semi', label:'clasificarse a semifinales'};
  if(size===4) return {amount: state.finance.prizes.runnerUp, key:'runnerup', label:'clasificarse a la final'};
  return null;
}
function buildKnockoutSkeleton(P){
  const round0 = [];
  for(let i=0;i<P/2;i++){
    round0.push({id:uid(), round:0, slot:i,
      p1:null, p2:null,
      score1:null,score2:null,peno1:null,peno2:null,status:'empty',reportedBy:null,confirmedBy:null,dispute:null,mustReReportBy:null,
      legs: P===2 ? 1 : 2,
      leg1:null,
      leg2:null,
      agg1:null,
      agg2:null,
      aggPeno1:null,
      aggPeno2:null
    });
  }
  const rounds=[round0];
  let m = P/2;
  while(m>1){
    m = m/2;
    rounds.push(Array.from({length:m},(_,idx)=>({id:uid(),round:rounds.length,slot:idx,
      p1:null,p2:null,score1:null,score2:null,peno1:null,peno2:null,status:'empty',reportedBy:null,confirmedBy:null,dispute:null,mustReReportBy:null,
      legs: (rounds.length===Math.log2(P)-1) ? 1 : 2,
      leg1:null,
      leg2:null,
      agg1:null,
      agg2:null,
      aggPeno1:null,
      aggPeno2:null
    })));
  }
  return {size:P, rounds};
}

function startKnockoutDraw(entrants, P){
  const pairings = buildAllowedPairings(entrants);
  if(!pairings) return 'No se pudo hacer el sorteo sin cruces entre jugadores del mismo nombre base (antes del "-").';
  state.bracket = buildKnockoutSkeleton(P);
  state.knockoutDraw = {
    pairings,
    revealed: 0,
    startedAt: null,
    nextRevealAt: null,
    complete: false
  };
  return null;
}

function revealNextDrawPair(){
  if(!state.knockoutDraw || state.knockoutDraw.complete) return false;
  const idx = state.knockoutDraw.revealed;
  const pair = state.knockoutDraw.pairings[idx];
  if(!pair) return false;
  const match = state.bracket.rounds[0][idx];
  match.p1 = pair[0];
  match.p2 = pair[1];
  state.knockoutDraw.revealed++;
  log('Sistema', 'Sorteo: '+playerName(pair[0])+' vs '+playerName(pair[1]));
  if(state.knockoutDraw.revealed >= state.knockoutDraw.pairings.length){
    state.knockoutDraw.complete = true;
    state.knockoutDraw.nextRevealAt = null;
    log('Sistema', 'Sorteo finalizado. Empieza la fase eliminatoria.');
  } else {
    state.knockoutDraw.nextRevealAt = Date.now() + 10000;
  }
  return true;
}

function processKnockoutDrawClock(){
  if(!state?.knockoutDraw || !state.knockoutDraw.startedAt || state.knockoutDraw.complete) return;
  let changed = false;
  while(state.knockoutDraw.nextRevealAt && Date.now()>=state.knockoutDraw.nextRevealAt){
    if(!revealNextDrawPair()) break;
    changed = true;
  }
  if(changed) saveAndRender();
}
function propagateBracket(){
  const br = state.bracket;
  if(!br) return;
  for(let r=0;r<br.rounds.length;r++){
    br.rounds[r].forEach(m=>{
      if(m.legs===2) updateTieWinner(m);
      if(m.status==='confirmed' && m.winner){
        const currentSize = br.size / Math.pow(2,r);
        const nxt = nextRoundBonusBySize(currentSize);
        if(nxt && r+1 < br.rounds.length){
          addMoney(m.winner, nxt.amount, `ko:${state.season}:${m.id}:${nxt.key}:${m.winner}`, nxt.label);
        }
        if(r+1 < br.rounds.length){
          const next = br.rounds[r+1][Math.floor(m.slot/2)];
          if(m.slot%2===0) next.p1 = m.winner; else next.p2 = m.winner;
        } else {
          if(!state.champion){
            state.champion = m.winner;
            state.phase='finished';
            const loser = m.winner===m.p1? m.p2 : m.p1;
            addMoney(loser, state.finance.prizes.runnerUp, `ko:${state.season}:${m.id}:runner:${loser}`, 'subcampeón');
            addMoney(m.winner, state.finance.prizes.champion, `ko:${state.season}:${m.id}:champ:${m.winner}`, 'campeón');
            log('Sistema', 'Campeón decidido: '+playerName(m.winner));
          }
        }
      }
    });
  }
}
function playerName(id){ const p=state.players.find(x=>x.id===id); return p? p.name : '—'; }

/* ---------------- RESULT REPORTING (generic, anti-cheat) ---------------- */
function findPlayer(id){ return state.players.find(p=>p.id===id); }

function addMoney(playerId, amount, reasonKey, reasonText){
  if(!state.finance.applied) state.finance.applied = {};
  if(!state.finance.lifetimeByPlayer) state.finance.lifetimeByPlayer = {};
  if(state.finance.applied[reasonKey]) return;
  const p = findPlayer(playerId);
  if(!p) return;
  if(typeof p.money!=='number') p.money = 0;
  p.money += amount;
  state.finance.lifetimeByPlayer[playerId] = (state.finance.lifetimeByPlayer[playerId]||0) + amount;
  state.finance.applied[reasonKey] = true;
  log('Sistema', `${p.name} recibe ${fmtMoney(amount)} por ${reasonText}.`);
}

function fmtMoney(n){
  return new Intl.NumberFormat('es-ES', { style:'currency', currency:'EUR', maximumFractionDigits:0 }).format(n);
}

function getQualifiedIds(){ return Array.isArray(state.qualifiers) ? state.qualifiers : []; }
function getNonQualifiedIds(){
  const q = new Set(getQualifiedIds());
  return state.players.map(p=>p.id).filter(id=>!q.has(id));
}
function getBetOptionFromMatch(match){
  if(match.score1===null || match.score2===null) return null;
  if(match.score1>match.score2) return 'home';
  if(match.score2>match.score1) return 'away';
  return 'draw';
}
function getMinimumQualifiedMoney(){
  const q = getQualifiedIds();
  if(!q.length) return Infinity;
  const vals = q.map(id=> findPlayer(id)?.money ?? 0);
  return Math.min(...vals);
}
function getBetMoneyCeiling(){
  const champCap = Math.max(0, state.bets.championMoneyCap || state.finance.prizes.champion);
  const qualCap = getMinimumQualifiedMoney();
  return Math.max(0, Math.min(champCap, qualCap));
}
function getMaxStakeForPlayer(playerId){
  const bettor = findPlayer(playerId);
  if(!bettor) return 0;
  const balance = Math.max(0, Math.floor(bettor.money || 0));
  const byPct = Math.max(0, Math.floor(balance * state.bets.maxStakePct));
  return Math.min(balance, byPct);
}
function getStakePresets(maxStake){
  const safeMax = Math.max(0, Math.floor(maxStake || 0));
  if(safeMax<=0) return [];
  const low = Math.max(1, Math.floor(safeMax * 0.34));
  const mid = Math.max(1, Math.floor(safeMax * 0.67));
  const high = safeMax;
  return [low, mid, high];
}
function getOpenBetTicket(playerId, matchId){
  return state.bets.tickets.find(t=> t.playerId===playerId && t.matchId===matchId && t.status==='open');
}
function findMatchForTicket(matchId){
  let match = (state.leagueMatches || []).find(m=> m.id===matchId);
  if(match) return match;
  match = (state.playoffMatches || []).find(m=> m.id===matchId);
  if(match) return match;
  if(state.bracket?.rounds){
    for(const round of state.bracket.rounds){
      for(const tie of round){
        if(tie.id===matchId) return tie;
        if(tie.leg1?.id===matchId) return tie.leg1;
        if(tie.leg2?.id===matchId) return tie.leg2;
      }
    }
  }
  return null;
}
function renderBetActivityBoard(title){
  const card = el(`<div class="card bet-arcade"><h3>${title}</h3><div class="muted" style="margin-bottom:8px;">Vista compartida de apuestas de todos los jugadores en esta temporada.</div><div class="bet-rail"></div></div>`);
  const rail = card.querySelector('.bet-rail');
  const tickets = (state.bets?.tickets || [])
    .filter(t=> t.season===state.season)
    .slice()
    .reverse();
  if(!tickets.length){
    rail.appendChild(el(`<div class="muted">Todavía no hay apuestas registradas en esta temporada.</div>`));
    return card;
  }
  tickets.forEach(t=>{
    const m = findMatchForTicket(t.matchId);
    const fallbackHome = t.homeName || 'Jugador 1';
    const fallbackAway = t.awayName || 'Jugador 2';
    const pickTxt = m
      ? getPickLabelForMatch(m, t.pick)
      : (t.pick==='home' ? fallbackHome : (t.pick==='away' ? fallbackAway : 'Empate'));
    const matchTxt = m ? `${playerName(m.p1)} vs ${playerName(m.p2)}` : `${fallbackHome} vs ${fallbackAway}`;
    const statusTag = t.status==='open'
      ? '<span class="tag pending">abierta</span>'
      : (t.status==='settled'
        ? `<span class="tag ${t.won?'confirmed':'dispute'}">${t.won?'ganada':'perdida'}</span>`
        : '<span class="tag empty">anulada</span>');
    const tone = t.status==='open' ? 'open' : (t.status==='settled' ? (t.won ? 'won' : 'lost') : 'void');
    const payoutTxt = t.status==='open'
      ? 'Pendiente de resolución.'
      : (t.status==='settled'
        ? (t.won ? `Cobro: ${fmtMoney(t.payout||0)}.` : `Pérdida: ${fmtMoney(t.stake||0)}.`)
        : 'Apuesta anulada.');
    rail.appendChild(el(`<div class="bet-ticket ${tone}"><div class="bet-ticket-head"><span class="bet-ticket-player">${playerName(t.playerId)}</span>${statusTag}</div><div class="meta"><b>${fmtMoney(t.stake||0)}</b> · ${pickTxt}</div><div class="meta">${matchTxt}</div><div class="meta" style="margin-top:4px;">${payoutTxt}</div></div>`));
  });
  return card;
}
function getPickLabelForMatch(match, pick){
  if(!match) return pick==='draw' ? 'Empate' : 'Ganador';
  if(pick==='home') return playerName(match.p1);
  if(pick==='away') return playerName(match.p2);
  return 'Empate';
}
function fillPickOptions(selectEl, match){
  if(!selectEl) return;
  selectEl.innerHTML = '';
  selectEl.appendChild(el(`<option value="home">Gana ${playerName(match.p1)}</option>`));
  selectEl.appendChild(el(`<option value="draw">Empate</option>`));
  selectEl.appendChild(el(`<option value="away">Gana ${playerName(match.p2)}</option>`));
}
function getBettableMatches(){
  if(state.phase==='league'){
    return state.leagueMatches.filter(m=> m.p1 && m.p2);
  }
  const matches = [];
  if(!state.bracket?.rounds) return matches;
  state.bracket.rounds.forEach(round=>{
    round.forEach(tie=>{
      if(!tie.p1 || !tie.p2) return;
      if(tie.legs===2){
        matches.push(ensureTieLeg(tie, 1));
        matches.push(ensureTieLeg(tie, 2));
      } else {
        matches.push(tie);
      }
    });
  });
  return matches;
}
function canOpenBetForMatch(match){
  if(!match || !match.p1 || !match.p2) return false;
  if(match.status==='confirmed') return false;
  if(state.phase!=='league' && state.phase!=='knockout' && state.phase!=='playoff') return false;
  const bettors = getEligibleBettorsForMatch(match);
  if(!bettors.length) return false;
  const bettorId = bettors[0].id;
  if(getOpenBetTicket(bettorId, match.id)) return false;
  return true;
}
function getEligibleBettorsForMatch(match){
  if(!state.myPlayerId) return [];
  if(state.phase==='league'){
    const p = findPlayer(state.myPlayerId);
    if(!p) return [];
    return (p.id!==match.p1 && p.id!==match.p2) ? [p] : [];
  }
  if(state.phase==='knockout' || state.phase==='playoff'){
    if(getQualifiedIds().includes(state.myPlayerId)) return [];
    const p = findPlayer(state.myPlayerId);
    return p ? [p] : [];
  }
  return [];
}
function openBetForMatchModal(matchId){
  const match = getBettableMatches().find(m=> m.id===matchId) || state.leagueMatches.find(m=> m.id===matchId);
  if(!match) return;
  if(!canOpenBetForMatch(match)){
    alert('Este partido no está disponible para apuestas en este momento.');
    return;
  }
  const bettors = getEligibleBettorsForMatch(match);
  if(!bettors.length){
    alert('No hay apostadores disponibles para este partido.');
    return;
  }

  pendingModal = ()=>{
    const header = `${playerName(match.p1)} vs ${playerName(match.p2)}`;
    const bg = el(`<div class="modal-bg"><div class="modal">
      <span class="close">✕</span>
      <h3>Apostar en ${header}</h3>
      <div class="muted" style="margin-bottom:10px;">Elige pronóstico y monto para este emparejamiento.</div>
      <label>Apostador</label><input id="bm-bettor" type="text" disabled>
      <label>Pronóstico</label>
      <select id="bm-pick"></select>
      <label>Monto</label>
      <input type="number" id="bm-stake" min="1" step="1" readonly>
      <div id="bm-max" class="muted" style="margin-bottom:8px;"></div>
      <div id="bm-presets" class="bet-presets" style="margin-bottom:10px;"></div>
      <div id="bm-err" class="muted" style="color:#ffb3ad;margin-bottom:10px;"></div>
      <button id="bm-go" class="gold" type="button">Registrar apuesta</button>
    </div></div>`);

    const close = ()=>{ pendingModal=null; render(); };
    bg.querySelector('.close').onclick = close;

    const bettorEl = bg.querySelector('#bm-bettor');
    const pickEl = bg.querySelector('#bm-pick');
    const stakeEl = bg.querySelector('#bm-stake');
    const maxEl = bg.querySelector('#bm-max');
    const presetsEl = bg.querySelector('#bm-presets');
    const errEl = bg.querySelector('#bm-err');

    bettorEl.value = `${bettors[0].name} (${fmtMoney(bettors[0].money||0)})`;
    bettorEl.dataset.playerId = bettors[0].id;
    fillPickOptions(pickEl, match);

    function selectedBettorId(){
      return bettorEl.dataset.playerId;
    }
    function refreshStakeOptions(){
      const pid = selectedBettorId();
      const maxStake = pid ? getMaxStakeForPlayer(pid) : 0;
      maxEl.textContent = `Máximo que puedes apostar: ${fmtMoney(maxStake)}`;
      presetsEl.innerHTML = '';
      let selected = null;
      getStakePresets(maxStake).forEach((amount, idx)=>{
        const b = el(`<button type="button" class="small ${idx===2?'active':''}">${fmtMoney(amount)}</button>`);
        if(idx===2) selected = amount;
        b.onclick = ()=>{
          selected = amount;
          stakeEl.value = String(amount);
          presetsEl.querySelectorAll('button').forEach(x=> x.classList.remove('active'));
          b.classList.add('active');
        };
        presetsEl.appendChild(b);
      });
      stakeEl.value = selected!==null ? String(selected) : '';
    }

    refreshStakeOptions();

    bg.querySelector('#bm-go').onclick = ()=>{
      const playerId = selectedBettorId();
      const pick = pickEl.value;
      const stake = parseInt(stakeEl.value);
      const e = placeBet(playerId, match.id, pick, stake);
      if(e){ errEl.textContent = e; return; }
      pendingModal = null;
      render();
    };

    return bg;
  };
  render();
}
function placeBet(playerId, matchId, pick, stake){
  const bettor = findPlayer(playerId);
  if(!bettor) return 'Apostador no encontrado.';
  if(!state.myPlayerId || playerId!==state.myPlayerId) return 'Solo puedes apostar con tu jugador activo.';
  const isLeagueMode = state.phase==='league';
  const isKnockoutMode = state.phase==='knockout' || state.phase==='playoff';
  if(!isLeagueMode && !isKnockoutMode) return 'Las apuestas solo se permiten en liguilla o eliminatorias.';
  if(isKnockoutMode && getQualifiedIds().includes(playerId)) return 'Solo pueden apostar los jugadores que no clasificaron a eliminatorias.';
  const match = isLeagueMode
    ? state.leagueMatches.find(m=> m.id===matchId)
    : getBettableMatches().find(m=> m.id===matchId);
  if(!match) return 'Partido no disponible para apostar.';
  if(isLeagueMode && (match.p1===playerId || match.p2===playerId)){
    return 'En liguilla, solo puede apostar un jugador que no participe en ese partido.';
  }
  if(match.status==='confirmed') return 'Ese partido ya está cerrado para apuestas.';
  if(!['home','draw','away'].includes(pick)) return 'Selección de apuesta inválida.';
  if(Number.isNaN(stake) || stake<=0) return 'Cantidad de apuesta inválida.';
  if(getOpenBetTicket(playerId, matchId)) return 'Ya tienes una apuesta abierta en este partido.';
  const maxStake = getMaxStakeForPlayer(playerId);
  if(stake>maxStake) return `Tu apuesta máxima en este momento es ${fmtMoney(maxStake)}.`;
  if(stake>(bettor.money||0)) return 'No tienes saldo suficiente.';

  bettor.money -= stake;
  state.bets.tickets.push({
    id: uid(),
    season: state.season,
    playerId,
    matchId,
    homeName: playerName(match.p1),
    awayName: playerName(match.p2),
    pick,
    stake,
    status:'open',
    settledAt:null,
    payout:0,
    won:false
  });
  log(playerName(playerId), `apostó ${fmtMoney(stake)} en ${playerName(match.p1)} vs ${playerName(match.p2)} (${getPickLabelForMatch(match, pick)}).`);
  saveAndRender();
  return null;
}
function settleBetsForMatch(match){
  const option = getBetOptionFromMatch(match);
  if(!option) return;
  const open = state.bets.tickets.filter(t=> t.matchId===match.id && t.status==='open');
  if(!open.length) return;

  open.forEach(t=>{
    const bettor = findPlayer(t.playerId);
    if(!bettor){ t.status='void'; t.settledAt=nowStr(); return; }
    t.status='settled';
    t.settledAt = nowStr();
    if(t.pick===option){
      // Cuota fija simple 2.0: recupera stake y gana stake.
      const grossPayout = t.stake * 2;
      const ceiling = getBetMoneyCeiling();
      const maxAdd = Math.max(0, Math.floor(ceiling - (bettor.money||0)));
      const applied = Math.max(0, Math.min(grossPayout, maxAdd));
      if(applied>0){
        bettor.money += applied;
        state.finance.lifetimeByPlayer[t.playerId] = (state.finance.lifetimeByPlayer[t.playerId]||0) + applied;
      }
      t.payout = applied;
      t.won = applied>0;
      log('Sistema', `${playerName(t.playerId)} ${applied>0?'ganó':'acertó pero alcanzó el tope de apuestas,'} ${applied>0?fmtMoney(applied):'sin cobro adicional'} en apuesta del partido ${playerName(match.p1)} vs ${playerName(match.p2)}.`);
    } else {
      t.payout = 0;
      t.won = false;
      log('Sistema', `${playerName(t.playerId)} perdió ${fmtMoney(t.stake)} en apuesta del partido ${playerName(match.p1)} vs ${playerName(match.p2)}.`);
    }
  });
}

function registerLeagueMoney(match){
  const kBase = `league:${match.id}`;
  if(match.score1>match.score2){
    addMoney(match.p1, state.finance.prizes.leagueWin, `${kBase}:w:${match.p1}`, 'victoria en liguilla');
  } else if(match.score2>match.score1){
    addMoney(match.p2, state.finance.prizes.leagueWin, `${kBase}:w:${match.p2}`, 'victoria en liguilla');
  } else {
    addMoney(match.p1, state.finance.prizes.leagueDraw, `${kBase}:d:${match.p1}`, 'empate en liguilla');
    addMoney(match.p2, state.finance.prizes.leagueDraw, `${kBase}:d:${match.p2}`, 'empate en liguilla');
  }
}

function reportResult(match, byId, score1, score2, peno1, peno2, decisive){
  const player = findPlayer(byId);
  if(!player) return 'Jugador no encontrado.';
  if(state.myPlayerId && byId!==state.myPlayerId) return 'Solo puedes reportar con tu jugador activo.';
  if(match.p1!==byId && match.p2!==byId) return 'No formas parte de este partido.';
  if(match.status==='pending') return 'Este resultado está pendiente de aceptación/rechazo del rival.';
  if(match.mustReReportBy && byId!==match.mustReReportBy) return 'El jugador que reportó inicialmente debe volver a cargar el resultado.';

  if(decisive && score1===score2){
    if(peno1===null||peno2===null||peno1===peno2) return 'En esta fase no puede haber empate: indica el resultado de la tanda de penaltis.';
  }

  const proposed = { byId, score1, score2, peno1: decisive&&score1===score2?peno1:null, peno2: decisive&&score1===score2?peno2:null };

  match.score1 = score1;
  match.score2 = score2;
  match.peno1 = proposed.peno1;
  match.peno2 = proposed.peno2;
  match.status = 'pending';
  match.reportedBy = byId;
  match.confirmedBy = null;
  match.dispute = null;
  match.mustReReportBy = null;
  match.winner = null;

  log(player.name, 'propuso el resultado '+score1+'-'+score2+(match.peno1!==null?` (pen. ${match.peno1}-${match.peno2})`:''));
  saveAndRender();
  return null;
}

function acceptReportedResult(match, byId, decisive){
  const player = findPlayer(byId);
  if(!player) return 'Jugador no encontrado.';
  if(state.myPlayerId && byId!==state.myPlayerId) return 'Solo puedes aceptar con tu jugador activo.';
  if(match.status!=='pending') return 'Este partido no está pendiente.';
  if(byId!==match.p1 && byId!==match.p2) return 'No formas parte de este partido.';
  if(byId===match.reportedBy) return 'Quien reportó no puede auto-confirmar: debe aceptar el rival.';

  match.status='confirmed';
  match.confirmedBy = byId;
  match.mustReReportBy = null;
  if(decisive){
    if(match.score1>match.score2) match.winner=match.p1;
    else if(match.score2>match.score1) match.winner=match.p2;
    else match.winner = match.peno1>match.peno2? match.p1: match.p2;
  }
  if(state.phase==='league') registerLeagueMoney(match);
  if(state.phase==='league') settleBetsForMatch(match);
  if(state.phase==='knockout' || state.phase==='playoff') settleBetsForMatch(match);
  refreshLeagueAfterConfirmedResult();
  if(state.phase==='league') currentTab = 'league';
  log(player.name, 'aceptó el resultado '+match.score1+'-'+match.score2+(match.peno1!==null?` (pen. ${match.peno1}-${match.peno2})`:''));
  saveAndRender();
  return null;
}

function rejectReportedResult(match, byId){
  const player = findPlayer(byId);
  if(!player) return 'Jugador no encontrado.';
  if(state.myPlayerId && byId!==state.myPlayerId) return 'Solo puedes rechazar con tu jugador activo.';
  if(match.status!=='pending') return 'Este partido no está pendiente.';
  if(byId!==match.p1 && byId!==match.p2) return 'No formas parte de este partido.';
  if(byId===match.reportedBy) return 'Quien reportó no puede rechazarse a sí mismo.';

  const reporterId = match.reportedBy;
  const reporterName = playerName(reporterId);
  match.score1 = null;
  match.score2 = null;
  match.peno1 = null;
  match.peno2 = null;
  match.status = 'empty';
  match.confirmedBy = null;
  match.dispute = null;
  match.winner = null;
  match.mustReReportBy = reporterId;

  log(player.name, 'rechazó el resultado reportado por '+reporterName+'. '+reporterName+' debe cargarlo de nuevo.');

  return null;
}

function refreshLeagueAfterConfirmedResult(){

}

function adminOverride(match, score1, score2, peno1, peno2, decisive){
  match.score1=score1;
  match.score2=score2;
  match.peno1 = decisive&&score1===score2? peno1: null;
  match.peno2 = decisive&&score1===score2? peno2: null;
  match.status='confirmed';
  match.confirmedBy='admin';
  match.mustReReportBy = null;
  if(decisive){
    if(score1>score2) match.winner=match.p1;
    else if(score2>score1) match.winner=match.p2;
    else match.winner = match.peno1>match.peno2? match.p1: match.p2;
  }
  if(state.phase==='league') registerLeagueMoney(match);
  if(state.phase==='league') settleBetsForMatch(match);
  if(state.phase==='knockout' || state.phase==='playoff') settleBetsForMatch(match);
  refreshLeagueAfterConfirmedResult();
  if(state.phase==='league') currentTab = 'league';
  log('Organizador','resolvió/corrigió el resultado a '+score1+'-'+score2+(match.peno1!==null?` (pen. ${match.peno1}-${match.peno2})`:''));
  saveAndRender();
  return null;
}

/* ---------------- PHASE TRANSITIONS ---------------- */
function startLeague(){
  const ids = state.players.map(p=>p.id);
  if(!state.seasonKickoff) state.seasonKickoff = dayStr();
  state.players.forEach(p=> addMoney(p.id, state.finance.prizes.participation, `season:${state.season}:participation:${p.id}`, 'participación en Champions'));
  const firstLegRoundCount = ids.length % 2 === 0 ? Math.max(1, ids.length-1) : ids.length;
  let firstLegRounds = generateRoundRobinRounds(ids, firstLegRoundCount);
  firstLegRounds = firstLegRounds.map(round=> round.filter(([a,b])=> !cannotFaceEachOther(a,b)));
  const expectedUniquePairs = ids.reduce((acc, a, i)=>{
    for(let j=i+1;j<ids.length;j++) if(!cannotFaceEachOther(a, ids[j])) acc++;
    return acc;
  }, 0);
  const pairSet = new Set();
  firstLegRounds.forEach(round=> round.forEach(([a,b])=> pairSet.add([a,b].sort().join('|'))));
  if(pairSet.size !== expectedUniquePairs){
    // Fallback defensivo: construir cruces permitidos una vez para asegurar cobertura completa.
    const allPairs = [];
    for(let i=0;i<ids.length;i++){
      for(let j=i+1;j<ids.length;j++){
        if(!cannotFaceEachOther(ids[i], ids[j])) allPairs.push([ids[i], ids[j]]);
      }
    }
    const perRound = Math.max(1, Math.floor(ids.length/2));
    firstLegRounds = [];
    for(let i=0;i<allPairs.length;i+=perRound) firstLegRounds.push(allPairs.slice(i, i+perRound));
  }
  const secondLegRounds = firstLegRounds.map(pairs=> pairs.map(([a,b])=>[b,a]));
  const rounds = [...firstLegRounds, ...secondLegRounds].filter(pairs=> pairs.length>0);
  if(!rounds.length) return 'No se pudo generar la liguilla con los jugadores actuales. Revisa los nombres bloqueados por la regla de no enfrentarse entre mismos nombres base.';
  const matches=[];
  rounds.forEach((pairs, rIdx)=>{
    pairs.forEach(([a,b])=> matches.push({id:uid(), round:rIdx+1, p1:a, p2:b, score1:null,score2:null,
      status:'empty', reportedBy:null, confirmedBy:null, dispute:null, mustReReportBy:null}));
  });
  state.leagueMatches = matches;
  state.phase='league';
  log('Organizador','inició la fase de liguilla ('+rounds.length+' jornadas).');
  saveAndRender();
}

function closeLeague(){
  const standings = computeStandings();
  const Q = effectiveNumQualifiers();
  state.config.numQualifiers = Q;
  const tied = tiedGroupsAtCutoff(standings, Q);
  if(tied.length){
    return 'Hay un empate sin resolver entre los puestos que delimitan la clasificación. Resuélvelo abajo antes de continuar.';
  }
  const qualifiers = standings.slice(0,Q).map(s=>s.id);
  state.qualifiers = qualifiers;
  const Qn = qualifiers.length;
  const P = nearestPow2LE(Qn);
  const directCount = 2*P - Qn;
  const direct = qualifiers.slice(0, directCount);
  const playoffPool = qualifiers.slice(directCount);

  if(playoffPool.length===0){
    const drawErr = startKnockoutDraw(qualifiers, P);
    if(drawErr) return drawErr;
    const entry = firstKnockoutBonusBySize(P);
    if(entry){
      qualifiers.forEach(pid=> addMoney(pid, entry.amount, `ko:${state.season}:entry:${entry.key}:${pid}`, entry.label));
    }
    state.phase='knockout';
    log('Organizador','cerró la liguilla y generó el cuadro de eliminatorias directamente.');
  } else {
    const playoffPairs = buildAllowedPairings(playoffPool);
    if(!playoffPairs) return 'No se pudo generar play-off sin cruces entre jugadores del mismo nombre base (antes del "-").';
    const pairs=[];
    for(let i=0;i<playoffPairs.length;i++){
      pairs.push({id:uid(), seedSlot: directCount+i+1, p1: playoffPairs[i][0], p2: playoffPairs[i][1],
        score1:null,score2:null,peno1:null,peno2:null,status:'empty',reportedBy:null,confirmedBy:null,dispute:null,mustReReportBy:null});
    }
    state.playoffMatches = pairs;
    state._directQualifiers = direct;
    state._bracketSize = P;
    state.phase='playoff';
    log('Organizador','cerró la liguilla. '+direct.length+' jugadores pasan directos y '+pairs.length+' partidos de play-off decidirán el resto del cuadro.');
  }
  saveAndRender();
  return null;
}

function resolveTieByPenalties(ids, penaltiesById){
  const values = ids.map(id=> penaltiesById[id]);
  if(values.some(v=> Number.isNaN(v) || v<0)) return 'Debes indicar penaltis validos para todos los jugadores empatados.';
  if(new Set(values).size!==values.length) return 'No puede haber empate en la tanda: repite hasta que todos tengan valor distinto.';

  const order = [...ids].sort((a,b)=> penaltiesById[b]-penaltiesById[a]);
  order.forEach((id,i)=> state.tieResolution[id]=i);
  const resume = order.map(id=> `${playerName(id)} ${penaltiesById[id]}`).join(' · ');
  log('Organizador','desempate por tanda de penaltis en liguilla: '+resume);
  saveAndRender();
  return null;
}

function openLeagueTiePenaltyModal(ids){
  pendingModal = ()=>{
    const inputs = ids.map(id=>`
      <div><label>${playerName(id)}</label><input type="number" id="tp-${id}" min="0" placeholder="Penaltis anotados"></div>
    `).join('');
    const bg = el(`<div class="modal-bg"><div class="modal">
      <span class="close">✕</span>
      <h3>Desempate por penaltis</h3>
      <div class="muted" style="margin-bottom:10px;">Introduce el resultado de la tanda para cada jugador empatado. Deben quedar distintos.</div>
      <div class="row">${inputs}</div>
      <div id="tp-err" class="muted" style="color:#ffb3ad;"></div>
      <button id="tp-save" class="danger">Guardar tanda y desempatar</button>
    </div></div>`);
    bg.querySelector('.close').onclick=()=>{pendingModal=null; render();};
    bg.querySelector('#tp-save').onclick=()=>{
      const penaltiesById = {};
      ids.forEach(id=>{
        penaltiesById[id] = parseInt(bg.querySelector(`#tp-${id}`).value);
      });
      const err = resolveTieByPenalties(ids, penaltiesById);
      if(err){
        bg.querySelector('#tp-err').textContent = err;
        return;
      }
      pendingModal = null;
      render();
    };
    return bg;
  };
  render();
}

function closePlayoff(){
  const allDecided = state.playoffMatches.every(m=> m.status==='confirmed' && m.winner);
  if(!allDecided) return 'Aún hay partidos de play-off sin confirmar o sin ganador decidido.';
  const seedMap={};
  state._directQualifiers.forEach((id,i)=> seedMap[i+1]=id);
  state.playoffMatches.forEach(m=> seedMap[m.seedSlot]=m.winner);
  const entrants = Object.values(seedMap);
  const drawErr = startKnockoutDraw(entrants, state._bracketSize);
  if(drawErr) return drawErr;
  const entry = firstKnockoutBonusBySize(state._bracketSize);
  if(entry){
    entrants.forEach(pid=> addMoney(pid, entry.amount, `ko:${state.season}:entry:${entry.key}:${pid}`, entry.label));
  }
  state.phase='knockout';
  log('Organizador','cerró el play-off y generó el cuadro final de eliminatorias.');
  saveAndRender();
  return null;
}

function newSeason(){
  if(state.champion) state.pastChampions.unshift({season:state.season, champion:playerName(state.champion), kickoff:state.seasonKickoff, date:nowStr()});
  const n = (state.pastChampions.length+1);
  state.season = GAME_NAME+' - T'+n;
  state.seasonKickoff = null;
  state.phase='setup';
  state.leagueMatches=[]; state.playoffMatches=[]; state.bracket=null; state.champion=null;
  state.knockoutDraw = null;
  state.leagueTieBreaker = null;
  state.bets = {
    ...defaultState().bets,
    championMoneyCap: state.finance.prizes.champion
  };
  state.qualifiers=null; state.tieResolution={};
  state.history.unshift({ts:nowStr(), actor:'Organizador', action:'inició una nueva temporada.'});
  saveAndRender();
}

function restartCurrentSeason(){
  const keepSync = state.sync || defaultState().sync;
  const keepPastChampions = Array.isArray(state.pastChampions) ? [...state.pastChampions] : [];
  const keepSeason = state.season || (GAME_NAME+' - T1');

  state = defaultState();
  state.season = keepSeason;
  state.players = [];
  state.myPlayerId = null;
  state.pastChampions = keepPastChampions;
  state.sync = keepSync;
  state.finance.lifetimeByPlayer = {};
  state.history.unshift({ts:nowStr(), actor:'Organizador', action:'reinició la temporada actual y borró todos los jugadores.'});
  saveAndRender();
}

  const wrap = el(`<div class="stepper"></div>`);
  steps.forEach(([key,lab])=>{
    const idx = order.indexOf(key);
    const cls = idx===curIdx?'active':(idx<curIdx?'done':'');
    wrap.appendChild(el(`<div class="step ${cls}">${lab}</div>`));
  });
  return wrap;
}
